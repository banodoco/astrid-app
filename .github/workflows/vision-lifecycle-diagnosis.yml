name: Diagnose Vision lifecycle frame ownership
on:
  push:
    branches: [fix/vision-entry-header-20261114]
    paths: [.github/workflows/vision-lifecycle-diagnosis.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-entry-header-20261114
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Instrument unchanged frame assertion with deterministic content
        run: |
          mkdir -p lifecycle-evidence
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/PublicAstridSite.lifecycle.test.tsx')
          s=p.read_text()
          Path('lifecycle-evidence/original.test.tsx').write_text(s)
          s=s.replace("import { StrictMode } from 'react';", "import { StrictMode } from 'react';\nimport { visionFixture } from '../../../tests/fixtures/public-vision';")
          s=s.replace('  vi.useFakeTimers();', "  vi.useFakeTimers();\n  vi.stubGlobal('fetch', vi.fn(async () => new Response(JSON.stringify(visionFixture()), { status: 200 })));")
          s=s.replace('  vi.restoreAllMocks();', '  vi.unstubAllGlobals();\n  vi.restoreAllMocks();')
          Path('lifecycle-evidence/deterministic.test.tsx').write_text(s)
          s=s.replace('frames.set(++frameId, callback);', 'frames.set(++frameId, Object.assign(callback, { __origin: new Error().stack }));')
          s=s.replace('      expect(frames.size).toBe(0);', "      console.log('FRAME_ORIGINS', [...frames.values()].map(callback => (callback as FrameRequestCallback & { __origin: string }).__origin));\n      expect(frames.size).toBe(0);")
          p.write_text(s)
          PY
      - name: Require the original assertion to reproduce and identify its owner
        run: |
          set +e
          npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx -t 'retains Home state and scroll' > lifecycle-evidence/before.log 2>&1
          status=$?
          set -e
          cat lifecycle-evidence/before.log
          test "$status" -ne 0
          grep -q 'VisionSectionNav' lifecycle-evidence/before.log
      - name: Distinguish active navigation work from hidden Home work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/PublicAstridSite.lifecycle.test.tsx')
          s=Path('lifecycle-evidence/deterministic.test.tsx').read_text()
          old="""      const reads = vi.spyOn(home, 'getBoundingClientRect');
                fireEvent(window, new Event('resize'));
                await act(async () => { await vi.advanceTimersByTimeAsync(4_000); });
                expect(frames.size).toBe(0);
                expect(reads).not.toHaveBeenCalled();
                reads.mockRestore();"""
          # Match the repository's six-space indentation, not YAML indentation.
          old='\n'.join(line[10:] if line.startswith('                ') else line for line in old.splitlines())
          new="""      const reads = vi.spyOn(home, 'getBoundingClientRect');
                const visionReads = vi.spyOn(document.getElementById('astrid-vision-manifesto')!, 'getBoundingClientRect');
                fireEvent(window, new Event('resize'));
                await act(async () => { await vi.advanceTimersByTimeAsync(4_000); });
                // Loaded Vision owns exactly one resize measurement. Prove it
                // measures the active page, then leaves no recurring frames;
                // retained Home must still perform no geometry work at all.
                expect(frames.size).toBe(1);
                await paint();
                expect(visionReads).toHaveBeenCalled();
                expect(frames.size).toBe(0);
                expect(reads).not.toHaveBeenCalled();
                visionReads.mockRestore();
                reads.mockRestore();"""
          new='\n'.join(line[10:] if line.startswith('                ') else line for line in new.splitlines())
          assert s.count(old)==1,repr(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Prove deterministic lifecycle plus real loading contract twice
        run: |
          set -o pipefail
          for pass in 1 2; do
            npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx src/test/viteShareMeta.test.ts src/pages/Home/publicVisionContent.loading.test.tsx | tee lifecycle-evidence/after-$pass.log
          done
      - name: Commit only the proved test-environment correction
        run: |
          git add src/pages/Home/PublicAstridSite.lifecycle.test.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(vision): distinguish active section tracking from retained Home frames'
          git push origin HEAD:fix/vision-entry-header-20261114
      - name: Record source and diagnosis
        if: always()
        run: |
          git rev-parse HEAD > lifecycle-evidence/head.txt
          cp src/pages/Home/PublicAstridSite.lifecycle.test.tsx lifecycle-evidence/final.test.tsx
          git diff > lifecycle-evidence/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-lifecycle-diagnosis
          path: lifecycle-evidence/
          retention-days: 7
