name: Served manifest canary

on:
  deployment_status:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vision-page-canary:
    # Production smoke check: valid JSON alone does not prove /vision renders.
    if: ${{ github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Reigh / production') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check live Astrid vision page and feed
        run: node scripts/quality/check-public-vision-production.mjs

  canary:
    if: ${{ github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Reigh / production') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || 'main' }}
      - name: Resolve deployed commit
        id: deployed
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Check served manifest
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: node scripts/installer/served-manifest.mjs "$DEPLOYED_SHA"
