name: Landscape tablet investigation
on:
  push:
    branches: [fix/ipad-landscape-home-overflow-20261116]
    paths: [.github/workflows/ipad-landscape-investigation.yml]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install webkit
      - name: Inspect original Home layout and scrolled return
        shell: bash
        run: |
          mkdir -p landscape-evidence
          git rev-parse HEAD HEAD^{tree} > landscape-evidence/source.txt
          cat >> tests/e2e/public-astrid-home-chips.spec.ts <<'SPEC'
          test.describe('landscape overflow diagnostic', () => {
            test.use({ isMobile: true, hasTouch: true, deviceScaleFactor: 2, screen: { width: 1180, height: 820 } });
            test('inspect home layout and retained scroll', async ({ page }) => {
              test.setTimeout(240000);
              const rows: unknown[] = [];
              const inspect = async (phase: string) => page.evaluate(phase => {
                const rect = (n: Element) => n.getBoundingClientRect().toJSON();
                const selectors = ['html','body','#root','[data-astrid-page-away]','.astrid-public-site','.astrid-landing-grid','.astrid-hero-copy','.astrid-hero-note','.astrid-showcase','.astrid-editor-stage','.astrid-editor-tilt','.astrid-editor-surfaces'];
                const home = document.querySelector<HTMLElement>('.astrid-public-site')!;
                return { phase, width: innerWidth, height: innerHeight, scroll: scrollY, documentHeight: document.documentElement.scrollHeight, bodyHeight: document.body.scrollHeight,
                  single: getComputedStyle(home).getPropertyValue('--astrid-home-single-screen'),
                  viewport: visualViewport && { height: visualViewport.height, top: visualViewport.offsetTop, scale: visualViewport.scale },
                  boxes: selectors.flatMap(s => Array.from(document.querySelectorAll<HTMLElement>(s)).map(n => {
                    const c = getComputedStyle(n); return { selector: s, rect: rect(n), scrollHeight: n.scrollHeight, clientHeight: n.clientHeight,
                      height: c.height, minHeight: c.minHeight, overflow: c.overflow, position: c.position, grid: c.gridTemplateRows,
                      transform: c.transform, perspective: c.perspective, contain: c.contain };
                  })),
                  beyond: Array.from(home.querySelectorAll<HTMLElement>('*')).filter(n => n.getBoundingClientRect().bottom > innerHeight + 1 && n.getBoundingClientRect().height > 1)
                    .sort((a,b) => b.getBoundingClientRect().bottom - a.getBoundingClientRect().bottom).slice(0,20)
                    .map(n => ({ tag: n.tagName, cls: String(n.className), rect: rect(n), overflow: getComputedStyle(n).overflow, position: getComputedStyle(n).position })) };
              }, phase);
              for (const size of [{width:1180,height:820},{width:1180,height:700},{width:1180,height:640},{width:1099,height:700},{width:1024,height:680}]) {
                await page.setViewportSize(size);
                await page.goto('/home', { waitUntil: 'domcontentloaded' });
                await expect(page.locator('.astrid-callouts > article')).toHaveCount(3, { timeout: 60000 });
                await expect(page.locator('.astrid-editor-stage')).toHaveAttribute('data-revealed','true');
                await page.waitForTimeout(1800);
                for (const mode of ['app','agent']) {
                  await page.locator(`.astrid-audience-switch button[data-audience="${mode}"]`).tap();
                  await page.waitForTimeout(1500);
                  await page.evaluate(() => scrollTo({top:0,behavior:'instant'}));
                  rows.push({ mode, data: await inspect('natural-top') });
                  await page.screenshot({path:`landscape-evidence/home-${size.width}-${size.height}-${mode}.png`});
                  await page.evaluate(() => scrollTo({top:10000,behavior:'instant'}));
                  rows.push({ mode, data: await inspect('natural-bottom') });
                  await page.getByRole('link',{name:'Vision',exact:true}).click();
                  await expect(page.locator('.astrid-vision-principles > li')).toHaveCount(4);
                  await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
                  await page.evaluate(() => scrollTo({top:document.documentElement.scrollHeight,behavior:'instant'}));
                  await page.getByRole('link',{name:'Astrid home',exact:true}).click();
                  await expect(page.locator('.astrid-vision')).toHaveCount(0);
                  await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
                  rows.push({ mode, data: await inspect('vision-return') });
                  await page.evaluate(() => scrollTo({top:0,behavior:'instant'}));
                }
                writeFileSync('landscape-evidence/layout.json', JSON.stringify(rows,null,2));
              }
            });
          });
          SPEC
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=landscape-evidence/results.json npx playwright test --config playwright.home-webkit.config.ts --project=vision-webkit-phone --grep 'landscape overflow diagnostic' --workers=1 --reporter=json > landscape-evidence/raw.log 2>&1
          result=$?
          echo "$result" > landscape-evidence/exit.txt
          tar -cf landscape-evidence/source.tar src/pages/Home/PublicAstridShell.css src/pages/Home/PublicAstridSite.css src/pages/Home/PublicAstridSite.tsx src/pages/Home/PublicAstridCallouts.tsx src/pages/Home/publicAstridNavigation.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx tests/e2e/public-astrid-vision-entry.spec.ts
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-landscape-investigation
          path: landscape-evidence/
          if-no-files-found: error
