name: Qualify Vision backdrop repair
on:
  push:
    branches: [fix/vision-backdrop-flash-20261115]
    paths: [.github/workflows/vision-backdrop-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backdrop-flash-20261115
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Verify and apply exact reviewed repair
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          data = gzip.decompress(base64.b64decode(''''''))
          assert hashlib.sha256(data).hexdigest() == '5e54f0e0f4cae8c27de9a2db06e39b593a92a431338228fc8194f3c03ec66603', 'Transport mismatch; do not apply'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          PY
      - run: npm ci --legacy-peer-deps
      - name: Verify syntax, lifecycle and lint
        run: |
          node --check scripts/quality/check-public-vision-production.mjs
          npx eslint src/pages/Home/VisionDialog.tsx --max-warnings 0
          npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium colour continuity
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/backdrop-chromium.json
        run: npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --project=chromium-desktop --grep 'popup shading never|shared popup reveal' --output=test-results/backdrop-chromium --reporter=line,json
      - name: WebKit colour continuity
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/backdrop-webkit.json
        run: npx playwright test --config playwright.vision.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --grep 'popup shading never|shared popup reveal' --output=test-results/backdrop-webkit --reporter=line,json
      - name: Commit qualified source and regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
          git commit -m 'fix(vision): drive popup and backdrop from one monotonic reveal'
          git push origin HEAD:fix/vision-backdrop-flash-20261115
      - name: Preserve exact candidate and diff
        if: always()
        run: |
          mkdir -p test-results/vision-captures
          git rev-parse HEAD > test-results/vision-captures/backdrop-head.txt
          git diff > test-results/vision-captures/backdrop-working.patch
          tar -cf test-results/vision-captures/backdrop-source.tar src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-backdrop-repaired
          path: test-results/vision-captures/
          retention-days: 7
