# Default Vitest run per push, including Release 14's plan branch (testing plan UP.1). The checkout lane (npm run test:checkout) needs sibling repos and does not run here.
name: Tests

on:
  push:
    branches: [main, release-1, "int/**", "release/*/main", "release/14/plan-39"]
  pull_request:
    branches: [main, "release/*/main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A later push to main must never cancel the release guard for an earlier one: every push to main is checked.
  # Release mains (release/<N>/main) are exempt too: each push to them runs in full.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

jobs:
  # Install tuple (manifest minus release/required, plus public/install*) and release move together:
  # a tuple change needs release +1 exactly; otherwise release is unchanged. Base is the PR base or the push's before SHA.
  release-guard:
    # Only against main: inside a release branch the tuple may change more than once before publication,
    # and the guard's "+1 exactly" is checked when main is fast-forwarded to the release branch.
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Check install tuple and release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/installer/release-guard.mjs "$BASE_SHA" HEAD --pins

  # A pull request into a release branch comes from a branch of that release and names what it belongs
  # to: the plan (a plan branch does so by its name) or the astrid-dev issue. See the Release skill,
  # "How a release runs".
  landing-reference:
    name: landing reference
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from a branch of this release and names its plan or issue
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          release="${BASE_REF#release/}"; release="${release%/main}"
          if ! printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/[a-z0-9][a-z0-9-]*$" || [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::A pull request into ${BASE_REF} must come from a branch of that release: release/${release}/plan-<PP> or release/${release}/<topic>. This one comes from '${HEAD_REF}'."
            exit 1
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/plan-[0-9]+$"; then
            echo "Plan branch: $HEAD_REF"; exit 0
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq '(plan[ -]?[0-9]+|astrid-dev#[0-9]+|astrid-dev/issues/[0-9]+)'; then
            echo "Reference found."; exit 0
          fi
          echo "::error::A pull request into a release branch must name the plan or the astrid-dev issue it belongs to, for example 'Plan 55' or 'banodoco/astrid-dev#721'."
          exit 1

  # Pull requests into main run only release-guard above. Pull requests into a release main also run vitest and
  # boundary; release-tooling-macos stays push-only (macOS runner cost) and runs on the push to the release branch.
  vitest:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main')) }}
    # Pinned: Playwright does not support Chromium on ubuntu-latest (ubuntu 26.04) for this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the git-backed checks that run on push.
          fetch-depth: 0
          filter: blob:none
      - name: Read the Agent and Runtime pins from the App manifest
        id: pins
        run: |
          node -e '
            const m = require("./public/install-manifest.json");
            const agent = m.agent?.sha, runtime = m.runtime?.sha;
            for (const sha of [agent, runtime]) if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error(`manifest pin is not a full SHA: ${sha}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `agent_sha=${agent}\nruntime_sha=${runtime}\n`);'
      - name: Restore npm cache (C-08)
        id: c08-app-test-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: node --test scripts/installer/release.test.mjs
      - run: npm ci --legacy-peer-deps
      # The P1 corpus tests read git blobs from the Agent at the release-12 pin (public/install-manifest.json).
      # ASTRID_AGENT_CHECKOUT points them there; a missing checkout fails the test instead of skipping it.
      - name: Check out the pinned Agent for the P1 corpus
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-agent
          fetch-depth: 0
      # Browser-backed unit tests launch Playwright's Chromium from the default cache.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Prepare Vitest result directory
        run: mkdir -p "$RUNNER_TEMP/vitest-results"
        shell: bash
      - run: npm test
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
          VITEST_JUNIT_OUTPUT: ${{ runner.temp }}/vitest-results/vitest-app.xml
      - name: Run SDK boundary Vitest suite
        run: npm run test:sdk-boundary
        env:
          VITEST_JUNIT_OUTPUT: ${{ runner.temp }}/vitest-results/vitest-sdk-boundary.xml
      - name: Summarize Vitest result XML
        if: always()
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/vitest-results
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = sorted(Path(os.environ['TEST_RESULTS_DIR']).glob('*.xml'))
          if not files:
              print('JUnit: no XML files; no test result available')
              raise SystemExit(1)
          totals = [0, 0, 0, 0]
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              counts = [sum(int(suite.get(key, '0')) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')]
              print(f'{path.name}: tests={counts[0]} failures={counts[1]} errors={counts[2]} skipped={counts[3]}')
              totals = [left + right for left, right in zip(totals, counts)]
          line = f'JUnit total: tests={totals[0]} failures={totals[1]} errors={totals[2]} skipped={totals[3]}'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(line + '\n')
          PY
      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-vitest-all-${{ runner.os }}
          path: ${{ runner.temp }}/vitest-results/*.xml
          retention-days: 90
          if-no-files-found: warn

  # The release tooling is macOS-only by design (lockf broker, BSD ps eww, darwin-pinned attestation), so the vitest job
  # declares these cases as skipped (config/testing/skipRegistry.mjs: macos-release-process-containment, macos-lockf-broker)
  # and this job runs exactly those files where the condition holds. Plain node: these files import only the repo.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-app-test-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

  release-tooling-macos:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/release/bounded-command.test.mjs scripts/release/astrid-release-provenance.test.mjs scripts/release/verify-extension-ship.test.mjs

  # Cross-repo copies: every vendored artifact must match its selected producer commit.
  boundary:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - id: pins
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const runtime = JSON.parse(fs.readFileSync('runtime.lock.json', 'utf8'));
          const astrid = JSON.parse(fs.readFileSync('config/astrid-cli-surface/vendor.lock.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/install-manifest.json', 'utf8'));
          process.stdout.write(`runtime_sha=${runtime.source_commit}\nastrid_sha=${astrid.source_commit}\nagent_sha=${manifest.agent.sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime_sha }}
          path: runtime-producer
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-producer
      - run: |
          node scripts/vendor-lock.mjs check runtime.lock.json --producer runtime-producer
      - run: node scripts/vendor-lock.mjs check config/astrid-cli-surface/vendor.lock.json --producer astrid-producer
      - run: node --test scripts/quality/astrid-public-boundary.test.mjs
      - run: node scripts/build/verify-astrid-vendor-sources.mjs
