name: Apply principle colour refinement
on:
  push:
    branches: [fix/vision-polish-opening-20261114]
    paths: [.github/workflows/vision-colour-refinement.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-polish-opening-20261114
      - name: Apply reviewed colour styles and focused checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
              'src/pages/Home/VisionMobileLayout.css': '30c087b78fa797e26cd190675adf0d2cb4dc187a',
              'tests/e2e/public-astrid-vision-polish.spec.ts': 'b8d97d5a19a012e7fbeb792d0bfdd4e8dd59a6a0',
              'tests/e2e/public-astrid-vision-content.spec.ts': '55d6fb1ea07ab25ebca1f2cf54e23ca6bf583790',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path], text=True).strip() == sha, path
          css = Path('src/pages/Home/VisionMobileLayout.css')
          css.write_text(css.read_text() + '''
          /* One colour identity per principle. Keep the surface translucent,
             not the whole card: text remains fully opaque and readable. */
          .astrid-vision .astrid-vision-standards-list > li {
            --principle-heading-day: color-mix(in srgb, var(--sigil-ink) 65%, #25241f);
            --principle-copy-day: color-mix(in srgb, var(--sigil-ink) 88%, #25241f);
            --principle-copy-night: color-mix(in srgb, var(--sigil-bg) 80%, #aca395);
            --principle-tint: color-mix(in oklab, var(--sigil-ink), var(--sigil-bg) calc(var(--astrid-dusk-ink, 0) * 100%));
            --principle-heading: color-mix(in oklab, color-mix(in oklab, var(--principle-heading-day), var(--sigil-bg) calc(var(--astrid-dusk-ink, 0) * 100%)), var(--astrid-ink) calc(var(--astrid-dusk-firm, 0) * 100%));
            --principle-copy: color-mix(in oklab, color-mix(in oklab, var(--principle-copy-day), var(--principle-copy-night) calc(var(--astrid-dusk-ink, 0) * 100%)), var(--astrid-ink) calc(var(--astrid-dusk-firm, 0) * 100%));
            background: color-mix(in srgb, var(--principle-tint) 9%, transparent);
            border-color: color-mix(in srgb, var(--principle-tint) 30%, transparent);
          }
          .astrid-vision .astrid-vision-standards-list > li h3 { color: var(--principle-heading); }
          .astrid-vision .astrid-vision-standards-list > li :is(.astrid-vision-principle-statement, .astrid-vision-markdown, .astrid-vision-markdown p) { color: var(--principle-copy); }
          .astrid-vision .astrid-vision-standards-list > li .astrid-vision-principle-corner { color: var(--principle-copy); opacity: 1; }
          ''')
          path = Path('tests/e2e/public-astrid-vision-content.spec.ts')
          text = path.read_text()
          old = "card.border === 'solid' && card.background === 'rgba(0, 0, 0, 0)'"
          assert text.count(old) == 1
          path.write_text(text.replace(old, "card.border === 'solid' && card.background !== 'rgba(0, 0, 0, 0)'"))
          path = Path('tests/e2e/public-astrid-vision-polish.spec.ts')
          text = path.read_text()
          old = "    await expect.poll(() => page.evaluate(() => window.scrollY)).toBeCloseTo(before, 0);"
          assert text.count(old) == 1
          text = text.replace("    await opener.click();\n    const dialog", "    await opener.evaluate(node => {\n      node.addEventListener('pointerdown', () => {\n        (window as typeof window & { __openerScroll?: number }).__openerScroll = window.scrollY;\n      }, { once: true, capture: true });\n    });\n    await opener.click();\n    const dialog", 1)
          text = text.replace(old, "    writeFileSync(`${folder}/closing-restoration-${info.project.name}-${index}.json`, JSON.stringify({ before, state: await page.evaluate(() => ({ scrollY: window.scrollY, openerScroll: (window as typeof window & { __openerScroll?: number }).__openerScroll, maxScroll: document.documentElement.scrollHeight - window.innerHeight, active: document.activeElement?.outerHTML.slice(0, 300), body: document.body.getAttribute('style') })) }, null, 2));\n" + old)
          text += r'''

          for (const width of [390, 1440]) {
            test(`principles retain four translucent colour identities and readable text at ${width}px`, async ({ page }, info) => {
              const feed = await pinLive(page);
              await page.setViewportSize({ width, height: 900 });
              await page.emulateMedia({ reducedMotion: 'reduce' });
              await page.goto('/vision', { waitUntil: 'domcontentloaded' });
              const cards = page.locator('.astrid-vision-standards-list > li');
              await expect(cards).toHaveCount(4);
              await page.evaluate(() => document.fonts.ready);
              mkdirSync(folder, { recursive: true });
              await page.locator('.astrid-vision-standards').screenshot({ path: `${folder}/real-coloured-principles-${info.project.name}-${width}.png` });
              const measurements: unknown[] = [];
              for (const mode of ['light', 'dark'] as const) {
                const paper = mode === 'light' ? '#f7f5ef' : '#0d0e17';
                const ink = mode === 'light' ? '#25241f' : '#f3eee4';
                const dusk = mode === 'light' ? 0 : 1;
                const control = await page.addStyleTag({ content: `main.astrid-vision { --astrid-paper: ${paper} !important; --astrid-ink: ${ink} !important; --astrid-dusk-ink: ${dusk} !important; --astrid-dusk-firm: 0 !important; }` });
                const colours = await cards.evaluateAll((nodes, paper) => {
                  const canvas = document.createElement('canvas'); canvas.width = canvas.height = 1;
                  const ctx = canvas.getContext('2d', { willReadFrequently: true })!;
                  const rgba = (value: string) => {
                    ctx.clearRect(0, 0, 1, 1); ctx.fillStyle = value; ctx.fillRect(0, 0, 1, 1);
                    const data = ctx.getImageData(0, 0, 1, 1).data;
                    return [data[0], data[1], data[2], data[3] / 255];
                  };
                  const over = (fg: number[], bg: number[]) => fg.slice(0, 3).map((v, i) => v * fg[3] + bg[i] * (1 - fg[3]));
                  const luminance = (rgb: number[]) => rgb.slice(0, 3).map(v => v / 255).map(v => v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4).reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
                  const contrast = (fg: number[], bg: number[]) => (Math.max(luminance(fg), luminance(bg)) + .05) / (Math.min(luminance(fg), luminance(bg)) + .05);
                  return nodes.map(node => {
                    const style = getComputedStyle(node);
                    const fill = rgba(style.backgroundColor);
                    const heading = rgba(getComputedStyle(node.querySelector('h3')!).color);
                    const body = rgba(getComputedStyle(node.querySelector('.astrid-vision-principle-statement, .astrid-vision-markdown')!).color);
                    const mark = getComputedStyle(node.querySelector('.astrid-vision-principle-sigil')!);
                    const sigil = rgba(mark.color); sigil[3] *= Number(mark.opacity);
                    const background = over(fill, rgba(paper));
                    const markedBackground = over(sigil, background);
                    return { fill, heading, body, headingLuminance: luminance(heading), bodyLuminance: luminance(body), headingContrast: contrast(heading, background), bodyContrast: contrast(body, background), bodyOverSigilContrast: contrast(body, markedBackground) };
                  });
                }, paper);
                expect(new Set(colours.map(c => JSON.stringify(c.fill))).size).toBe(4);
                expect(new Set(colours.map(c => JSON.stringify(c.heading))).size).toBe(4);
                expect(new Set(colours.map(c => JSON.stringify(c.body))).size).toBe(4);
                for (const c of colours) {
                  expect(c.fill[3]).toBeGreaterThan(.04); expect(c.fill[3]).toBeLessThan(.16);
                  expect(c.heading[3]).toBe(1); expect(c.body[3]).toBe(1);
                  if (mode === 'light') expect(c.headingLuminance).toBeLessThan(c.bodyLuminance);
                  else expect(c.headingLuminance).toBeGreaterThan(c.bodyLuminance);
                  expect(c.headingContrast).toBeGreaterThanOrEqual(4.5);
                  expect(c.bodyContrast).toBeGreaterThanOrEqual(4.5);
                  if (width === 390) expect(c.bodyOverSigilContrast).toBeGreaterThanOrEqual(4.5);
                }
                measurements.push({ mode, colours });
                await control.evaluate(node => node.remove());
              }
              await expect(cards.locator('h3')).toHaveText(feed.principles.map(p => p.title));
              await expect(cards.locator('.astrid-vision-principle-statement')).toHaveText(feed.principles.map(p => p.statement!));
              writeFileSync(`${folder}/principle-colours-${info.project.name}-${width}.json`, JSON.stringify({ source: feed.source, measurements }, null, 2));
            });
          }
          '''
          path.write_text(text)
          PY
          git diff --check
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git add src/pages/Home/VisionMobileLayout.css tests/e2e/public-astrid-vision-content.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts
          git commit -m 'feat(vision): add translucent principle colours with tonal text hierarchy'
          git push origin HEAD:fix/vision-polish-opening-20261114
      - name: Save exact source for review
        run: |
          mkdir -p /tmp/vision-colour-source
          git rev-parse HEAD > /tmp/vision-colour-source/source-head.txt
          tar -cf /tmp/vision-colour-source/source.tar src/pages/Home src/shared/components/PixelUnderline* src/tools/video-editor/tour/card tests/e2e/public-astrid-vision* tests/fixtures/public-vision.ts .github/workflows/public-vision.yml playwright.vision.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vision-colour-source
          path: /tmp/vision-colour-source
          retention-days: 3
