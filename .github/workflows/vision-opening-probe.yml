name: Repair WebKit first-frame placement
on:
  push:
    branches: [fix/vision-polish-opening-20261114]
    paths: [.github/workflows/vision-opening-probe.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-polish-opening-20261114
      - name: Apply measured ordering repair and retain failure evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/VisionDialog.tsx');s=p.read_text()
          old="""  useLayoutEffect(() => {
              if (dialogRef.current && !dialogRef.current.open) {
                // Let native dialog focusing choose the title once, rather than first
                // scrolling to the footer X and then correcting focus and geometry.
                titleRef.current?.setAttribute('autofocus', '');
                dialogRef.current.showModal();
                if (document.activeElement !== titleRef.current) titleRef.current?.focus({ preventScroll: true });
              }
            }, []);"""
          new="""  useLayoutEffect(() => {
              // Locking the body resets document scroll. WebKit's top-layer placement can
              // still use the old scroll offset in that same rendering turn (71px in the
              // regression trace). Give the lock one frame to settle before opening once.
              const frame = window.requestAnimationFrame(() => {
                const dialog = dialogRef.current;
                if (!dialog?.isConnected || dialog.open) return;
                const viewport = window.visualViewport;
                if (!viewport || viewport.scale <= 1.05) {
                  dialog.style.setProperty('--vision-viewport-top', (viewport?.offsetTop ?? 0) + 'px');
                  dialog.style.setProperty('--vision-viewport-height', (viewport?.height ?? window.innerHeight) + 'px');
                }
                // Native focusing chooses the heading directly, not the footer X first.
                titleRef.current?.setAttribute('autofocus', '');
                dialog.showModal();
                if (document.activeElement !== titleRef.current) titleRef.current?.focus({ preventScroll: true });
              });
              return () => window.cancelAnimationFrame(frame);
            }, []);"""
          assert old in s;p.write_text(s.replace(old,new))
          p=Path('tests/e2e/public-astrid-vision-polish.spec.ts');s=p.read_text()
          old='    expect(log).toHaveLength(index + 1);'
          new="""    // Keep the frame trace even when a first-paint regression fails below.
              mkdirSync(folder, { recursive: true });
              writeFileSync(`${folder}/opening-frames-${info.project.name}.json`,
                JSON.stringify({ source: feed.source, openings: log }, null, 2));
              expect(log).toHaveLength(index + 1);"""
          assert old in s;p.write_text(s.replace(old,new))
          PY
          git diff --check
          git add src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-polish.spec.ts
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git commit -m 'fix(vision): settle the page lock before native popup placement'
          git push origin HEAD:fix/vision-polish-opening-20261114
