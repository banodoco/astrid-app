name: Apply and reproduce scoped vision polish
on:
  push:
    branches: [fix/vision-polish-opening-20261114]
    paths: [.github/workflows/vision-polish-workbench.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-polish-opening-20261114
      - name: Validate and apply exact patch
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          paths=[pathlib.Path('.vision-polish-part0')]+[pathlib.Path(f'.vision-polish-seg{i}') for i in range(1,10)]
          for p in paths: print(p,len(p.read_text()),hashlib.sha256(p.read_bytes()).hexdigest())
          text=''.join(p.read_text().strip() for p in paths)
          data=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(data).hexdigest()=='8d113970cb9fd5e3bcd1ca98e44f52430fe9cef1cb287c75f4ab731c6c13b744'
          pathlib.Path('/tmp/vision-polish.patch').write_bytes(data)
          PY
          git apply --check /tmp/vision-polish.patch
          git apply /tmp/vision-polish.patch
          git diff --check
          git add src tests playwright.vision.config.ts
          git rm .vision-polish-part0 .vision-polish-part1 .vision-polish-seg{1..9}
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git commit -m 'fix(vision): stable popup opening, quieter controls and reusable pixel emphasis'
          git push origin HEAD:fix/vision-polish-opening-20261114
  baseline-opening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: transfer
      - uses: actions/checkout@v4
        with:
          ref: d6ee9af20936fab0787ea4ea1d8237cd190cffef
          path: baseline
      - name: Add only the regression test to the frozen baseline
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          r=pathlib.Path('transfer')
          paths=[r/'.vision-polish-part0']+[r/f'.vision-polish-seg{i}' for i in range(1,10)]
          data=gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths),validate=True))
          assert hashlib.sha256(data).hexdigest()=='8d113970cb9fd5e3bcd1ca98e44f52430fe9cef1cb287c75f4ab731c6c13b744'
          pathlib.Path('/tmp/vision-polish.patch').write_bytes(data)
          PY
          cd baseline
          git apply --include=tests/e2e/public-astrid-vision-polish.spec.ts /tmp/vision-polish.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: baseline/package-lock.json
      - name: Install focused browser dependencies
        working-directory: baseline
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
      - name: Record unchanged baseline regression result
        working-directory: baseline
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/baseline-opening.json
        run: |
          set +e
          npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-polish.spec.ts --grep 'opening prepares viewport' --project=chromium-desktop --reporter=line,json > baseline-opening.log 2>&1
          code=$?
          cat baseline-opening.log
          echo "$code" > baseline-opening.exit
          test -f test-results/baseline-opening.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-polish-opening-baseline
          path: |
            baseline/test-results/
            baseline/baseline-opening.log
            baseline/baseline-opening.exit
          retention-days: 7
