name: Apply scoped vision viewport refinement
on:
  push:
    branches: [fix/vision-viewport-sequence-20261113]
    paths: [.github/workflows/vision-viewport-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-viewport-sequence-20261113
          fetch-depth: 0
      - name: Apply only to the inspected source
        run: |
          git diff --exit-code 48d0a417211b9010a55893f461e349c39ae0888f -- src tests
          python3 .vision-viewport-apply.py
          python3 .vision-viewport-tests.py
          git diff --check
          git diff --stat
          git rm .vision-viewport-apply.py .vision-viewport-tests.py
          git add src/pages/Home/PublicAstridVision.tsx src/pages/Home/VisionDetailDialog.tsx src/pages/Home/VisionDialog.tsx src/pages/Home/VisionMobileLayout.css tests/e2e/public-astrid-vision-content.spec.ts tests/e2e/public-astrid-vision-hierarchy.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts tests/e2e/public-astrid-vision-sigils-nav.spec.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(vision): stable viewport spacing, ordered pillar animation and next-item navigation'
          git push origin HEAD:fix/vision-viewport-sequence-20261113
