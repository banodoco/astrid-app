name: Windows installer

on:
  push:
    branches: [main, release-1, "int/**"]
    paths:
      - .github/workflows/installer-windows.yml
      - public/install.ps1
      - public/install
      - public/install/**
      - scripts/installer/**
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Windows installer / Select affected paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      typescript: ${{ steps.paths.outputs.typescript }}
      appui: ${{ steps.paths.outputs.appui }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // An absent output means run everything. Never trust a partial file list.
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number});
            const count = pr.data.changed_files;
            if (!Number.isInteger(count) || count < 1 || count >= 3000) return;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number, per_page: 100});
            if (files.length !== count || files.some(f =>
              !['added', 'modified'].includes(f.status) || typeof f.filename !== 'string')) return;
            const paths = files.map(f => f.filename);
            core.setOutput('docs', String(paths.every(p =>
              p === 'README.md' || /^docs\/.*\.md$/i.test(p))));
            core.setOutput('typescript', String(paths.every(p => p.startsWith('packages/typescript/'))));
            core.setOutput('appui', String(paths.every(p =>
              p.startsWith('src/features/') || p.startsWith('src/pages/'))));
  installer-windows:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.appui != 'true')) }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: Windows PowerShell 5.1
            executable: powershell.exe
          - shell: PowerShell 7
            executable: pwsh
    name: PowerShell (${{ matrix.shell }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify selected PowerShell
        env:
          ASTRID_TEST_PWSH: ${{ matrix.executable }}
        run: "$env:ASTRID_TEST_PWSH; & $env:ASTRID_TEST_PWSH -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'"
      - name: Run PowerShell bootstrap tests
        shell: cmd
        env:
          ASTRID_TEST_PWSH: ${{ matrix.executable }}
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/installer/bootstrap-powershell.test.mjs

  pr-gate:
    name: Windows installer / PR aggregate
    if: ${{ always() }}
    needs: [changes, installer-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          is_pr = os.environ['EVENT'] == 'pull_request'
          classes = {'installer-windows': 'appui'}
          for job, special in classes.items():
              skipped = is_pr and (outputs.get('docs') == 'true' or
                                    (special and outputs.get(special) == 'true'))
              expected = 'skipped' if skipped else 'success'
              result = needs[job]['result']
              if result != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {result}")
          PYCODE
