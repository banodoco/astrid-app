# Default Vitest run per push, including Release 14's plan branch (testing plan UP.1). The checkout lane (npm run test:checkout) needs sibling repos and does not run here.
name: Tests

on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main, release-1, "int/**", "release/*/main", "release/14/plan-39"]
  pull_request:
    branches: [main, "release/*/main", "release/14/plan-39"]
  workflow_dispatch:
    inputs:
      quarantine_base:
        description: 'Git ref for the quarantine policy merge base (for example origin/release/14/plan-39)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A later push to main must never cancel the release guard for an earlier one: every push to main is checked.
  # Release mains (release/<N>/main) are exempt too: each push to them runs in full.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

jobs:
  # Install tuple (manifest minus release/required, plus public/install*) and release move together:
  # a tuple change needs release +1 exactly; otherwise release is unchanged. Base is the PR base or the push's before SHA.
  release-guard:
    # Only against main: inside a release branch the tuple may change more than once before publication,
    # and the guard's "+1 exactly" is checked when main is fast-forwarded to the release branch.
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Check install tuple and release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/installer/release-guard.mjs "$BASE_SHA" HEAD --pins

  # A pull request into a release branch comes from a branch of that release and names what it belongs
  # to: the plan (a plan branch does so by its name) or the astrid-dev issue. See the Release skill,
  # "How a release runs".
  landing-reference:
    name: landing reference
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from a branch of this release and names its plan or issue
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          release="${BASE_REF#release/}"; release="${release%/main}"
          if ! printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/[a-z0-9][a-z0-9-]*$" || [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::A pull request into ${BASE_REF} must come from a branch of that release: release/${release}/plan-<PP> or release/${release}/<topic>. This one comes from '${HEAD_REF}'."
            exit 1
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/plan-[0-9]+$"; then
            echo "Plan branch: $HEAD_REF"; exit 0
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq '(plan[ -]?[0-9]+|astrid-dev#[0-9]+|astrid-dev/issues/[0-9]+)'; then
            echo "Reference found."; exit 0
          fi
          echo "::error::A pull request into a release branch must name the plan or the astrid-dev issue it belongs to, for example 'Plan 55' or 'banodoco/astrid-dev#721'."
          exit 1

  # Every accepted PR target runs Vitest and boundary checks, including the Plan 39 task PRs.
  # Native macOS release tooling is required on PRs too (Plan39 K2).
  vitest:
    # Pinned: Playwright does not support Chromium on ubuntu-latest (ubuntu 26.04) for this job.
    runs-on: ubuntu-24.04
    env:
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the git-backed checks that run on push.
          fetch-depth: 0
          filter: blob:none
      - name: Set up Plan39 evidence collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read the Agent and Runtime pins from the App manifest
        id: pins
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-01 --shell bash "{0}"
        run: |
          node -e '
            const m = require("./public/install-manifest.json");
            const agent = m.agent?.sha, runtime = m.runtime?.sha;
            for (const sha of [agent, runtime]) if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error(`manifest pin is not a full SHA: ${sha}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `agent_sha=${agent}\nruntime_sha=${runtime}\n`);'
      - name: Restore npm cache (C-08)
        id: c08-app-test-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Plan39 recorded command 04
        if: ${{ !cancelled() }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-04 --shell bash "{0}"
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/ceiling_node.mjs --test-reporter-destination=stdout scripts/installer/release.test.mjs
      - name: Plan39 recorded command 05
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-05 --shell bash "{0}"
        run: npm ci --legacy-peer-deps
        id: dependencies
      - name: Check quarantine policy against the merge base
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
        env:
          QUARANTINE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.quarantine_base || (github.event_name == 'schedule' && github.sha) }}
        run: |
          if [[ -z "${QUARANTINE_BASE_REF:-}" || "$QUARANTINE_BASE_REF" == -* ]]; then
            echo "An explicit quarantine base ref is required." >&2
            exit 1
          fi
          base_commit=$(git rev-parse --verify "${QUARANTINE_BASE_REF}^{commit}")
          merge_base=$(git merge-base HEAD "$base_commit")
          repo_root=$(git rev-parse --show-toplevel)
          policy_dir=$(mktemp -d /tmp/astrid-quarantine-policy.XXXXXX)
          trap 'rm -rf -- "$policy_dir"' EXIT
          case "$policy_dir/" in
            "$repo_root/"*) echo "The trusted checker must run outside the checkout." >&2; exit 1 ;;
          esac
          echo "Quarantine checker source: ${merge_base}:scripts/quality/check-quarantine-policy.mjs"
          if ! git show "${merge_base}:scripts/quality/check-quarantine-policy.mjs" > "$policy_dir/check-quarantine-policy.mjs"; then
            echo "The trusted quarantine checker is absent from merge base ${merge_base}; no candidate checker will be used." >&2
            exit 1
          fi
          git show "${merge_base}:package-lock.json" > "$policy_dir/base-lock.json"
          # Resolve the parser from the base lock, outside candidate module and npm
          # configuration paths. Earlier postinstall code execution is a known limit.
          node --input-type=module - "$policy_dir" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const directory = process.argv[2];
          const baseLock = JSON.parse(fs.readFileSync(path.join(directory, 'base-lock.json'), 'utf8'));
          const typescript = baseLock.packages?.['node_modules/typescript'];
          if (!typescript?.version || !typescript.resolved || !typescript.integrity
            || ['dependencies', 'optionalDependencies', 'peerDependencies'].some(key => Object.keys(typescript[key] ?? {}).length)) {
            throw new Error('the base must pin a dependency-free TypeScript package with its resolved URL and integrity');
          }
          const manifest = { name: 'astrid-quarantine-policy-checker', version: '0.0.0', private: true,
            devDependencies: { typescript: typescript.version } };
          const lock = { name: manifest.name, version: manifest.version, lockfileVersion: 3, requires: true,
            packages: { '': { name: manifest.name, version: manifest.version, devDependencies: manifest.devDependencies },
              'node_modules/typescript': typescript } };
          fs.writeFileSync(path.join(directory, 'package.json'), JSON.stringify(manifest));
          fs.writeFileSync(path.join(directory, 'package-lock.json'), JSON.stringify(lock));
          console.log(`Trusted TypeScript from base lock: ${typescript.version}`);
          NODE
          (
            cd "$policy_dir"
            npm ci --ignore-scripts --include=dev --no-audit --no-fund --prefer-offline
            node ./check-quarantine-policy.mjs "$merge_base" "$repo_root"
          )
      - name: Prove result-integrity rejection cases
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-07 --shell bash "{0}"
        run: python3 -m unittest discover -s scripts/quality -p test_vitest_results.py
      # The P1 corpus tests read git blobs from the Agent at the release-12 pin (public/install-manifest.json).
      # ASTRID_AGENT_CHECKOUT points them there; a missing checkout fails the test instead of skipping it.
      - name: Check out the pinned Agent for the P1 corpus
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-agent
          fetch-depth: 0
      # Browser-backed unit tests launch Playwright's Chromium from the default cache.
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-09 --shell bash "{0}"
        run: npx playwright install chromium
      - name: Prepare Vitest result directory
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: mkdir -p "$RUNNER_TEMP/vitest-results"
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-10 --shell bash "{0}"
      - name: Run App Vitest suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-11 --shell bash "{0}"
        run: npm run test:app 2>&1 | tee "$RUNNER_TEMP/vitest-results/vitest-app.log"
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
          VITEST_JUNIT_OUTPUT: ${{ runner.temp }}/vitest-results/vitest-app.xml
      - name: Run Node tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-12 --shell bash "{0}"
        run: npm run test:node
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
      - name: Run SDK boundary Vitest suite
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-13 --shell bash "{0}"
        run: npm run test:sdk-boundary 2>&1 | tee "$RUNNER_TEMP/vitest-results/vitest-sdk-boundary.log"
        env:
          VITEST_JUNIT_OUTPUT: ${{ runner.temp }}/vitest-results/vitest-sdk-boundary.xml
      - name: Verify and summarize actual Vitest results
        if: always()
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-14 --shell bash "{0}"
        run: python3 scripts/quality/check-vitest-results.py "$RUNNER_TEMP/vitest-results"
      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-vitest-all-${{ runner.os }}
          path: ${{ runner.temp }}/vitest-results/
          retention-days: 90
          if-no-files-found: warn

  # The release tooling is macOS-only by design (lockf broker, BSD ps eww, darwin-pinned attestation), so the vitest job
  # declares these cases as skipped (config/testing/skipRegistry.mjs: macos-release-process-containment, macos-lockf-broker)
  # and this job runs exactly those files where the condition holds. Plain node: these files import only the repo.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-app-test-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error

  release-tooling-macos:
    runs-on: macos-latest
    env:
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Plan39 evidence collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Plan39 recorded command 02
        if: ${{ !cancelled() }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-02 --shell bash "{0}"
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/release/bounded-command.test.mjs scripts/release/astrid-release-provenance.test.mjs scripts/release/verify-extension-ship.test.mjs

  # Cross-repo copies: every vendored artifact must match its selected producer commit.
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error

  boundary:
    runs-on: ubuntu-latest
    env:
      ASTRID_CI_MATRIX: ${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Plan39 evidence collector
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Check manifest pins against local locks
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-02 --shell bash "{0}"
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { checkLocalPins } from './scripts/installer/pin.mjs';
          const manifest = JSON.parse(readFileSync('public/install-manifest.json', 'utf8'));
          console.log(checkLocalPins(manifest));
          NODE
      - name: Plan39 recorded command 03
        id: pins
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-03 --shell bash "{0}"
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const runtime = JSON.parse(fs.readFileSync('runtime.lock.json', 'utf8'));
          const astrid = JSON.parse(fs.readFileSync('config/astrid-cli-surface/vendor.lock.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/install-manifest.json', 'utf8'));
          process.stdout.write(`runtime_sha=${runtime.source_commit}\nastrid_sha=${astrid.source_commit}\nagent_sha=${manifest.agent.sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime_sha }}
          path: runtime-producer
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-producer
      - name: Plan39 recorded command 06
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-06 --shell bash "{0}"
        run: |
          node scripts/vendor-lock.mjs check runtime.lock.json --producer runtime-producer
      - name: Plan39 recorded command 07
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-07 --shell bash "{0}"
        run: node scripts/vendor-lock.mjs check config/astrid-cli-surface/vendor.lock.json --producer astrid-producer
      - name: Plan39 recorded command 08
        if: ${{ !cancelled() }}
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-08 --shell bash "{0}"
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/ceiling_node.mjs --test-reporter-destination=stdout scripts/quality/astrid-public-boundary.test.mjs
      - name: Plan39 recorded command 09
        shell: python -I -c "import os,runpy,sys; sys.argv.extend(['--matrix',os.environ['ASTRID_CI_MATRIX']]); runpy.run_path(os.path.join(os.environ['GITHUB_WORKSPACE'],'scripts/ci/ceiling_capture.py'),run_name='__main__')" --step step-09 --shell bash "{0}"
        run: node scripts/build/verify-astrid-vendor-sources.mjs
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error
