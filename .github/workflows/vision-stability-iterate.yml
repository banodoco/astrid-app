name: Vision mobile stability iteration
on:
  push:
    branches: [fix/vision-mobile-stability-20261114]
    paths: [.github/workflows/vision-stability-iterate.yml]
permissions:
  contents: write
jobs:
  iterate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-mobile-stability-20261114
      - name: Correct first-paint readiness, retaining every stability assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/public-astrid-vision-stability.spec.ts')
          s = p.read_text()
          a = "  await expect.poll(() => canvases.first().evaluate(node => (node as HTMLCanvasElement).height)).toBeGreaterThan(100);"
          b = """  // A canvas defaults to 300×150 before paint; buffer height alone is not readiness.
            await expect.poll(() => canvases.evaluateAll(nodes => nodes.length === 4 && nodes.every(node => {
              const canvas = node as HTMLCanvasElement;
              return canvas.style.width !== '' && canvas.style.height !== '';
            }))).toBe(true);"""
          assert s.count(a) == 1
          p.write_text(s.replace(a, b))
          PY
          git diff --check
          git config user.name 'astrid-vision-workbench[bot]'
          git config user.email 'astrid-vision-workbench[bot]@users.noreply.github.com'
          git add tests/e2e/public-astrid-vision-stability.spec.ts
          git commit -m 'test(vision): measure painted sky instead of default empty canvas'
          git push origin HEAD:fix/vision-mobile-stability-20261114
          mkdir -p /tmp/stability-proof
          git rev-parse HEAD > /tmp/stability-proof/source-head.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Focused Chromium cloud regression
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/stability-proof/chromium-results.json
        run: npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-stability.spec.ts --grep 'mobile sky' --project=chromium-desktop --workers=1 --output=test-results/stability-chromium --reporter=line,json
      - name: Focused WebKit cloud regression
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/stability-proof/webkit-results.json
        run: npx playwright test --config playwright.vision.config.ts tests/e2e/public-astrid-vision-stability.spec.ts --grep 'mobile sky' --output=test-results/stability-webkit --reporter=line,json
      - name: Gather focused evidence
        if: always()
        run: |
          mkdir -p /tmp/stability-proof
          if [ -d test-results/vision-captures ]; then cp -r test-results/vision-captures /tmp/stability-proof/captures; fi
          tar -cf /tmp/stability-proof/source.tar src/pages/Home src/shared/components/PixelUnderline* tests/e2e/public-astrid-vision-stability.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-stability-painted-sky
          path: /tmp/stability-proof/
          retention-days: 7
