name: Apply fixed popup and room transition refinements
on:
  push:
    branches: [fix/vision-polish-opening-20261114]
    paths: [.github/workflows/vision-colour-contract.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-polish-opening-20261114
      - name: Apply exact scoped edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(); assert s.count(old)==1, (path,s.count(old),old[:80]); p.write_text(s.replace(old,new))
          p=Path('src/pages/Home/VisionDialog.tsx'); s=p.read_text()
          a=s.index('          {(previous || next) && <>'); b=s.index('          <div className="astrid-vision-details-scroll-fade',a)
          nav=s[a:b]; s=s[:a]+s[b:]
          needle='        </div>\n      </div>\n    </dialog>'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'        </div>\n'+nav+'      </div>\n    </dialog>'))
          with Path('src/pages/Home/VisionMobileLayout.css').open('a') as f:
              f.write('\n/* The whole panel owns navigation, so wrapping titles and disclosures cannot move it. */\n.astrid-vision-details-shell { position: relative; }\n')
          replace('src/pages/Home/PublicAstridSite.tsx', 'useCallback, useEffect, useRef, useState', 'useCallback, useEffect, useLayoutEffect, useRef, useState')
          replace('src/pages/Home/PublicAstridSite.tsx', '  const homeScrollRef = useRef(0);\n', '''  const homeScrollRef = useRef(0);

            // This room switch owns its scroll targets. Native history restoration
            // must not move the outgoing page before its transition snapshot.
            useLayoutEffect(() => {
              if (!('scrollRestoration' in window.history)) return;
              const previous = window.history.scrollRestoration;
              window.history.scrollRestoration = 'manual';
              return () => {
                if (window.history.scrollRestoration === 'manual') window.history.scrollRestoration = previous;
              };
            }, []);
          ''')
          replace('src/pages/Home/PublicAstridSite.tsx', "    const nextExperience = next === 'home' ? readPublicAstridExperience() : null;", """    const nextExperience = next === 'home' ? readPublicAstridExperience() : null;
              const outgoingScroll = window.scrollY;
              const incomingScroll = next === 'vision' ? 0 : homeScrollRef.current;
              // Off-screen heroes are not useful morphing anchors. Crossfade instead.
              const presentation = outgoingScroll > 72 || incomingScroll > 72 ? 'crossfade' : 'shared';""")
          replace('src/pages/Home/PublicAstridSite.tsx', 'homeScrollRef.current = window.scrollY;', 'homeScrollRef.current = outgoingScroll;')
          replace('src/pages/Home/PublicAstridSite.tsx', 'run(commit, pageRef.current !== next ? next : undefined);', 'run(commit, pageRef.current !== next ? next : undefined, presentation);')
          replace('src/pages/Home/PublicAstridSite.tsx', '  useEffect(() => {\n    document.title = PUBLIC_ASTRID_SHARE_PAGES[page].title;', '''  // run() flushes React inside the update callback. Settle focus and scroll
            // in the layout phase, before paint and before the incoming snapshot.
            useLayoutEffect(() => {
              document.title = PUBLIC_ASTRID_SHARE_PAGES[page].title;''')
          replace('src/pages/Home/PublicAstridSite.tsx', "window.scrollTo(0, page === 'vision' ? 0 : homeScrollRef.current);", "window.scrollTo({ left: 0, top: page === 'vision' ? 0 : homeScrollRef.current, behavior: 'instant' });")
          replace('src/pages/Home/publicAstridNavigation.ts', '    delete document.documentElement.dataset.astridPageTransition;', '    delete document.documentElement.dataset.astridPageTransition;\n    delete document.documentElement.dataset.astridPageTransitionStyle;')
          replace('src/pages/Home/publicAstridNavigation.ts', "const run = useCallback((commit: () => void, page?: 'home' | 'vision') => {", "const run = useCallback((commit: () => void, page?: 'home' | 'vision', presentation: 'shared' | 'crossfade' = 'shared') => {")
          replace('src/pages/Home/publicAstridNavigation.ts', '      document.documentElement.dataset.astridPageTransition = page;', '      document.documentElement.dataset.astridPageTransition = page;\n      document.documentElement.dataset.astridPageTransitionStyle = presentation;')
          with Path('src/pages/Home/PublicAstridSite.css').open('a') as f:
              f.write('''
          /* Scrolled switches use one snapshot pair, not off-screen moving anchors. */
          :root[data-astrid-page-transition-style="crossfade"] :is(.astrid-public-site, .astrid-vision),
          :root[data-astrid-page-transition-style="crossfade"] :is(.astrid-public-site, .astrid-vision) * {
            view-transition-name: none !important;
          }
          @keyframes astrid-room-fade-in { from { opacity: 0; } }
          :root[data-astrid-page-transition-style="crossfade"]::view-transition-group(root) { animation: none; }
          :root[data-astrid-page-transition-style="crossfade"]::view-transition-old(root) {
            animation: none; opacity: 1; mix-blend-mode: normal;
          }
          :root[data-astrid-page-transition-style="crossfade"]::view-transition-new(root) {
            animation: astrid-room-fade-in 220ms ease-out both; mix-blend-mode: normal;
          }
          ''')
          replace('src/pages/Home/PublicAstridSite.lifecycle.test.tsx', 'expect(window.scrollTo).toHaveBeenLastCalledWith(0, 427);', "expect(window.scrollTo).toHaveBeenLastCalledWith({ left: 0, top: 427, behavior: 'instant' });")
          replace('src/pages/Home/PublicAstridSite.lifecycle.test.tsx', '  delete document.documentElement.dataset.astridPageTransition;', '  delete document.documentElement.dataset.astridPageTransition;\n  delete document.documentElement.dataset.astridPageTransitionStyle;')
          replace('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts', "const frame = (await dialog.locator('.astrid-vision-details-scroll-frame').boundingBox())!;\n        for (const arrow", "const frame = (await dialog.locator('.astrid-vision-details-shell').boundingBox())!;\n        for (const arrow")
          replace('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts', '      const initialWidth = await scroll.evaluate(node => node.clientWidth);', '      const initialWidth = await scroll.evaluate(node => node.clientWidth);\n      const navigationY = (await next.boundingBox())!.y;')
          replace('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts', '          expect(box.width).toBeGreaterThanOrEqual(44);', '          expect(box.width).toBeGreaterThanOrEqual(44);\n          expect(Math.abs(box.y - navigationY)).toBeLessThan(1);')
          replace('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts', "        await expect(dialog).toHaveAccessibleName(subjects[index].title);\n        await expect.poll(() => scroll.evaluate(node => node.scrollTop)).toBe(0);", "        await expect(dialog).toHaveAccessibleName(subjects[index].title);\n        expect(Math.abs((await previous.boundingBox())!.y - navigationY)).toBeLessThan(1);\n        expect(Math.abs((await next.boundingBox())!.y - navigationY)).toBeLessThan(1);\n        await expect.poll(() => scroll.evaluate(node => node.scrollTop)).toBe(0);")
          with Path('src/pages/Home/PublicAstridSite.lifecycle.test.tsx').open('a') as f:
              f.write('''

          describe('room scroll snapshot ownership', () => {
            it('uses manual history restoration only for the lifetime of the public site', async () => {
              const descriptor = Object.getOwnPropertyDescriptor(window.history, 'scrollRestoration');
              Object.defineProperty(window.history, 'scrollRestoration', { configurable: true, writable: true, value: 'auto' });
              const view = await mountedHome();
              expect(window.history.scrollRestoration).toBe('manual');
              view.unmount();
              expect(window.history.scrollRestoration).toBe('auto');
              if (descriptor) Object.defineProperty(window.history, 'scrollRestoration', descriptor);
              else delete (window.history as Partial<History>).scrollRestoration;
            });
            it('restores instant scroll inside the snapshot callback and retires only its own transition style', async () => {
              await mountedHome();
              deferTransitions();
              const scrollY = vi.spyOn(window, 'scrollY', 'get').mockReturnValue(427);
              fireEvent.click(screen.getByRole('link', { name: 'Vision' }));
              expect(document.documentElement.dataset.astridPageTransitionStyle).toBe('crossfade');
              await update(transitions[0]);
              expect(window.scrollTo).toHaveBeenLastCalledWith({ left: 0, top: 0, behavior: 'instant' });
              scrollY.mockReturnValue(1500);
              historyAt('/home?experience=app');
              const returning = transitions[1];
              await finish(transitions[0]);
              expect(document.documentElement.dataset.astridPageTransitionStyle).toBe('crossfade');
              await update(returning);
              expect(window.scrollTo).toHaveBeenLastCalledWith({ left: 0, top: 427, behavior: 'instant' });
              expect(document.querySelector('.astrid-public-site')).toHaveFocus();
              await finish(returning);
              expect(document.documentElement).not.toHaveAttribute('data-astrid-page-transition-style');
            });
          });
          ''')
          with Path('tests/e2e/public-astrid-vision-polish.spec.ts').open('a') as f:
              f.write(r'''

          for (const width of [390, 1440]) {
            test(`scrolled Vision returns to the retained main page without moving its snapshot at ${width}px`, async ({ page }, info) => {
              await pinLive(page);
              await page.setViewportSize({ width, height: 844 });
              await page.emulateMedia({ reducedMotion: 'no-preference' });
              await page.addInitScript(() => {
                type Frame = { scroll: number; top: number };
                type Record = { destination?: string; presentation?: string; outgoing: number; snapshot?: Frame; frames: Frame[]; named: string[] };
                const state = window as typeof window & { __roomTransitions: Record[]; __homeTapY?: number };
                state.__roomTransitions = [];
                document.addEventListener('pointerdown', event => {
                  if ((event.target as Element)?.closest('.astrid-public-site a[href="/vision"]')) state.__homeTapY = window.scrollY;
                }, true);
                const native = document.startViewTransition?.bind(document);
                if (!native) return;
                document.startViewTransition = ((callback: () => void) => {
                  const record: Record = { destination: document.documentElement.dataset.astridPageTransition,
                    presentation: document.documentElement.dataset.astridPageTransitionStyle,
                    outgoing: window.scrollY, frames: [], named: [] };
                  state.__roomTransitions.push(record);
                  return native(() => {
                    callback();
                    const home = document.querySelector<HTMLElement>('.astrid-public-site');
                    if (record.destination !== 'home' || !home) return;
                    const read = () => ({ scroll: window.scrollY, top: home.getBoundingClientRect().top });
                    record.snapshot = read();
                    record.named = [home, ...home.querySelectorAll('*')].map(node => getComputedStyle(node).viewTransitionName)
                      .filter(name => name && name !== 'none');
                    const sample = () => {
                      record.frames.push(read());
                      if (record.frames.length < 12) requestAnimationFrame(sample);
                    };
                    requestAnimationFrame(sample);
                  });
                }) as typeof document.startViewTransition;
              });
              await page.goto('/home', { waitUntil: 'domcontentloaded' });
              const home = page.locator('.astrid-public-site');
              await expect(home).toBeVisible();
              await home.evaluate(node => node.setAttribute('data-retained-proof', 'same'));
              await page.addStyleTag({ content: 'html { scroll-behavior: smooth !important; }' });
              await page.getByRole('link', { name: 'Vision', exact: true }).first().click();
              await expect(page.locator('.astrid-vision-principles > li')).toHaveCount(4);
              await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
              const expectedHomeY = await page.evaluate(() => (window as typeof window & { __homeTapY: number }).__homeTapY);
              expect(Number.isFinite(expectedHomeY)).toBe(true);
              const outgoing = await page.evaluate(() => new Promise<number>(resolve => {
                window.scrollTo({ top: 900, behavior: 'instant' });
                requestAnimationFrame(() => requestAnimationFrame(() => resolve(window.scrollY)));
              }));
              expect(outgoing).toBeGreaterThan(500);
              await page.getByRole('link', { name: 'Astrid home', exact: true }).click();
              await expect(home).toBeVisible();
              await expect(home).toHaveAttribute('data-retained-proof', 'same');
              await expect.poll(() => page.evaluate(() => window.scrollY)).toBeCloseTo(expectedHomeY, 0);
              const supported = await page.evaluate(() => typeof document.startViewTransition === 'function');
              if (supported) {
                await expect.poll(() => page.evaluate(() => (window as typeof window & {
                  __roomTransitions: { destination?: string; frames: unknown[] }[];
                }).__roomTransitions.filter(r => r.destination === 'home').at(-1)?.frames.length ?? 0)).toBe(12);
                const record = await page.evaluate(() => (window as typeof window & {
                  __roomTransitions: { destination?: string; presentation?: string; outgoing: number;
                    snapshot: { scroll: number; top: number }; frames: { scroll: number; top: number }[]; named: string[] }[];
                }).__roomTransitions.filter(r => r.destination === 'home').at(-1)!);
                expect(record.presentation).toBe('crossfade');
                expect(record.outgoing).toBeGreaterThan(500);
                expect(record.snapshot.scroll).toBeCloseTo(expectedHomeY, 0);
                expect(record.named).toEqual([]);
                for (const frame of record.frames) {
                  expect(frame.scroll).toBeCloseTo(expectedHomeY, 0);
                  expect(Math.abs(frame.top - record.snapshot.top)).toBeLessThan(1);
                }
                mkdirSync(folder, { recursive: true });
                writeFileSync(`${folder}/room-transition-${info.project.name}-${width}.json`, JSON.stringify(record, null, 2));
              }
              await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
              await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition-style');
              expect(await page.evaluate(() => history.scrollRestoration)).toBe('manual');
              mkdirSync(folder, { recursive: true });
              await page.screenshot({ path: `${folder}/real-main-after-vision-${info.project.name}-${width}.png` });
            });
          }
          ''')
          PY
          git diff --check
          git add src/pages/Home/VisionDialog.tsx src/pages/Home/VisionMobileLayout.css src/pages/Home/PublicAstridSite.tsx src/pages/Home/publicAstridNavigation.ts src/pages/Home/PublicAstridSite.css src/pages/Home/PublicAstridSite.lifecycle.test.tsx tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(vision): hold navigation targets still and settle scrolled room transitions'
          git push origin HEAD:fix/vision-polish-opening-20261114
