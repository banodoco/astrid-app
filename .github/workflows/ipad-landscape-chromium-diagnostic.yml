name: Landscape Chromium diagnostic
on:
  push:
    branches: [diag/ipad-landscape-chromium-20261116]
    paths: [.github/workflows/ipad-landscape-chromium-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2ddc8e25d77af03eb27fa9c21e65f6a10a16d58
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Diagnose only the added landscape cases
        shell: bash
        run: |
          mkdir -p landscape-diagnostic
          git rev-parse HEAD HEAD^{tree} > landscape-diagnostic/source.txt
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=landscape-diagnostic/results.json npx playwright test tests/e2e/public-astrid-home-chips.spec.ts --config playwright.config.ts --project=chromium-desktop --grep 'landscape tablet visible viewport' --workers=1 --reporter=json > landscape-diagnostic/raw.log 2>&1
          result=$?
          echo "$result" > landscape-diagnostic/exit.txt
          cp -R test-results/vision-captures landscape-diagnostic/ 2>/dev/null || true
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-landscape-chromium-diagnostic
          path: landscape-diagnostic/
          if-no-files-found: error
