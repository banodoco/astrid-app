name: Repair popup input test setup
on:
  push:
    branches: [fix/vision-dialog-bounds-scroll-20261113]
    paths: [.github/workflows/vision-popup-test-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-dialog-bounds-scroll-20261113
      - name: Preserve assertions with a valid empty feed and supported input contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/public-astrid-vision-aspirations.spec.ts')
          s=p.read_text();old='  feed.gaps = [];\n  await openVision(page, feed);';assert s.count(old)==1
          p.write_text(s.replace(old,'  feed.gaps = [];\n  feed.projects = []; // Empty feeds cannot keep dangling project references.\n  await openVision(page, feed);'))
          p=Path('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts');s=p.read_text()
          marker='for (const width of [390, 1440]) {\n  test(`all popup types lock';assert s.count(marker)==1
          s=s.replace(marker,"// WebKit mobile emulation rejects wheel input before dispatch. Exercise real\n// wheels at both responsive widths in a wheel-capable context, with a separate\n// mobile-emulated touch cancellation check below. No assertions are skipped.\ntest.describe('native wheel scroll isolation', () => {\n  test.use({ isMobile: false });\nfor (const width of [390, 1440]) {\n  test(`all popup types lock")
          s+='\n});\n'
          s+='''
          
          test('mobile popup controls cancel drags but preserve content gestures and zoom', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('/vision', { waitUntil: 'domcontentloaded' });
            for (const kind of ['pillar', 'principle', 'gaps', 'projects']) {
              const opener = kind === 'pillar' ? page.locator('.astrid-vision-principles > li').first().getByRole('button')
                : kind === 'principle' ? page.locator('.astrid-vision-standards-list > li').first().getByRole('button')
                : page.getByRole('button', { name: 'See all ' + kind, exact: true });
              await opener.scrollIntoViewIfNeeded();
              await opener.focus();
              const before = await page.evaluate(() => scrollY);
              await page.keyboard.press('Enter');
              const dialog = page.getByRole('dialog');
              const result = await dialog.evaluate(node => {
                const header = node.querySelector('.astrid-vision-details-header')!;
                const scroll = node.querySelector('.astrid-vision-details-scroll')!;
                const drag = (target: Element, fingers: number) => {
                  const event = new Event('touchmove', { bubbles: true, cancelable: true });
                  Object.defineProperty(event, 'touches', { value: Array.from({ length: fingers }, (_, identifier) => ({ identifier })) });
                  target.dispatchEvent(event);
                  return event.defaultPrevented;
                };
                return { header: drag(header, 1), backdrop: drag(node, 1), content: drag(scroll, 1),
                  pinch: drag(header, 2), fixed: getComputedStyle(document.body).position };
              });
              expect(result).toEqual({ header: true, backdrop: true, content: false, pinch: false, fixed: 'fixed' });
              await expect(dialog.locator('.astrid-vision-details-header')).toHaveCSS('touch-action', 'pinch-zoom');
              await expect(dialog.locator('.astrid-vision-details-scroll')).toHaveCSS('overscroll-behavior-y', 'none');
              await dialog.getByRole('button', { name: 'Close details' }).click();
              await expect(dialog).toHaveCount(0);
              await expect.poll(() => page.evaluate(() => scrollY)).toBe(before);
              await expect(page.locator('body')).not.toHaveCSS('position', 'fixed');
            }
            // Component disposal must release the lock even without a close event.
            await page.getByRole('button', { name: 'See all gaps', exact: true }).click();
            await expect(page.getByRole('dialog')).toBeVisible();
            await page.locator('.astrid-vision-brand').evaluate(node => (node as HTMLAnchorElement).click());
            await expect(page.getByRole('dialog')).toHaveCount(0);
            await expect(page.locator('body')).not.toHaveCSS('position', 'fixed');
          });
          '''
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add tests/e2e/public-astrid-vision-aspirations.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts
          git commit -m 'test(vision): validate empty groups and separate wheel from mobile touch input'
          git push origin HEAD:fix/vision-dialog-bounds-scroll-20261113
