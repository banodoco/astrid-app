name: G3 app dockerfile-check
'on':
  workflow_call:
    inputs:
      runtime_sha:
        required: true
        type: string
      agent_sha:
        required: true
        type: string
      app_sha:
        required: true
        type: string
      pinokio_sha:
        required: true
        type: string
      vibecomfy_sha:
        required: true
        type: string
    secrets:
      RUNTIME_READ_TOKEN:
        required: false
      ASTRID_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  dockerfile-check:
    name: Dockerfile checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-app
        ref: ${{ inputs.app_sha }}
        persist-credentials: false
    - name: Assert and record app checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.app_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "app" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - uses: docker/setup-buildx-action@v3
    - uses: actions/setup-node@v4
      with:
        node-version: 20.19.0
    - run: make dockerfile-check
