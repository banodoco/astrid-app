name: Beta brand follow workbench
on:
  push:
    branches: [fix/beta-brand-follow-20261116]
    paths: [.github/workflows/beta-brand-follow-workbench.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta-brand-follow-20261116
          fetch-depth: 6
      - name: Include the current main without rewriting history
        run: |
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git fetch origin de7dd1e668aa6dcf3cbce013c701fa7c76615f99
          git merge --no-edit de7dd1e668aa6dcf3cbce013c701fa7c76615f99
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Match both capture animations without layout-dependent sizing
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', '15a0c7c1035934f99b76cbb9aae7366b1df8b66a:.github/workflows/beta-brand-follow-workbench.yml'], text=True)
          body = textwrap.dedent(source.split('      - name: Keep the wordmark and badge on the same measured animation path\n', 1)[1].split('\n      - ', 1)[0].split('        run: |\n', 1)[1])
          def replace(old, new):
              global body
              assert body.count(old) == 1, (old, body.count(old))
              body = body.replace(old, new)
          replace("`translate(${origin.x}px, ${origin.y}px)`", "`translate(${origin.x}px, ${origin.y}px) scale(${sx}, ${sy})`")
          replace("`translate(${word.x}px, ${word.y}px)`", "`translate(${word.x}px, ${word.y}px) scale(1, 1)`")
          replace("root.style.setProperty('--astrid-brand-word-from-width', `${origin.width}px`);", '')
          replace("root.style.setProperty('--astrid-brand-word-from-height', `${origin.height}px`);", '')
          replace("['from', 'to', 'from-width', 'from-height', 'to-width', 'to-height']", "['from', 'to', 'to-width', 'to-height']")
          replace('width: var(--astrid-brand-word-from-width);', '')
          replace('height: var(--astrid-brand-word-from-height);', '')
          replace('width: var(--astrid-brand-word-to-width);', '')
          replace('height: var(--astrid-brand-word-to-height);', '')
          replace('animation: astrid-brand-word-follow 900ms cubic-bezier(.65, 0, .35, 1) both;', 'width: var(--astrid-brand-word-to-width);\n            height: var(--astrid-brand-word-to-height);\n            animation: astrid-brand-word-follow 900ms cubic-bezier(.65, 0, .35, 1) both;')
          replace("p.write_text(s)\n    run('Apply the bounded badge animation and preserve existing guards')", "s = replace(s, 'const sx = frame.wordWidth / destination.word.width;', 'const sx = word.a * frame.wordWidth / destination.word.width;')\n    s = replace(s, 'const sy = frame.wordHeight / destination.word.height;', 'const sy = word.d * frame.wordHeight / destination.word.height;')\n    p.write_text(s)\n    run('Apply the bounded badge animation and preserve existing guards')")
          replace('// native group morph with an independent transform can drift in WebKit.', '// size-changing morph with a transform-only badge can drift between frames.')
          replace('This repair changes product wordmark geometry to the same authored animation path as Beta.', 'Run43863496893/artifact14224613000 also failed1.272px in Chromium. This repair moves both captures with transform-only geometry; the approved oracle measures effective scale including the transform matrix. All1px/0.02 tolerances and movement assertions remain. See Dev645 comment6916020321, recorded before editing.')
          subprocess.run(['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', body], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrid-beta-follow-focused
          path: beta-follow-evidence/
          if-no-files-found: error
