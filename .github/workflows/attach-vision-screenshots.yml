name: Attach Vision screenshots to PR 173

on:
  pull_request:
    paths:
      - ".github/workflows/attach-vision-screenshots.yml"

permissions:
  contents: write
  actions: read

jobs:
  attach-screenshots:
    if: github.event.pull_request.number == 173 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Download validated desktop and phone screenshots
        uses: actions/download-artifact@v4
        with:
          name: astrid-vision-screenshots
          run-id: 42286798162
          github-token: ${{ github.token }}
          path: docs/vision-page/screenshots
      - name: Attach screenshots to review branch
        run: |
          set -euo pipefail
          test -s docs/vision-page/screenshots/desktop-hero.png
          test -s docs/vision-page/screenshots/desktop-pillars.png
          test -s docs/vision-page/screenshots/desktop-gaps.png
          test -s docs/vision-page/screenshots/desktop-projects.png
          test -s docs/vision-page/screenshots/phone-hero.png
          test -s docs/vision-page/screenshots/phone-pillars.png
          test -s docs/vision-page/screenshots/phone-projects.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vision-page/screenshots
          git commit -m "docs(vision): include reviewed desktop and phone screenshots"
          git push origin HEAD:refs/heads/feat/vision-github-content-20261106
