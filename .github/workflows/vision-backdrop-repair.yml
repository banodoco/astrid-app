name: Qualify complete Vision backdrop repair
on:
  push:
    branches: [fix/vision-backdrop-flash-20261115]
    paths: [.github/workflows/vision-backdrop-repair.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backdrop-flash-20261115
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Apply verified scoped source recipe
        run: |
          git fetch --no-tags --depth=1 origin f8f1a152b2df2028d05bf168f7136cbc20611ad4 cac7adaecf44df67e8805ba79d9097984f1631c6 d3593ab83f90c877c29b2be08efabfe27e2443e6
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, hashlib, re, textwrap
          recipe = subprocess.check_output(['git','show','d3593ab83f90c877c29b2be08efabfe27e2443e6:.github/workflows/vision-backdrop-repair.yml'])
          assert hashlib.sha1(b'blob '+str(len(recipe)).encode()+b'\0'+recipe).hexdigest() == '5a73350e8385352dec2b0450c1be59510351d7bb'
          blocks = re.findall(r"          python3 - <<'PY'\n(.*?)\n          PY", recipe.decode(), re.S)
          assert len(blocks) == 2
          for block in blocks:
            exec(compile(textwrap.dedent(block), '<reviewed-six-file-repair>', 'exec'))
          p = Path('tests/e2e/public-astrid-vision-entry.spec.ts')
          before, added = p.read_text().split('// Track the shade itself,', 1)
          added = added.replace("{ width: 390, hour: '10', label: 'phone-day' }", "{ width: 390, hour: '10', label: 'phone-day', touch: false }")
          added = added.replace("{ width: 390, hour: '01', label: 'phone-night' }", "{ width: 390, hour: '01', label: 'phone-night', touch: false }")
          added = added.replace("{ width: 1440, hour: '10', label: 'desktop-day' },", "{ width: 1440, hour: '10', label: 'desktop-day', touch: false },\n  { width: 390, hour: '10', label: 'phone-touch', touch: true },")
          added = added.replace("? { isMobile: false, deviceScaleFactor: 1, hasTouch: false } : {}) });", "? { isMobile: false, deviceScaleFactor: 1, hasTouch: false } : scenario.touch ? { isMobile: true, hasTouch: true } : {}) });")
          added = added.replace('if (scenario.width === 1440) {', 'if (!scenario.touch) {')
          needle = '        // Finish the preceding scroll/pointer parallax before measuring a new'
          assert added.count(needle) == 1
          added = added.replace(needle, '''        // Scrolling reveals nearby reading text; let that earlier gesture finish
                  // before measuring a new opening. Ignore ongoing decorative loops.
                  await page.evaluate(() => new Promise<void>(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve()))));
                  await expect.poll(() => page.evaluate(() => document.querySelector('.astrid-vision')!
                    .getAnimations({ subtree: true }).filter(animation =>
                      (animation.playState === 'running' || animation.pending) &&
                      Number.isFinite(animation.effect?.getComputedTiming().iterations ?? 1)).length),
                    { timeout: 10000 }).toBe(0);
          ''' + needle)
          needle = "const transforms = Array.from(document.querySelectorAll<HTMLCanvasElement>('.astrid-vision .astrid-sky canvas'))\n              .map(canvas => canvas.style.transform).join('|');"
          assert added.count(needle) == 1
          added = added.replace(needle, """const transforms = JSON.stringify(Array.from(document.querySelectorAll<HTMLCanvasElement>('.astrid-vision .astrid-sky canvas')).map(canvas => {
                        let hash = 2166136261;
                        for (const pixel of canvas.getContext('2d')!.getImageData(0, 0, canvas.width, canvas.height).data)
                          hash = Math.imul(hash ^ pixel, 16777619);
                        return [canvas.style.transform, canvas.width, canvas.height, hash >>> 0];
                      }));""")
          added = added.replace('const state = window as unknown as { backdropFrames: Frame[] };', 'const state = window as unknown as { backdropFrames: Frame[]; backdropInput: string };')
          added = added.replace("document.addEventListener('pointerdown', () => {\n            read();", "document.addEventListener('pointerdown', event => {\n            state.backdropInput = event.pointerType;\n            read();")
          assert added.count('        await opener.click();') == 1
          added = added.replace('        await opener.click();', '        if (scenario.touch) await opener.tap();\n        else await opener.click();')
          needle = '        record(`backdrop-continuity-${info.project.name}-${scenario.label}`, { source: feed.source, results });'
          assert added.count(needle) == 1
          added = added.replace(needle, '''        const input = await page.evaluate(() => (window as unknown as { backdropInput: string }).backdropInput);
                  expect.soft(input).toBe(scenario.touch ? 'touch' : 'mouse');
                  record(`backdrop-continuity-${info.project.name}-${scenario.label}`, { source: feed.source, input, results });''')
          p.write_text(before + '// Track the shade itself,' + added)
          PY
          git add src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx src/pages/Home/PublicAstridSky.tsx src/pages/Home/PublicAstridSky.scheduling.test.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
          mkdir -p qualification-evidence
          git rev-parse HEAD > qualification-evidence/base.txt
          git write-tree > qualification-evidence/tested-tree.txt
          git diff --cached --stat > qualification-evidence/scope.txt
          git diff --cached > qualification-evidence/candidate.patch
      - run: npm ci --legacy-peer-deps
      - name: Validate live-feed parsing contract
        run: npm run vision:check && npx vitest run --config config/testing/vitest.config.ts src/pages/Home/visionHierarchy.test.ts src/pages/Home/publicVisionContent.loading.test.tsx
      - name: Check production vision canary syntax
        run: node --check scripts/quality/check-public-vision-production.mjs
      - name: Check changed vision code
        run: npx eslint src/pages/Home/PublicAstridSky.tsx src/pages/Home/PublicAstridSky.scheduling.test.tsx src/pages/Home/publicAstridSkySession.ts src/pages/Home/PublicAstridSite.tsx src/pages/Home/publicAstridNavigation.ts src/shared/components/PixelUnderline.tsx src/tools/video-editor/tour/card/TourCard.tsx src/pages/Home/VisionDialog.tsx src/pages/Home/PublicAstridVision.tsx src/pages/Home/VisionDetailDialog.tsx src/pages/Home/VisionPrincipleSigil.tsx src/pages/Home/VisionSectionNav.tsx src/pages/Home/visionHierarchy.ts src/pages/Home/publicVisionContent.ts src/pages/Home/publicAstridShare.ts --max-warnings 0
      - name: Preserve public page lifecycle and share metadata
        run: npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx src/test/viteShareMeta.test.ts
      - name: Verify shared pixel emphasis and tour feedback
        run: npx vitest run --config config/testing/vitest.config.ts src/shared/components/PixelUnderline.test.tsx src/tools/video-editor/tour/card/TourCard.test.tsx
      - name: Preserve shared sky rendering and scheduling
        run: npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSky.scheduling.test.tsx src/pages/Home/PublicAstridSky.test.ts src/pages/Home/publicAstridSkySession.test.ts src/pages/Home/publicAstridSkyGeometry.test.ts src/pages/Home/publicAstridSkyRenderer.test.ts src/pages/Home/publicAstridSkyRender.test.ts
      - name: Build the hosted website
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:hosted
      - name: Install Chromium and WebKit
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Full Chromium public-vision gate
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/chromium-results.json
        run: npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-content.spec.ts tests/e2e/public-astrid-vision-captures.spec.ts tests/e2e/public-astrid-vision-mobile-feedback.spec.ts tests/e2e/public-astrid-vision-layout-feedback.spec.ts tests/e2e/public-astrid-vision-hierarchy.spec.ts tests/e2e/public-astrid-vision-sigils-nav.spec.ts tests/e2e/public-astrid-vision-characteristics.spec.ts tests/e2e/public-astrid-vision-aspirations.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts tests/e2e/public-astrid-vision-stability.spec.ts tests/e2e/public-astrid-vision-entry.spec.ts --project=chromium-desktop --output=test-results/chromium --reporter=line,json
      - name: Full WebKit public-vision gate
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/webkit-results.json
        run: npx playwright test --config playwright.vision.config.ts --output=test-results/webkit --reporter=line,json
      - name: Commit only the fully qualified source tree
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$(cat qualification-evidence/tested-tree.txt)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(vision): eliminate reversing backdrop fades and freeze sky during modal handoff'
          test "$(git rev-parse HEAD^{tree})" = "$(cat qualification-evidence/tested-tree.txt)"
          git push origin HEAD:fix/vision-backdrop-flash-20261115
          git rev-parse HEAD > qualification-evidence/qualified-head.txt
      - name: Preserve source identities and full reports
        if: always()
        run: |
          mkdir -p test-results/vision-captures
          cp qualification-evidence/* test-results/vision-captures/ || true
          git diff > test-results/vision-captures/uncommitted-after-qualification.patch
          tar -cf test-results/vision-captures/backdrop-source.tar src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx src/pages/Home/PublicAstridSky.tsx src/pages/Home/PublicAstridSky.scheduling.test.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrid-backdrop-complete
          path: test-results/vision-captures/
          retention-days: 14
