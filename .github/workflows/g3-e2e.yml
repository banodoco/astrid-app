    - run: npm ci --legacy-peer-deps
    - run: npx playwright install --with-deps chrome chromium firefox webkit
    - run: npm run test:e2e:extension-cross-browser
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extension-cross-browser-results
        path: artifacts
