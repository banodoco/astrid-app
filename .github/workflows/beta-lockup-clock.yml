name: Qualify unified brand lockup
on:
  push:
    branches: [diag/beta-brand-lockup-20261116]
    paths: [.github/workflows/beta-lockup-clock.yml]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta-brand-follow-20261116
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Stop only the superseded queued diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url = 'https://api.github.com/repos/banodoco/astrid-app/actions/runs/43868839290';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          const response = await fetch(url, { headers });
          if (!response.ok) throw new Error(`Read run: ${response.status}`);
          const run = await response.json();
          if (run.head_sha !== 'fe9d58d274e8fb751f36002b6737e5fb8fdd974f' || run.head_branch !== 'diag/beta-brand-lockup-20261116') throw new Error('Unexpected diagnostic identity');
          if (run.status !== 'completed') {
            const cancel = await fetch(url + '/cancel', { method: 'POST', headers });
            if (!cancel.ok) throw new Error(`Cancel own superseded diagnostic: ${cancel.status}`);
            console.log(`Cancelled superseded diagnostic ${run.id} (${run.status})`);
          } else console.log(`Superseded diagnostic already completed: ${run.conclusion}`);
          JS
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium webkit
      - name: Run the identical source repair and browser assertions on Apple
        shell: bash
        run: |
          git fetch origin fe9d58d274e8fb751f36002b6737e5fb8fdd974f
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'fe9d58d274e8fb751f36002b6737e5fb8fdd974f:.github/workflows/beta-lockup-clock.yml'], text=True)
          def run(name):
              block = source.split('      - name: ' + name + '\n', 1)[1].split('\n      - ', 1)[0]
              script = textwrap.dedent(block.split('        run: |\n', 1)[1])
              print('Running:', name, flush=True)
              subprocess.run(['bash', '--noprofile', '--norc', '-e', '-o', 'pipefail', '-c', script], check=True)
          try:
              run('Preserve the mink bounds on the same transform-only timeline')
              run('Verify brand and retained player viewport regressions in Chromium')
              run('Verify WebKit and repeat the exact previously failing brand case')
              run('Commit the qualified source to the existing feature branch')
          finally:
              run('Preserve source and diagnostics')
              Path('beta-lockup-evidence/runner-note.txt').write_text('The superseded Ubuntu diagnostic43868839290 waited queued for a runner. This Apple job cancels only that exact run, then executes its immutable repair scripts and identical assertions. No product/test change for the runner switch, no duplicate PR, no original-media replacement. Full permanent qualification is still required.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrid-beta-unified-lockup
          path: beta-lockup-evidence/
          if-no-files-found: error
