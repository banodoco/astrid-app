# Default vitest run per push (testing plan UP.1). The checkout lane (npm run test:checkout) needs sibling repos and does not run here.
name: Tests

on:
  push:
    branches: [main, release-1, "int/**"]
  pull_request:
    branches: [main, "int/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Install tuple (manifest minus release/required/version_starts, plus public/install*) and release move together:
  # a tuple change needs release +1 exactly; otherwise release is unchanged. Base is the PR base or the push's before SHA.
  # PRs into int/** run with --integration: release, required and version_starts stay byte-identical to the base.
  release-guard:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Check install tuple and release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_REF" == int/* ]]; then
            node scripts/installer/release-guard.mjs "$BASE_SHA" HEAD --integration
          else
            node scripts/installer/release-guard.mjs "$BASE_SHA" HEAD
          fi

  # Pull requests run only release-guard above; the rest of this workflow runs on push as before.
  vitest:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the git-backed checks that run on push.
          fetch-depth: 0
          filter: blob:none
      - name: Restore npm cache (C-08)
        id: c08-app-test-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: node --test scripts/installer/release.test.mjs
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run test:sdk-boundary

  # The release tooling is macOS-only by design (lockf broker, BSD ps eww, darwin-pinned attestation), so the vitest job
  # declares these cases as skipped (config/testing/skipRegistry.mjs: macos-release-process-containment, macos-lockf-broker)
  # and this job runs exactly those files where the condition holds. Plain node: these files import only the repo.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-test-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

  release-tooling-macos:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/release/bounded-command.test.mjs scripts/release/astrid-release-provenance.test.mjs scripts/release/verify-extension-ship.test.mjs

  # Cross-repo copies: every vendored artifact must match its selected producer commit.
  boundary:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - id: pins
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const runtime = JSON.parse(fs.readFileSync('runtime.lock.json', 'utf8'));
          const astrid = JSON.parse(fs.readFileSync('config/astrid-cli-surface/vendor.lock.json', 'utf8'));
          process.stdout.write(`runtime_sha=${runtime.source_commit}\nastrid_sha=${astrid.source_commit}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime_sha }}
          path: runtime-producer
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.astrid_sha }}
          path: astrid-producer
      - run: |
          node scripts/vendor-lock.mjs check runtime.lock.json --producer runtime-producer
      - run: node scripts/vendor-lock.mjs check config/astrid-cli-surface/vendor.lock.json --producer astrid-producer
      - run: node --test scripts/quality/astrid-public-boundary.test.mjs
      - run: node scripts/build/verify-astrid-vendor-sources.mjs
