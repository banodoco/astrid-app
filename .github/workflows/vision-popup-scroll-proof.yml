name: Complete popup scroll proof
on:
  push:
    branches: [fix/vision-dialog-bounds-scroll-20261113]
    paths: [.github/workflows/vision-popup-scroll-proof.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-dialog-bounds-scroll-20261113
      - name: Preserve longhand styles and exercise real overflowing content
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/VisionDialog.tsx');s=p.read_text()
          for target in ['root','body']:
              old=f"    set({target}.style, 'overflow', 'hidden');"
              assert s.count(old)==1
              s=s.replace(old,f"    set({target}.style, 'overflow-x', 'hidden');\n    set({target}.style, 'overflow-y', 'hidden');")
          old="    set(root.style, 'overscroll-behavior', 'none');";assert s.count(old)==1
          s=s.replace(old,"    set(root.style, 'overscroll-behavior-x', 'none');\n    set(root.style, 'overscroll-behavior-y', 'none');")
          p.write_text(s)
          p=Path('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts');s=p.read_text()
          old='    const openers = [';assert s.count(old)==1
          s=s.replace(old,"    // Existing longhand styles must survive the shared page lock.\n    await page.evaluate(() => { document.body.style.overflowY = 'auto'; });\n"+old)
          old="      const contentBox = (await scroll.boundingBox())!;";assert s.count(old)==1
          s=s.replace(old,"""      // Some closed desktop subjects legitimately fit without a scrollbar.
                // Open their real disclosures before asserting scroll movement;
                // the control-bar checks above also exercise the short state.
                if (index < 2) {
                  await scroll.locator('details').evaluateAll(nodes => {
                    for (const node of nodes) (node as HTMLDetailsElement).open = true;
                  });
                  await scroll.evaluate(node => { node.scrollTop = 0; });
                }
                await expect.poll(() => scroll.evaluate(node => node.scrollHeight - node.clientHeight)).toBeGreaterThan(0);
          """+old)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts
          git commit -m 'fix(vision): preserve longhand scroll styles and prove expanded content scrolling'
          git push origin HEAD:fix/vision-dialog-bounds-scroll-20261113
