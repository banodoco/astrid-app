name: Beta brand follow workbench
on:
  push:
    branches: [fix/beta-brand-follow-20261116]
    paths: [.github/workflows/beta-brand-follow-workbench.yml]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta-brand-follow-20261116
          fetch-depth: 8
      - name: Commit exactly the passing source, with whitespace-only cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git fetch origin de7dd1e668aa6dcf3cbce013c701fa7c76615f99
          git merge --no-edit de7dd1e668aa6dcf3cbce013c701fa7c76615f99
          gh api repos/banodoco/astrid-app/actions/artifacts/14224284659/zip > /tmp/qualified-beta.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          archive = Path('/tmp/qualified-beta.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest() == '5c41e64117a1d39166c28396861255c9fe0b6b0739046eb57d1850c49a47180d'
          evidence = Path('beta-commit-evidence'); evidence.mkdir()
          with zipfile.ZipFile('/tmp/qualified-beta.zip') as z:
              for name, count in [('chromium-results.json', 9), ('webkit-results.json', 3)]:
                  report = json.loads(z.read(name))
                  assert report['stats']['expected'] == count
                  assert all(report['stats'][key] == 0 for key in ['unexpected', 'skipped', 'flaky'])
                  (evidence / name).write_bytes(z.read(name))
              files = ['src/pages/Home/publicAstridNavigation.ts', 'src/pages/Home/PublicAstridSite.css',
                  'tests/e2e/public-astrid-vision-entry.spec.ts', 'tests/e2e/public-astrid-vision-polish.spec.ts',
                  'scripts/quality/check-public-vision-production.mjs']
              identities = []
              for name in files:
                  original = z.read('source/' + name).decode()
                  cleaned = '\n'.join(line.rstrip() for line in original.splitlines()) + '\n'
                  # Only trailing whitespace changes relative to the passing artifact.
                  assert original.split() == cleaned.split()
                  Path(name).write_text(cleaned)
                  identities.append({'path': name, 'testedSha256': hashlib.sha256(original.encode()).hexdigest(),
                      'cleanedSha256': hashlib.sha256(cleaned.encode()).hexdigest()})
              (evidence / 'source-identities.json').write_text(json.dumps(identities, indent=2))
          (evidence / 'qualification-note.txt').write_text('Run43864204387 passed17 lifecycle/9 Chromium/3 WebKit tests, then stopped only at git diff --check on6 whitespace-only lines. No product assertion failed. This continuation copies the SHA-256-verified five source files from artifact14224284659 and strips trailing whitespace only. No focused tests rerun or waived. Final permanent PR qualification remains required.\n')
          PY
          git diff --check
          git diff -- src/pages/Home/publicAstridNavigation.ts src/pages/Home/PublicAstridSite.css tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts scripts/quality/check-public-vision-production.mjs > beta-commit-evidence/final.patch
          git add src/pages/Home/publicAstridNavigation.ts src/pages/Home/PublicAstridSite.css tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts scripts/quality/check-public-vision-production.mjs
          git rm .github/workflows/beta-brand-follow-workbench.yml
          git commit -m 'fix(vision): carry the Beta badge alongside the moving Astrid brand'
          git rev-parse HEAD HEAD^{tree} > beta-commit-evidence/candidate-source.txt
          git push origin HEAD:fix/beta-brand-follow-20261116
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrid-beta-follow-commit
          path: beta-commit-evidence/
          if-no-files-found: error
