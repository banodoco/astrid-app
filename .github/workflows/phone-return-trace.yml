name: Trace phone return scroll ownership
on:
  push:
    branches: [diag/ipad-landscape-chromium-20261116]
    paths: [.github/workflows/phone-return-trace.yml]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 10bc1510a2d9a7d3501bd7cf84ead51390601225
          - label: candidate
            ref: c2ddc8e25d77af03eb27fa9c21e65f6a10a16d58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Trace the unmodified failing case under bounded CPU delay
        shell: bash
        run: |
          mkdir -p phone-return-evidence
          git rev-parse HEAD HEAD^{tree} > phone-return-evidence/source.txt
          cat >> tests/e2e/public-astrid-vision-polish.spec.ts <<'SPEC'

          test.beforeEach(async ({ page }, info) => {
            const session = await page.context().newCDPSession(page);
            await session.send('Emulation.setCPUThrottlingRate', { rate: info.repeatEachIndex % 2 ? 4 : 1 });
            await page.addInitScript(() => {
              const w = window as unknown as { phoneScrollLog: unknown[] };
              const logs = w.phoneScrollLog = [] as unknown[];
              const target = (n: EventTarget | null) => n instanceof Element ? `${n.tagName}.${n.className}` : String(n);
              let watching = false;
              const read = (kind: string, detail: unknown = null) => {
                if (logs.length > 5000) return;
                const header = document.querySelector<HTMLElement>('.astrid-vision-bar');
                const link = document.querySelector<HTMLElement>('.astrid-vision-brand');
                const hero = document.querySelector<HTMLElement>('.astrid-vision-manifesto');
                logs.push({ at: performance.now(), kind, detail, y: scrollY, height: innerHeight,
                  documentHeight: document.documentElement?.scrollHeight, fonts: document.fonts.status,
                  active: target(document.activeElement), restoration: history.scrollRestoration,
                  page: location.pathname, phase: document.documentElement?.dataset.astridPageTransition,
                  condensed: header?.hasAttribute('data-condensed'),
                  header: header?.getBoundingClientRect().toJSON(), link: link?.getBoundingClientRect().toJSON(),
                  hero: hero?.getBoundingClientRect().toJSON() });
              };
              for (const event of ['scroll','scrollend','pointerdown','pointerup','click','focusin','popstate','hashchange','resize']) {
                window.addEventListener(event, e => read(event, { target: target(e.target), trusted: e.isTrusted }), true);
              }
              document.fonts.addEventListener('loadingdone', () => read('fonts-ready'));
              const originalScroll = window.scrollTo;
              window.scrollTo = function (...args: Parameters<typeof originalScroll>) {
                read('window.scrollTo', { args, stack: new Error().stack });
                const options = args[0];
                if (typeof options === 'object' && options?.top === 900 && !watching) {
                  watching = true;
                  const started = performance.now();
                  const tick = () => { read('frame'); if (performance.now() - started < 8000) requestAnimationFrame(tick); };
                  requestAnimationFrame(tick);
                }
                return originalScroll.apply(this, args);
              } as typeof originalScroll;
              const originalFocus = HTMLElement.prototype.focus;
              HTMLElement.prototype.focus = function (...args) { read('focus-call', { target: target(this), args, stack: new Error().stack }); return originalFocus.apply(this, args); };
              const originalIntoView = Element.prototype.scrollIntoView;
              Element.prototype.scrollIntoView = function (...args) { read('scrollIntoView-call', { target: target(this), args, stack: new Error().stack }); return originalIntoView.apply(this, args); };
              const originalBack = history.back;
              history.back = function () { read('history.back'); return originalBack.call(this); };
              document.addEventListener('DOMContentLoaded', () => {
                const observer = new MutationObserver(records => {
                  for (const r of records) if (r.target === document.documentElement || (r.target as Element).matches?.('.astrid-vision-bar'))
                    read('attribute', { target: target(r.target), attribute: r.attributeName });
                });
                observer.observe(document.documentElement, { subtree: true, attributes: true,
                  attributeFilter: ['data-condensed','data-astrid-page-transition','data-astrid-page-transition-style'] });
                read('ready');
              });
            });
          });
          test.afterEach(async ({ page }, info) => {
            const state = await page.evaluate(() => ({
              events: (window as unknown as { phoneScrollLog: unknown[] }).phoneScrollLog,
              transitions: (window as unknown as { __roomTransitions: unknown[] }).__roomTransitions,
            })).catch(error => ({ error: String(error) }));
            writeFileSync(`phone-return-evidence/trace-${info.repeatEachIndex}.json`, JSON.stringify(state, null, 2));
          });
          SPEC
          git diff > phone-return-evidence/instrumentation.patch
          set +e
          PLAYWRIGHT_OUTPUT_DIR=phone-return-evidence/playwright PLAYWRIGHT_JSON_OUTPUT_FILE=phone-return-evidence/results.json npx playwright test tests/e2e/public-astrid-vision-polish.spec.ts --config playwright.config.ts --project=chromium-desktop --grep 'snapshot at 390px' --repeat-each=6 --workers=2 --trace=on --reporter=line,json > phone-return-evidence/raw.log 2>&1
          result=$?
          echo "$result" > phone-return-evidence/exit.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-return-delay-${{ matrix.label }}
          path: phone-return-evidence/
          if-no-files-found: error
