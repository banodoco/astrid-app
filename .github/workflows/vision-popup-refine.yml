name: Apply scoped popup interaction refinement
on:
  push:
    branches: [fix/vision-dialog-bounds-scroll-20261113]
    paths: [.github/workflows/vision-popup-refine.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-dialog-bounds-scroll-20261113
      - name: Apply inspected source changes with exact anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def edit(path, old, new):
              p=Path(path); text=p.read_text()
              matches=[m.start() for m in re.finditer(re.escape(old),text)]
              if len(matches)!=1 and old.startswith(' '):
                  matches=[i for i in matches if i==0 or text[i-1]=='\n']
              assert len(matches)==1,(path,old[:100],len(matches))
              i=matches[0];p.write_text(text[:i]+new+text[i+len(old):])
          path=Path('scripts/quality/vision-popup-refine.py')
          code=path.read_text()
          # Use cross-engine synthetic events to verify cancellation, not a
          # browser-specific Touch constructor. Real wheel scrolling is separate.
          a=code.index('        const one = new Touch(')
          b=code.index('        return { drag: drag.defaultPrevented, pinch: pinch.defaultPrevented };',a)
          code=code[:a]+'''        const drag = new Event('touchmove', { bubbles: true, cancelable: true });
                  Object.defineProperty(drag, 'touches', { value: [{ identifier: 1 }] });
                  node.dispatchEvent(drag);
                  const pinch = new Event('touchmove', { bubbles: true, cancelable: true });
                  Object.defineProperty(pinch, 'touches', { value: [{ identifier: 1 }, { identifier: 2 }] });
                  node.dispatchEvent(pinch);
          '''+code[b:]
          exec(compile(code[code.index("base = 'src/pages/Home/'"):],str(path),'exec'),{'Path':Path,'edit':edit})
          path.unlink()
          PY
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add src/pages/Home tests/e2e scripts/quality/vision-popup-refine.py
          git commit -m 'fix(vision): bounded overlays, grouped gaps and modal scroll isolation'
          git push origin HEAD:fix/vision-dialog-bounds-scroll-20261113
          git rev-parse HEAD > /tmp/source-head.txt
          tar -cf /tmp/vision-popup-source.tar src/pages/Home tests/e2e/public-astrid-vision-aspirations.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vision-popup-source
          path: |
            /tmp/vision-popup-source.tar
            /tmp/source-head.txt
          retention-days: 3
