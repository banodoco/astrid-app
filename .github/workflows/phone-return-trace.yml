name: Trace phone return scroll ownership
on:
  push:
    branches: [diag/ipad-landscape-chromium-20261116]
    paths: [.github/workflows/phone-return-trace.yml]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 10bc1510a2d9a7d3501bd7cf84ead51390601225
          - label: candidate
            ref: c2ddc8e25d77af03eb27fa9c21e65f6a10a16d58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Compare real pointer navigation with explicit retry scroll alignments
        shell: bash
        run: |
          mkdir -p phone-return-evidence
          git rev-parse HEAD HEAD^{tree} > phone-return-evidence/source.txt
          node -p 'require("playwright-core/package.json").version' > phone-return-evidence/playwright-version.txt
          find node_modules/playwright-core/lib -name dom.js -exec cp '{}' phone-return-evidence/playwright-dom.js \;
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/public-astrid-vision-polish.spec.ts')
          s = p.read_text()
          old = "    await page.getByRole('link', { name: 'Astrid home', exact: true }).click();"
          assert s.count(old) == 1
          new = """    const homeLink = page.getByRole('link', { name: 'Astrid home', exact: true });
              await expect(homeLink.locator('img')).toBeInViewport({ ratio: 1 });
              const point = await homeLink.locator('img').evaluate(node => {
                const box = node.getBoundingClientRect();
                const x = box.x + box.width / 2, y = box.y + box.height / 2;
                return { x, y, hit: document.elementFromPoint(x, y)?.closest('a') === node.closest('a') };
              });
              expect(point.hit).toBe(true);
              await page.mouse.click(point.x, point.y);"""
          p.write_text(s.replace(old, new))
          PY
          cat >> tests/e2e/public-astrid-vision-polish.spec.ts <<'SPEC'

          test.beforeEach(async ({ page }, info) => {
            const session = await page.context().newCDPSession(page);
            await session.send('Emulation.setCPUThrottlingRate', { rate: info.repeatEachIndex % 2 ? 4 : 1 });
          });
          test.afterEach(async ({ page }, info) => {
            const records = await page.evaluate(() => (window as unknown as { __roomTransitions: unknown[] }).__roomTransitions).catch(error => ({ error: String(error) }));
            writeFileSync(`phone-return-evidence/transitions-${info.repeatEachIndex}-${info.title.includes('diagnostic') ? 'probe' : 'return'}.json`, JSON.stringify(records, null, 2));
          });
          test('sticky alignment diagnostic', async ({ page }, info) => {
            test.setTimeout(60000);
            await pinLive(page);
            await page.setViewportSize({ width: 390, height: 844 });
            await page.emulateMedia({ reducedMotion: 'no-preference' });
            await page.goto('/vision', { waitUntil: 'domcontentloaded' });
            await expect(page.locator('.astrid-vision-principles > li')).toHaveCount(4);
            await page.addStyleTag({ content: 'html { scroll-behavior: smooth !important; }' });
            const records = [];
            for (const block of ['end', 'center', 'nearest'] as const) {
              await page.evaluate(() => window.scrollTo({ top: 900, behavior: 'instant' }));
              await page.waitForTimeout(400);
              const result = await page.locator('.astrid-vision-brand').evaluate(async (node, block) => {
                const before = scrollY, box = node.getBoundingClientRect().toJSON();
                node.scrollIntoView({ block, inline: block });
                await new Promise(resolve => setTimeout(resolve, 900));
                return { block, before, after: scrollY, beforeBox: box, afterBox: node.getBoundingClientRect().toJSON() };
              }, block);
              records.push(result);
            }
            writeFileSync(`phone-return-evidence/alignments-${info.repeatEachIndex}.json`, JSON.stringify(records, null, 2));
            expect(records.every(record => record.before === 900)).toBe(true);
            expect(records.find(record => record.block === 'nearest')!.after).toBe(900);
            expect(records.find(record => record.block === 'end')!.after).toBeLessThan(500);
          });
          SPEC
          git diff > phone-return-evidence/instrumentation.patch
          set +e
          PLAYWRIGHT_OUTPUT_DIR=phone-return-evidence/playwright PLAYWRIGHT_JSON_OUTPUT_FILE=phone-return-evidence/results.json npx playwright test tests/e2e/public-astrid-vision-polish.spec.ts --config playwright.config.ts --project=chromium-desktop --grep 'snapshot at 390px|sticky alignment diagnostic' --repeat-each=4 --workers=2 --trace=on --reporter=line,json > phone-return-evidence/raw.log 2>&1
          result=$?
          echo "$result" > phone-return-evidence/exit.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-pointer-control-${{ matrix.label }}
          path: phone-return-evidence/
          if-no-files-found: error
