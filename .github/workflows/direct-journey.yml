# Same-machine "direct" journey (Plan A, card A0.3): a production build on a hosted-style HTTPS origin,
# a real Runtime daemon on throwaway SQLite serving it through its own browser door, and Chromium.
# Local equivalent: npm run test:e2e:direct (tests/e2e/local/support/harness.ts).
#
# Runtime and Agent checkouts are private, so actions/checkout needs tokens that can read them. Add repository
# secrets RUNTIME_READ_TOKEN and ASTRID_READ_TOKEN with read access to banodoco/astrid-runtime and
# banodoco/astrid-agent. When either secret is not set, that checkout falls back to github.token, which only
# works if its repo is readable by this repository. Pull requests from forks get no secrets.
#
# Pass rule (a skip means a missing harness, R-9): exactly M tests expected to fail (M is the journey
# file's budget in scripts/quality/check-known-failures.mjs), none unexpected, none flaky, none skipped.
name: Direct Journey

on:
  pull_request:
    paths:
      - ".github/workflows/direct-journey.yml"
      - "scripts/runtime-discovery-proxy.mjs"
      - "scripts/dev-local-workspace*"
      - "src/integrations/runtime/**"
      - "src/shared/lib/media/**"
      - "tests/e2e/local/**"
      - "tests/e2e/support/**"
      - "playwright.direct.config.ts"
      - "playwright.three-products.config.ts"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      # Once this reviewed branch is available, an authorized diagnostic dispatch is:
      # gh workflow run direct-journey.yml --repo banodoco/astrid-app --ref r12-a4-second-repair -f token_sniff_diagnostics=true -f agent_ref=313bbd46f1e24bfe635655d78b27ab0b321145d5 -f runtime_ref=42ae24aff8d2cb854f874ce134161077a3ba3641
      token_sniff_diagnostics:
        description: Emit sanitized three-product credential scan lifecycle events
        required: false
        default: false
        type: boolean
      protocol_diagnostics:
        description: Capture and verify sanitized Playwright protocol diagnostics for three-products
        required: false
        default: false
        type: boolean
      runtime_ref:
        description: Optional Runtime SHA or ref for both journey jobs; empty uses the App manifest's pin
        required: false
        type: string
      agent_ref:
        description: Optional Agent SHA or ref for both journey jobs; empty uses the App manifest's pin
        required: false
        type: string

concurrency:
  group: direct-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-journey:
    runs-on: ubuntu-24.04
    steps:
      # The harness finds the Runtime at ../astrid-runtime and Agent at ../astrid-agent,
      # so all three repos are checked out as siblings under $GITHUB_WORKSPACE: App in astrid-app.
      - uses: actions/checkout@v4
        id: app-checkout
        with:
          path: astrid-app
      - name: Read the Agent and Runtime pins from the App manifest
        id: pins
        run: |
          node -e '
            const m = require("./astrid-app/public/install-manifest.json");
            const agent = m.agent?.sha, runtime = m.runtime?.sha;
            for (const sha of [agent, runtime]) if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error(`manifest pin is not a full SHA: ${sha}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `agent_sha=${agent}\nruntime_sha=${runtime}\n`);'
      - uses: actions/checkout@v4
        id: runtime-checkout
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ inputs.runtime_ref || steps.pins.outputs.runtime_sha }}
          path: astrid-runtime
          token: ${{ secrets.RUNTIME_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        id: agent-checkout
        with:
          repository: banodoco/astrid-agent
          ref: ${{ inputs.agent_ref || steps.pins.outputs.agent_sha }}
          path: astrid-agent
          token: ${{ secrets.ASTRID_READ_TOKEN || github.token }}

      - name: Resolve effective checkout SHAs
        id: checkout-shas
        run: |
          app_head="$(git -C astrid-app rev-parse --verify HEAD)"
          runtime_head="$(git -C astrid-runtime rev-parse --verify HEAD)"
          agent_head="$(git -C astrid-agent rev-parse --verify HEAD)"
          for head in "$app_head" "$runtime_head" "$agent_head"; do
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          done
          printf 'app_head=%s\n' "$app_head" >> "$GITHUB_OUTPUT"
          printf 'runtime_head=%s\n' "$runtime_head" >> "$GITHUB_OUTPUT"
          printf 'agent_head=%s\n' "$agent_head" >> "$GITHUB_OUTPUT"
          printf 'APP_CHECKOUT_SHA=%s\n' "$app_head" >> "$GITHUB_ENV"
          printf 'RUNTIME_CHECKOUT_SHA=%s\n' "$runtime_head" >> "$GITHUB_ENV"
          printf 'AGENT_CHECKOUT_SHA=%s\n' "$agent_head" >> "$GITHUB_ENV"

      - name: Restore npm cache (C-08)
        id: c08-app-direct-journey-2
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Runtime venv
        working-directory: astrid-runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m runtime_protocol.cli --help > /dev/null

      - name: Build the Astrid venv
        working-directory: astrid-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          # Astrid imports runtime_protocol but does not declare it: use the pinned sibling Runtime under test.
          .venv/bin/python -m pip install --no-deps -e ../astrid-runtime
          .venv/bin/python -m astrid.core.dev.cross_client --help > /dev/null
          # The pack lifecycle journey invokes the console script from this pinned Agent environment.
          test -x .venv/bin/astrid

      - name: Install App dependencies, Chromium and ffmpeg
        working-directory: astrid-app
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run the journey
        working-directory: astrid-app
        env:
          # Written by the JSON reporter itself: the config's globalSetup prints to stdout, so a shell redirect would corrupt the file.
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/direct-journey.json
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/direct-results
          NODE_OPTIONS: --max-old-space-size=4096
          ASTRID_APP_DIRECT_DOOR_PORT: "17341"
          ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
          ASTRID_PYTHON: ${{ github.workspace }}/astrid-agent/.venv/bin/python
          ASTRID_PACKS_AGENT: ${{ github.workspace }}/astrid-agent/.venv/bin/astrid
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
          APP_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.app_head }}
          RUNTIME_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.runtime_head }}
          AGENT_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.agent_head }}
          # A missing dependency in this job is a failure, never a skip (config/testing/skipRegistry.mjs).
          ASTRID_REQUIRE_LANES: direct-journey
        run: npx playwright test -c playwright.direct.config.ts --reporter=json,list,./config/testing/playwrightSkipGuard.ts

      - name: Check the outcome counts
        if: ${{ !cancelled() }}
        working-directory: astrid-app
        env:
          REPORT: ${{ runner.temp }}/direct-journey.json
        run: |
          jq '
            [.. | objects | select(has("expectedStatus") and has("results"))] as $tests
            | {
                total: ($tests | length),
                expected_failures: ($tests | map(select(.expectedStatus == "failed")) | length),
                expected_failures_that_failed: ($tests | map(select(.expectedStatus == "failed" and .status == "expected")) | length),
                unexpected: .stats.unexpected,
                flaky: .stats.flaky,
                skipped: .stats.skipped
              }
            | . as $r | $r, (
                if $r.total > 0 and $r.expected_failures == 0 and $r.expected_failures_that_failed == 0
                   and $r.unexpected == 0 and $r.flaky == 0 and $r.skipped == 0
                then empty else error("direct journey: want 0 expected failures, 0 unexpected, 0 flaky, 0 skipped; got \($r)") end)
          ' "$REPORT"

      - name: Collect artifacts
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/direct-artifacts"
          cp "${{ runner.temp }}/direct-journey.json" "$RUNNER_TEMP/direct-artifacts/" || true
          find "${{ runner.temp }}/direct-results" -name 'direct-measurements.json' -exec cp {} "$RUNNER_TEMP/direct-artifacts/" \; || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: direct-journey
          path: ${{ runner.temp }}/direct-artifacts/
          if-no-files-found: warn
      - name: Collect the autostart-off card
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/autostart-off-card"
          find "${{ runner.temp }}/direct-results" -name 'autostart-off-card.png' -exec cp {} "$RUNNER_TEMP/autostart-off-card/" \;
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: autostart-off-card
          path: ${{ runner.temp }}/autostart-off-card/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: direct-journey-traces
          path: ${{ runner.temp }}/direct-results/
          if-no-files-found: ignore

  # Three products on one realm (testing plan F2, thin slice): the same hosted build and real Runtime (with its browser door) as the
  # job above, plus the real Astrid CLI as a second client. Local equivalent: npm run test:e2e:three-products.
  # Astrid is private to this lane's token: add a repository secret ASTRID_READ_TOKEN (a fine-grained PAT with read access to
  # banodoco/astrid-agent, or whichever repository holds Astrid). Without it the job falls back to github.token, which
  # only reads Astrid if this repository can. A missing checkout or interpreter fails the job by name (R-9); it never skips.
  # Until the Astrid branch carrying astrid/core/dev/cross_client.py (tidy-w2) merges to its main, this job checks out an Astrid
  # without that module, so any PR touching tests/e2e/local/** (or the paths above) is red here until that merge.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-direct-journey-2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}

  three-products:
    runs-on: ubuntu-24.04
    concurrency:
      group: three-products-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The harness finds Astrid at ../astrid-agent (ASTRID_CHECKOUT overrides) and the Runtime at ../astrid-runtime,
      # so all three checkouts are siblings under $GITHUB_WORKSPACE.
      - uses: actions/checkout@v4
        id: app-checkout
        with:
          path: astrid-app
      - name: Read the Agent and Runtime pins from the App manifest
        id: pins
        run: |
          node -e '
            const m = require("./astrid-app/public/install-manifest.json");
            const agent = m.agent?.sha, runtime = m.runtime?.sha;
            for (const sha of [agent, runtime]) if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error(`manifest pin is not a full SHA: ${sha}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `agent_sha=${agent}\nruntime_sha=${runtime}\n`);'
      - uses: actions/checkout@v4
        id: runtime-checkout
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ inputs.runtime_ref || steps.pins.outputs.runtime_sha }}
          path: astrid-runtime
          token: ${{ secrets.RUNTIME_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        id: agent-checkout
        with:
          repository: banodoco/astrid-agent
          ref: ${{ inputs.agent_ref || steps.pins.outputs.agent_sha }}
          path: astrid-agent
          token: ${{ secrets.ASTRID_READ_TOKEN || github.token }}

      - name: Resolve effective checkout SHAs
        id: checkout-shas
        run: |
          app_head="$(git -C astrid-app rev-parse --verify HEAD)"
          runtime_head="$(git -C astrid-runtime rev-parse --verify HEAD)"
          agent_head="$(git -C astrid-agent rev-parse --verify HEAD)"
          for head in "$app_head" "$runtime_head" "$agent_head"; do
            [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          done
          printf 'app_head=%s\n' "$app_head" >> "$GITHUB_OUTPUT"
          printf 'runtime_head=%s\n' "$runtime_head" >> "$GITHUB_OUTPUT"
          printf 'agent_head=%s\n' "$agent_head" >> "$GITHUB_OUTPUT"
          printf 'APP_CHECKOUT_SHA=%s\n' "$app_head" >> "$GITHUB_ENV"
          printf 'RUNTIME_CHECKOUT_SHA=%s\n' "$runtime_head" >> "$GITHUB_ENV"
          printf 'AGENT_CHECKOUT_SHA=%s\n' "$agent_head" >> "$GITHUB_ENV"

      - name: Restore npm cache (C-08)
        id: c08-app-direct-journey-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Runtime venv
        working-directory: astrid-runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m runtime_protocol.cli --help > /dev/null

      - name: Build the Astrid venv
        working-directory: astrid-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          # Astrid imports runtime_protocol but does not declare it: the installer puts the Runtime beside it with --no-deps
          # (astrid/installer/backend.py, scripts/ci_install_runtime.py). Here the Runtime under test is the sibling checkout.
          .venv/bin/python -m pip install --no-deps -e ../astrid-runtime
          .venv/bin/python -m astrid.core.dev.cross_client --help > /dev/null

      # Chrome, not Chromium: the render case plays an H.264 film (the bundled Chromium cannot decode it) and a missing Chrome
      # fails at browser launch. ffmpeg makes the case's real VP8 and Opus media, and the host's ffmpeg renderer makes the render.
      - name: Install App dependencies, Chrome and ffmpeg
        working-directory: astrid-app
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium chrome
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Prepare protocol diagnostics
        if: ${{ inputs.protocol_diagnostics }}
        working-directory: astrid-app
        run: |
          mkdir -p "$RUNNER_TEMP/r12-protocol-diagnostics"
          node scripts/diagnostics/instrument-playwright.mjs node_modules/playwright-core/lib/coreBundle.js
          app_sha="$(git rev-parse HEAD)"
          playwright_version="$(node -p 'require("playwright-core/package.json").version')"
          node_version="$(node --version)"
          chrome_version="$(google-chrome --version)"
          chromium_path="$(node -p 'require("playwright-core").chromium.executablePath()')"
          chromium_version="$("$chromium_path" --version)"
          printf 'run_id=%s\nrun_attempt=%s\njob=%s\napp_sha=%s\nplaywright_core=%s\nnode=%s\nchrome=%s\nchromium=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$app_sha" "$playwright_version" "$node_version" "$chrome_version" "$chromium_version" \
            > "$RUNNER_TEMP/r12-protocol-diagnostics/versions.txt"

      - name: Run the three-product journey
        working-directory: astrid-app
        env:
          ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
          ASTRID_REQUIRE_LANES: direct-journey
          ASTRID_PYTHON: ${{ github.workspace }}/astrid-agent/.venv/bin/python
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
          APP_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.app_head }}
          RUNTIME_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.runtime_head }}
          AGENT_CHECKOUT_SHA: ${{ steps.checkout-shas.outputs.agent_head }}
          TIMELINE_BUNDLE_AGENT_HEAD: ${{ steps.checkout-shas.outputs.agent_head }}
          TIMELINE_BUNDLE_RUNTIME_HEAD: ${{ steps.checkout-shas.outputs.runtime_head }}
          # Written by the JSON reporter itself (the globalSetup prints to stdout, so a shell redirect would corrupt the file).
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/three-products.json
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/three-products-results
          TOKEN_SNIFF_DIAGNOSTICS: ${{ (inputs.token_sniff_diagnostics || inputs.protocol_diagnostics) && '1' || '0' }}
          PW_R12_DIAGNOSTICS: ${{ inputs.protocol_diagnostics && '1' || '0' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [[ "$PW_R12_DIAGNOSTICS" == 1 ]]; then
            node scripts/diagnostics/capture-journey.mjs "$RUNNER_TEMP/r12-protocol-diagnostics" npm run test:e2e:three-products -- --reporter=json,list,./config/testing/playwrightSkipGuard.ts
          else
            npm run test:e2e:three-products -- --reporter=json,list,./config/testing/playwrightSkipGuard.ts
          fi

      - name: Verify protocol diagnostic evidence
        if: ${{ !cancelled() && inputs.protocol_diagnostics }}
        working-directory: astrid-app
        run: node scripts/diagnostics/verify-playwright-log.mjs "$RUNNER_TEMP/r12-protocol-diagnostics/combined.log"

      - name: Upload sanitized protocol diagnostic evidence
        if: ${{ !cancelled() && inputs.protocol_diagnostics }}
        uses: actions/upload-artifact@v4
        with:
          name: three-products-protocol-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r12-protocol-diagnostics/
          if-no-files-found: error

      # Pass rule (R-9, same as the direct journey): no quarantined cases exist for this spec, so every case must pass. Durations are
      # written to three-products-summary.json and recorded, never judged (R-10).
      - name: Check the outcome counts
        if: ${{ !cancelled() }}
        working-directory: astrid-app
        env:
          REPORT: ${{ runner.temp }}/three-products.json
        run: |
          jq '
            [.. | objects | select(has("expectedStatus") and has("results"))] as $tests
            | {
                total: ($tests | length),
                expected_failures: ($tests | map(select(.expectedStatus == "failed")) | length),
                expected_failures_that_failed: ($tests | map(select(.expectedStatus == "failed" and .status == "expected")) | length),
                unexpected: .stats.unexpected,
                flaky: .stats.flaky,
                skipped: .stats.skipped
              }
            | . as $r | $r, (
                if $r.total > 0 and $r.expected_failures == 0 and $r.expected_failures_that_failed == 0
                   and $r.unexpected == 0 and $r.flaky == 0 and $r.skipped == 0
                then empty else error("three-product journey: want cases, 0 expected failures, 0 unexpected, 0 flaky, 0 skipped; got \($r)") end)
          ' "$REPORT"

      - name: Collect artifacts
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/three-products-artifacts"
          cp "${{ runner.temp }}/three-products.json" "$RUNNER_TEMP/three-products-artifacts/" || true
          find "${{ runner.temp }}/three-products-results" -name 'three-products-summary.json' -exec cp {} "$RUNNER_TEMP/three-products-artifacts/" \; || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: three-products
          path: ${{ runner.temp }}/three-products-artifacts/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: three-products-traces
          path: ${{ runner.temp }}/three-products-results/
          if-no-files-found: ignore
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-direct-journey-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}
