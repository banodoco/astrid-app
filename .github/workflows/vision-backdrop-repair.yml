name: Qualify Vision backdrop repair
on:
  push:
    branches: [fix/vision-backdrop-flash-20261115]
    paths: [.github/workflows/vision-backdrop-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-backdrop-flash-20261115
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - name: Apply the unchanged hash-verified product repair
        run: |
          git fetch --no-tags --depth=1 origin f8f1a152b2df2028d05bf168f7136cbc20611ad4
          python3 - <<'PY'
          import hashlib, subprocess, textwrap
          donor = subprocess.check_output(['git', 'show', 'f8f1a152b2df2028d05bf168f7136cbc20611ad4:.github/workflows/vision-backdrop-repair.yml'])
          assert hashlib.sha1(b'blob '+str(len(donor)).encode()+b'\0'+donor).hexdigest() == 'e8f61ab0dcf5eb6c6f43f75ba9627c88ff327d3c'
          text = donor.decode()
          start = text.index('          import base64, gzip, hashlib, subprocess\n')
          end = text.index('\n          PY', start)
          # This exact immutable recipe checks SHA-256 before git apply --check.
          exec(compile(textwrap.dedent(text[start:end]), '<verified-backdrop-recipe>', 'exec'))
          PY
      - name: Settle the preceding gesture without changing opening assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/public-astrid-vision-entry.spec.ts')
          s = p.read_text()
          old = '''        await opener.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(400);
          '''
          new = '''        await opener.scrollIntoViewIfNeeded();
                  if (scenario.width === 1440) {
                    const bounds = await opener.boundingBox();
                    expect(bounds).not.toBeNull();
                    await page.mouse.move(bounds!.x + bounds!.width / 2, bounds!.y + bounds!.height / 2);
                  }
                  // Finish the preceding scroll/pointer parallax before measuring a new
                  // action. A fixed delay can leave subpixel easing in the first frame.
                  await page.evaluate(() => new Promise<void>((resolve, reject) => {
                    let previous = '', stable = 0, attempts = 0;
                    const settle = () => {
                      const transforms = Array.from(document.querySelectorAll<HTMLCanvasElement>('.astrid-vision .astrid-sky canvas'))
                        .map(canvas => canvas.style.transform).join('|');
                      stable = transforms === previous ? stable + 1 : 0;
                      previous = transforms;
                      if (stable >= 4) resolve();
                      else if (++attempts >= 240) reject(new Error('Sky parallax did not settle before the opening gesture'));
                      else requestAnimationFrame(settle);
                    };
                    requestAnimationFrame(settle);
                  }));
          '''
          assert s.count(old) == 1, 'Unexpected regression source; stop'
          p.write_text(s.replace(old, new))
          PY
      - run: npm ci --legacy-peer-deps
      - name: Verify syntax, lifecycle and lint
        run: |
          node --check scripts/quality/check-public-vision-production.mjs
          npx eslint src/pages/Home/VisionDialog.tsx --max-warnings 0
          npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium colour continuity
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/backdrop-chromium.json
        run: npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --project=chromium-desktop --grep 'popup shading never|shared popup reveal' --output=test-results/backdrop-chromium --reporter=line,json
      - name: WebKit colour continuity
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/backdrop-webkit.json
        run: npx playwright test --config playwright.vision.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --grep 'popup shading never|shared popup reveal' --output=test-results/backdrop-webkit --reporter=line,json
      - name: Commit qualified source and regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
          git commit -m 'fix(vision): drive popup and backdrop from one monotonic reveal'
          git push origin HEAD:fix/vision-backdrop-flash-20261115
      - name: Preserve exact candidate and diff
        if: always()
        run: |
          mkdir -p test-results/vision-captures
          git rev-parse HEAD > test-results/vision-captures/backdrop-head.txt
          git diff > test-results/vision-captures/backdrop-working.patch
          tar -cf test-results/vision-captures/backdrop-source.tar src/pages/Home/VisionMobileLayout.css src/pages/Home/VisionDialog.tsx tests/e2e/public-astrid-vision-entry.spec.ts scripts/quality/check-public-vision-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-backdrop-repaired
          path: test-results/vision-captures/
          retention-days: 7
