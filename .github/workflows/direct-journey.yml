name: I-AP-36 focused direct journey
on:
  workflow_dispatch:
    inputs:
      agent_sha:
        description: Exact Agent commit SHA
        required: true
        type: string
      runtime_sha:
        description: Exact Runtime commit SHA
        required: true
        type: string
      case_1:
        description: Playwright file and line for save and reload
        required: true
        type: string
      case_2:
        description: Playwright file and line for stale writer
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate exact inputs
        env:
          AGENT_SHA: ${{ inputs.agent_sha }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          CASE_1: ${{ inputs.case_1 }}
          CASE_2: ${{ inputs.case_2 }}
        run: |
          set -euo pipefail
          test "$AGENT_SHA" = 1d3f6fbbd9b2cdf7709c274a13bd9fbd3ccf34e7
          test "$RUNTIME_SHA" = e57750df0c3e5767fb1f6d2b5ec1eec46474e077
          test "$CASE_1" = tests/e2e/local/direct-journey.spec.ts:421
          test "$CASE_2" = tests/e2e/local/direct-journey.spec.ts:438
      - uses: actions/checkout@v4
        with:
          path: astrid-app
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ inputs.runtime_sha }}
          path: astrid-runtime
          token: ${{ secrets.RUNTIME_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ inputs.agent_sha }}
          path: astrid-agent
          token: ${{ secrets.ASTRID_READ_TOKEN || github.token }}
      - name: Record and verify checkout identities
        env:
          AGENT_SHA: ${{ inputs.agent_sha }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          CASE_1: ${{ inputs.case_1 }}
          CASE_2: ${{ inputs.case_2 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iap36"
          {
            printf 'run_url=%s/%s/actions/runs/%s\nrun_id=%s\nrun_attempt=%s\nworkflow_ref=%s\nworkflow_sha=%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA"
            printf 'app_product_source=f8396909b4a41f0442f516a28d7a9b50dddd2ad2\napp_checkout=%s\nagent_checkout=%s\nruntime_checkout=%s\ncase_1=%s\ncase_2=%s\n' "$(git -C astrid-app rev-parse HEAD)" "$(git -C astrid-agent rev-parse HEAD)" "$(git -C astrid-runtime rev-parse HEAD)" "$CASE_1" "$CASE_2"
          } | tee "$RUNNER_TEMP/iap36/identities.txt"
          test "$(git -C astrid-app rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C astrid-agent rev-parse HEAD)" = "$AGENT_SHA"
          test "$(git -C astrid-runtime rev-parse HEAD)" = "$RUNTIME_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Runtime venv
        working-directory: astrid-runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m runtime_protocol.cli --help > /dev/null
      - name: Build Agent venv
        working-directory: astrid-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip install --no-deps -e ../astrid-runtime
          .venv/bin/python -m astrid.core.dev.cross_client --help > /dev/null
      - name: Install App dependencies and browser
        working-directory: astrid-app
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run the two exact cases
        working-directory: astrid-app
        env:
          CASE_1: ${{ inputs.case_1 }}
          CASE_2: ${{ inputs.case_2 }}
          NODE_OPTIONS: --max-old-space-size=4096
          ASTRID_APP_DIRECT_DOOR_PORT: '17341'
          ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
          ASTRID_PYTHON: ${{ github.workspace }}/astrid-agent/.venv/bin/python
          ASTRID_REQUIRE_LANES: direct-journey
        run: |
          set -uo pipefail
          for n in 1 2; do
            var="CASE_$n"
            export PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/iap36/case-$n.json"
            export PLAYWRIGHT_OUTPUT_DIR="$RUNNER_TEMP/iap36/results-$n"
            printf 'command: npx playwright test -c playwright.direct.config.ts %s --reporter=json,list,./config/testing/playwrightSkipGuard.ts\n' "${!var}" | tee "$RUNNER_TEMP/iap36/case-$n.log"
            npx playwright test -c playwright.direct.config.ts "${!var}" --reporter=json,list,./config/testing/playwrightSkipGuard.ts 2>&1 | tee -a "$RUNNER_TEMP/iap36/case-$n.log"
            code=${PIPESTATUS[0]}
            printf '%s\n' "$code" > "$RUNNER_TEMP/iap36/case-$n.exit"
            printf 'inner_exit=%s\n' "$code" | tee -a "$RUNNER_TEMP/iap36/case-$n.log"
          done
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.RUNNER_TEMP + '/iap36';
          const titles = ['App: open the seeded project, edit, save, reload byte-identical', 'App: a second writer saves first, the App shows the conflict and keeps the draft'];
          let ok = true;
          for (let i = 1; i <= 2; i++) {
            try {
              const report = JSON.parse(fs.readFileSync(path.join(root, `case-${i}.json`)));
              const specs = [];
              function visit(s) { for (const spec of s.specs || []) specs.push(spec); for (const sub of s.suites || []) visit(sub); }
              for (const suite of report.suites || []) visit(suite);
              const tests = specs.flatMap(s => (s.tests || []).map(t => ({title:s.title, ...t})));
              const pass = fs.readFileSync(path.join(root, `case-${i}.exit`), 'utf8').trim() === '0' && tests.length === 1 && tests[0].title === titles[i-1] && tests[0].expectedStatus === 'passed' && tests[0].status === 'expected' && tests[0].results.length === 1 && tests[0].results[0].status === 'passed' && report.stats.unexpected === 0 && report.stats.flaky === 0 && report.stats.skipped === 0;
              console.log(`case_${i}_gate=${pass ? 'passed' : 'failed'} title=${titles[i-1]} count=${tests.length}`);
              ok &&= pass;
            } catch (e) { console.error(`case_${i}_gate=failed`, e.message); ok = false; }
          }
          process.exit(ok ? 0 : 1);
          NODE
      - name: Hash evidence
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/iap36"
          (cd "$RUNNER_TEMP/iap36" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: iap36-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iap36/
          if-no-files-found: error
