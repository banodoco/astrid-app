name: Release 14 exact-source App test evidence

on: workflow_dispatch

permissions:
  contents: read

jobs:
  vitest:
    name: Native App evidence (${{ matrix.case_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: p61-base
            app_sha: 0bce7312f2fc8030b50286ed75b38d0232100820
          - case_name: p61-candidate
            app_sha: 75a83f5329aa6688cb32cf73836b20f557e2e2fb
          - case_name: fix14-base
            app_sha: a55ff290ed4f291420f21d340a5117c0f8b5a38a
          - case_name: fix14-candidate
            app_sha: 2c01a777992b4b78356680a31ab3200491b450a9
    env:
      APP_SHA: ${{ matrix.app_sha }}
      PROOF_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PROOF_WORKFLOW_REF: ${{ github.workflow_ref }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact App source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.app_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node as in the source Tests workflow
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Record the source and prepare external proof tools
        id: pins
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/app-proof"
          mkdir -p "$proof"
          echo "PROOF=$proof" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          { git rev-parse HEAD HEAD^{tree}; node -v; npm -v; } > "$proof/source.txt"
          printf '%s\n' "$GITHUB_SHA" "$PROOF_WORKFLOW_SHA" "$PROOF_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$proof/workflow-identity.txt"
          sha256sum package.json package-lock.json .github/workflows/test.yml public/install-manifest.json \
            config/testing/{vitest.config.ts,vitest.boundary.config.ts,skipGuardReporter.ts,skipRegistry.mjs} > "$proof/source.sha256"
          node --input-type=module <<'NODE' | tee "$proof/pins.txt" >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/install-manifest.json', 'utf8'));
          for (const component of ['agent', 'runtime']) {
            const sha = manifest[component]?.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw Error('Invalid ' + component + ' SHA');
            console.log(component + '_sha=' + sha);
          }
          NODE
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/banodoco/astrid-app/549e335dc766f373a8a40cc0690730db75295153/scripts/quality/check-vitest-results.py \
            -o "$proof/check-vitest-results.py"
          echo "2a03b5d7bcabf77debe960e36e04a86873f0ad5b2a43e81a13dea409a907f987  $proof/check-vitest-results.py" | sha256sum -c -
          cat > "$proof/native-receipt.mjs" <<'REPORTER'
          import { closeSync, openSync, writeSync } from 'node:fs';
          import path from 'node:path';

          export default class NativeReceipt {
            onInit(ctx) { this.root = ctx.config.root; }
            relative(file) { return path.relative(this.root, file).split(path.sep).join('/'); }
            record(row) { writeSync(this.fd, JSON.stringify(row) + '\n'); }
            identity(test) {
              return { id: test.id, file: this.relative(test.module.moduleId), name: test.fullName,
                expectedFailure: Boolean(test.options.fails), mode: test.options.mode };
            }
            onTestRunStart(specs) {
              this.fd = openSync(process.env.VITEST_PROOF_STREAM, 'wx');
              this.record({ event: 'start', version: 1, modules: specs.map(s => this.relative(s.moduleId)) });
            }
            onTestModuleCollected(module) {
              this.record({ event: 'collected', file: this.relative(module.moduleId),
                tests: [...module.children.allTests()].map(test => this.identity(test)) });
            }
            onTestCaseResult(test) {
              const result = test.result();
              this.record({ event: 'result', ...this.identity(test), state: result.state,
                ...(result.state === 'skipped' && { note: result.note ?? '' }) });
            }
            onTestRunEnd(modules, errors, reason) {
              const cases = modules.flatMap(module => [...module.children.allTests()]);
              this.record({ event: 'end', tests: cases.length, pending: cases.filter(t => t.result().state === 'pending').length,
                reason, unhandledErrors: errors.map(e => String(e.message ?? e)) });
              closeSync(this.fd);
            }
          }
          REPORTER
          cat > "$proof/capture.sh" <<'CAPTURE'
          #!/usr/bin/env bash
          set -uo pipefail
          label=$1
          shift
          printf '%q ' "$@" > "$PROOF/$label.command"
          printf '\n' >> "$PROOF/$label.command"
          "$@" 2>&1 | tee "$PROOF/$label.log"
          statuses=("${PIPESTATUS[@]}")
          printf '%s\n' "${statuses[0]}" > "$PROOF/$label.exit"
          if [[ "${statuses[1]}" != 0 ]]; then exit "${statuses[1]}"; fi
          exit "${statuses[0]}"
          CAPTURE

      - name: Run native installer tests
        run: bash "$PROOF/capture.sh" installer node --test scripts/installer/release.test.mjs

      - name: Install the tested project's dependency lock
        run: npm ci --legacy-peer-deps

      - name: Check out the manifest's Agent with full history
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-agent
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Agent identity and install native Chromium
        id: setup
        env:
          AGENT_SHA: ${{ steps.pins.outputs.agent_sha }}
        run: |
          set -euo pipefail
          test "$(git -C astrid-agent rev-parse HEAD)" = "$AGENT_SHA"
          git -C astrid-agent rev-parse HEAD HEAD^{tree} > "$PROOF/agent-identity.txt"
          npx playwright install chromium
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run full App suite with its original guard plus passive receipts
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
        run: |
          export VITEST_PROOF_STREAM="$PROOF/vitest-app.xml.jsonl"
          bash "$PROOF/capture.sh" vitest-app npm run test:app -- \
            --reporter=default --reporter=./config/testing/skipGuardReporter.ts \
            --reporter="$PROOF/native-receipt.mjs" --reporter=junit \
            --outputFile.junit="$PROOF/vitest-app.xml"

      - name: Run original Node suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
        run: bash "$PROOF/capture.sh" node-suite npm run test:node

      - name: Run SDK boundary suite with its original guard plus passive receipts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          export VITEST_PROOF_STREAM="$PROOF/vitest-sdk-boundary.xml.jsonl"
          bash "$PROOF/capture.sh" vitest-sdk-boundary npm run test:sdk-boundary -- \
            --reporter=default --reporter=./config/testing/skipGuardReporter.ts \
            --reporter="$PROOF/native-receipt.mjs" --reporter=junit \
            --outputFile.junit="$PROOF/vitest-sdk-boundary.xml"

      - name: Reconcile raw IDs, JUnit cases and actual runner totals
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git diff --name-status HEAD > "$PROOF/final-tracked-changes.txt"
          bash "$PROOF/capture.sh" integrity python3 "$PROOF/check-vitest-results.py" "$PROOF"
          test ! -s "$PROOF/final-tracked-changes.txt"

      - name: Record evidence checksums
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP/app-proof"
          find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 -r sha256sum > evidence.sha256

      - name: Retain raw receipts on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-evidence-${{ matrix.case_name }}-${{ matrix.app_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-proof/
          if-no-files-found: error
          retention-days: 30
