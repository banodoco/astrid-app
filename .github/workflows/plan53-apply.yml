name: Plan 53 apply review fixes

on:
  push:
    branches: [chatgpt/53-vision-aspirations]
    paths: [.github/workflows/plan53-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/53-vision-aspirations'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed source delta with exact before and after hashes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          encoded = ''
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '113f2c211264f2a66dd70e2216d11530d1ed8a5067cd542b9f82a5c856209227'
          changes = json.loads(raw)
          assert len(changes) == 6
          prepared = {}
          for name, change in changes.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              before = path.read_bytes()
              assert hashlib.sha256(before).hexdigest() == change['before'], name
              lines = before.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']): lines[start:end] = [replacement]
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == change['after'], name
              prepared[path] = after
          for path, data in prepared.items(): path.write_bytes(data)
          subprocess.run(['git', 'add', '--', *map(str, prepared)], check=True)
          PY
      - name: Commit only to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(vision): include completed project history, reject null refs and focus browser assertions'
          git push origin HEAD:refs/heads/chatgpt/53-vision-aspirations
