name: Windows installer

on:
  push:
    branches: [feat/pinokio, main]
    paths:
      - .github/workflows/installer-windows.yml
      - public/install.ps1
      - public/install
      - public/install/**
      - scripts/installer/**
  pull_request:
    paths:
      - .github/workflows/installer-windows.yml
      - public/install.ps1
      - public/install
      - public/install/**
      - scripts/installer/**

permissions:
  contents: read

concurrency:
  group: installer-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: Windows PowerShell 5.1
            executable: powershell.exe
          - shell: PowerShell 7
            executable: pwsh
    name: PowerShell (${{ matrix.shell }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify selected PowerShell
        env:
          ASTRID_TEST_PWSH: ${{ matrix.executable }}
        run: "$env:ASTRID_TEST_PWSH; & $env:ASTRID_TEST_PWSH -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'"
      - name: Run PowerShell bootstrap tests
        shell: cmd
        env:
          ASTRID_TEST_PWSH: ${{ matrix.executable }}
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/installer/bootstrap-powershell.test.mjs
