name: R93 H1a guarded materializer
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: proof-r93-h1a-1c15a85a
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'banodoco/astrid-app' && github.ref == 'refs/heads/proof/93-h1a-1c15a85a'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: cc1d48f016fde55ad6b0609c619d8a4bcec56823
          path: app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: 1c15a85a928ae77cd16ea1a2ed029697e3af4f3c
          path: agent
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: 686ca695469bda48cd40a70824c4ccef2a137284
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/VibeComfy
          ref: 55c3948212d23cf037fae8a4c6faad77d33e7279
          path: vibe
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/runpod-lifecycle
          ref: 9f88ef7640bc664f697112d966ecefa123d44340
          path: life
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/poms_packs
          ref: 2379ab54aca522019ff4f869cfdf9375bdb56dfc
          path: pack
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/oh-my-pi
          ref: 78f0e0960f471c2c62b943272a48c33366f239fe
          path: omp
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-dev
          ref: 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
          path: dev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: dc45d97c6bc2734cbfb9b2a25b43cb40ed5757e5
          path: r15agent
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - name: Guard source and served predecessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h1a/served"
          S="$RUNNER_TEMP/h1a"
          exec > >(tee "$S/precheck.log") 2>&1
          date -u +%FT%TZ
          uname -a
          df -Pk "$RUNNER_TEMP"
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {printf "%.0f",$4*1024}')" -gt 10737418240
          test "$(git -C "$GITHUB_WORKSPACE/app" rev-parse HEAD)" = cc1d48f016fde55ad6b0609c619d8a4bcec56823
          test -z "$(git -C "$GITHUB_WORKSPACE/app" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/app" show -s --format='app %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/agent" rev-parse HEAD)" = 1c15a85a928ae77cd16ea1a2ed029697e3af4f3c
          test -z "$(git -C "$GITHUB_WORKSPACE/agent" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/agent" show -s --format='agent %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/runtime" rev-parse HEAD)" = 686ca695469bda48cd40a70824c4ccef2a137284
          test -z "$(git -C "$GITHUB_WORKSPACE/runtime" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/runtime" show -s --format='runtime %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/vibe" rev-parse HEAD)" = 55c3948212d23cf037fae8a4c6faad77d33e7279
          test -z "$(git -C "$GITHUB_WORKSPACE/vibe" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/vibe" show -s --format='vibe %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/life" rev-parse HEAD)" = 9f88ef7640bc664f697112d966ecefa123d44340
          test -z "$(git -C "$GITHUB_WORKSPACE/life" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/life" show -s --format='life %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/pack" rev-parse HEAD)" = 2379ab54aca522019ff4f869cfdf9375bdb56dfc
          test -z "$(git -C "$GITHUB_WORKSPACE/pack" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/pack" show -s --format='pack %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/omp" rev-parse HEAD)" = 78f0e0960f471c2c62b943272a48c33366f239fe
          test -z "$(git -C "$GITHUB_WORKSPACE/omp" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/omp" show -s --format='omp %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/dev" rev-parse HEAD)" = 394cd8c7051d82c36fac8ea9ede9c6d4e14d5c0c
          test -z "$(git -C "$GITHUB_WORKSPACE/dev" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/dev" show -s --format='dev %H %T %cI' HEAD
          test "$(git -C "$GITHUB_WORKSPACE/r15agent" rev-parse HEAD)" = dc45d97c6bc2734cbfb9b2a25b43cb40ed5757e5
          test -z "$(git -C "$GITHUB_WORKSPACE/r15agent" status --porcelain --untracked-files=all)"
          git -C "$GITHUB_WORKSPACE/r15agent" show -s --format='r15agent %H %T %cI' HEAD
          git -C "$GITHUB_WORKSPACE/agent" merge-base --is-ancestor dc45d97c6bc2734cbfb9b2a25b43cb40ed5757e5 1c15a85a928ae77cd16ea1a2ed029697e3af4f3c
          git -C "$GITHUB_WORKSPACE/agent" merge-base --is-ancestor eb4427df2d505cdd3a00d067713e8cf289f2ad99 1c15a85a928ae77cd16ea1a2ed029697e3af4f3c
          for f in install-manifest.json install install.ps1 install.sh; do
            curl -fLsS --max-time 30 -H 'Cache-Control: no-cache' -D "$S/served/$f.headers" -o "$S/served/$f" -w '%{http_code} %{url_effective}\n' "https://astrid.haus/$f"
            git -C "$GITHUB_WORKSPACE/app" show "cc1d48f016fde55ad6b0609c619d8a4bcec56823:public/$f" > "$S/source-$f"
            cmp "$S/source-$f" "$S/served/$f"
            sha256sum "$S/served/$f"
          done
          python -c 'import json,os; m=json.load(open(os.environ["RUNNER_TEMP"]+"/h1a/served/install-manifest.json")); assert type(m["release"]) is int and m["release"]==15; assert m["required"]["release"]==15 and m["required"]["reason"].strip(); print("LIVE_REQUIRED",m["required"])'
          curl -fLsS --max-time 30 -o "$S/node-SHASUMS256.txt" https://nodejs.org/dist/v20.19.4/SHASUMS256.txt
          grep -Fx 'd80a33707605ced9a31b8f543cea9ab512bc3d2fef2c148f31a50e939ff07560  node-v20.19.4-linux-x64.tar.gz' "$S/node-SHASUMS256.txt"
          curl -fLsS --max-time 180 -o "$S/node.tar.gz" https://nodejs.org/dist/v20.19.4/node-v20.19.4-linux-x64.tar.gz
          echo 'd80a33707605ced9a31b8f543cea9ab512bc3d2fef2c148f31a50e939ff07560  ' "$S/node.tar.gz" | sha256sum -c -
          mkdir "$S/node"
          tar -xzf "$S/node.tar.gz" -C "$S/node" --strip-components=1
          test "$("$S/node/bin/node" --version)" = v20.19.4
          sha256sum "$S/node/bin/node"
          # Verify every manifest-declared Node/Bun/FFmpeg asset by bytes; retain
          # only its digest record. Each scratch archive is deleted only after hashing.
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"h1a"
          manifest=json.loads((root/"source-install-manifest.json").read_bytes())
          records=[]
          for tool in ("node","bun","ffmpeg"):
              for platform,spec in manifest["tools"][tool]["assets"].items():
                  urls=spec.get("urls",[spec.get("url")])
                  digests=spec["sha256"] if isinstance(spec["sha256"],list) else [spec["sha256"]]
                  if len(urls)!=len(digests) or not all(urls): raise SystemExit("asset shape mismatch")
                  for index,(url,expected) in enumerate(zip(urls,digests)):
                      path=root/"asset-download"
                      h=hashlib.sha256()
                      with urllib.request.urlopen(url,timeout=180) as src, path.open("wb") as dst:
                          while chunk:=src.read(1024*1024):
                              h.update(chunk); dst.write(chunk)
                      actual=h.hexdigest()
                      records.append({"tool":tool,"platform":platform,"index":index,"url":url,"expected":expected,"actual":actual})
                      path.unlink()
                      if actual!=expected: raise SystemExit("asset digest mismatch: "+url)
          (root/"asset-verification.json").write_text(json.dumps(records,indent=2)+"\n")
          print("Verified asset byte hashes",len(records))
          PY
          cd "$GITHUB_WORKSPACE/agent"
          bash "$GITHUB_WORKSPACE/dev/env/agent-setup.sh"
          "$GITHUB_WORKSPACE/agent.env/venv/bin/python" -c 'from astrid.core.pack.identity import pack_digest; import os; p=os.environ["GITHUB_WORKSPACE"]+"/pack/astrid_motion"; d=pack_digest(p); print("PACK_TREE_SHA256",d); assert d=="75234c10217e67ec0f111a4cb6be4a6252e172a9cd382506498d07ce1d241029"'
          cd "$GITHUB_WORKSPACE"
      - name: Prepare exact prior Agent environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/r15agent"
          bash "$GITHUB_WORKSPACE/dev/env/agent-setup.sh"
      - name: Authored pack compiler and App boundary
        shell: bash
        env:
          S: ${{ runner.temp }}/h1a
          APP: ${{ github.workspace }}/app
          AGENT: ${{ github.workspace }}/agent
          RUNTIME: ${{ github.workspace }}/runtime
          VIBE: ${{ github.workspace }}/vibe
          LIFE: ${{ github.workspace }}/life
          PACK: ${{ github.workspace }}/pack
          OMP: ${{ github.workspace }}/omp
          NODE: ${{ runner.temp }}/h1a/node/bin/node
          AGENT_PY: ${{ github.workspace }}/agent.env/venv/bin/python
          R15_AGENT_PY: ${{ github.workspace }}/r15agent.env/venv/bin/python
        run: |
          set -euo pipefail
          export A=1c15a85a928ae77cd16ea1a2ed029697e3af4f3c
          export P=cc1d48f016fde55ad6b0609c619d8a4bcec56823
          export PACK_COMMIT=2379ab54aca522019ff4f869cfdf9375bdb56dfc
          export PACK_DIGEST=75234c10217e67ec0f111a4cb6be4a6252e172a9cd382506498d07ce1d241029
          export ASTRID_NODE_EXECUTABLE="$NODE"
          export ASTRID_REMOTION_PROJECT_DIR="$AGENT/remotion"
          export PYTHONDONTWRITEBYTECODE=1
          unset NODE_OPTIONS NODE_PATH ESBUILD_BINARY_PATH
          export PATH="$(dirname "$NODE"):$PATH"
          NPM_CLI="$(dirname "$NODE")/../lib/node_modules/npm/bin/npm-cli.js"
          export NPM_CLI="$(realpath "$NPM_CLI")"
          export npm_config_cache="$S/npm-cache"
          test "$("$NODE" --version)" = v20.19.4
          test "$("$NODE" "$NPM_CLI" --version)" = 10.8.2
          test "$("$NODE" -p 'process.platform+":"+process.arch')" = linux:x64
          test "$(git -C "$AGENT" rev-parse HEAD)" = "$A"
          test "$(git -C "$APP" rev-parse HEAD)" = "$P"
          test "$(git -C "$PACK" rev-parse HEAD)" = "$PACK_COMMIT"
          test -z "$(git -C "$PACK" status --porcelain --untracked-files=all)"
          mkdir "$S/pack-proof" "$S/pack-proof/source" "$S/pack-proof/modules"
          export PACK_PROOF="$S/pack-proof"
          git -C "$PACK" archive --format=tar "$PACK_COMMIT" astrid_motion > "$PACK_PROOF/source.tar"
          tar -xf "$PACK_PROOF/source.tar" -C "$PACK_PROOF/source"
          sha256sum "$PACK_PROOF/source.tar" "$NODE" "$NPM_CLI" > "$PACK_PROOF/tool-and-export.sha256"
          git -C "$AGENT" show "$A:remotion/package.json" > "$PACK_PROOF/remotion-package.json"
          git -C "$AGENT" show "$A:remotion/package-lock.json" > "$PACK_PROOF/remotion-package-lock.json"
          cmp "$PACK_PROOF/remotion-package.json" "$AGENT/remotion/package.json"
          cmp "$PACK_PROOF/remotion-package-lock.json" "$AGENT/remotion/package-lock.json"
          # Preserve the real lock and its install scripts; cache only inside task scratch.
          (cd "$AGENT/remotion" && "$NODE" "$NPM_CLI" ci --no-audit --no-fund) 2>&1 | tee "$PACK_PROOF/npm-ci.log"
          cmp "$PACK_PROOF/remotion-package.json" "$AGENT/remotion/package.json"
          cmp "$PACK_PROOF/remotion-package-lock.json" "$AGENT/remotion/package-lock.json"
          # npm ci uses the frozen platform package. Record actual native binary and shim/copy.
          "$AGENT/remotion/node_modules/@esbuild/linux-x64/bin/esbuild" --version | tee "$PACK_PROOF/esbuild-native-version.log"
          test "$(cat "$PACK_PROOF/esbuild-native-version.log")" = 0.27.7
          cat > "$PACK_PROOF/prove_pack.py" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, traceback
          from collections.abc import Mapping
          import yaml
          
          P = pathlib.Path(os.environ["PACK_PROOF"]).resolve(strict=True)
          root = (P / "source/astrid_motion").resolve(strict=True)
          agent = pathlib.Path(os.environ["AGENT"]).resolve(strict=True)
          pack = pathlib.Path(os.environ["PACK"]).resolve(strict=True)
          rev = os.environ["PACK_COMMIT"]
          expected = os.environ["PACK_DIGEST"]
          sys.path.insert(0, str(agent))
          from astrid.core.pack import cli_manage
          from astrid.core.pack.identity import pack_digest
          from astrid.core.element import project_packs as pp
          from astrid.core.element.schema import load_element_definition
          from astrid.pack_build import compile_element_module
          import astrid.pack_build as builder
          import astrid.pack_builder as builder_source
          
          def need(ok, message):
              if not ok:
                  raise ValueError(message)
          def sha_bytes(b):
              return hashlib.sha256(b).hexdigest()
          def file_record(p):
              p = pathlib.Path(p)
              need(p.is_file() and not p.is_symlink(), "not a regular source: "+str(p))
              b=p.read_bytes()
              return {"bytes":len(b),"sha256":sha_bytes(b)}
          def raw(repo, ref, path):
              return subprocess.check_output(["git","-C",str(repo),"show",ref+":"+path])
          def file_map():
              return {p.relative_to(root).as_posix():file_record(p)
                      for p in sorted(root.rglob("*")) if p.is_file()}
          def run(args):
              return subprocess.check_output([str(x) for x in args], text=True).strip()
          def write():
              (P/"pack-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          def capture(label, fn):
              try: return fn()
              except Exception as exc:
                  evidence["errors"].append({"stage":label,"type":type(exc).__name__,"detail":str(exc),"traceback":traceback.format_exc()})
                  write()
                  return None
          
          evidence={"pack_commit":rev,"expected_digest":expected,"agent_commit":os.environ["A"],"errors":[],"elements":[],"scope":"source/renderer compile only; no installed or App delivery claim"}
          before=None
          contract=None
          contract_before=None
          try:
              # Verify imports are from actual candidate, not an installed stale module.
              for module in (cli_manage,pp,builder,builder_source):
                  f=pathlib.Path(module.__file__).resolve(strict=True)
                  need(f.is_relative_to(agent),"wrong Agent import "+str(f))
                  need(f.read_bytes()==raw(agent,os.environ["A"],f.relative_to(agent).as_posix()),"Agent module bytes mismatch "+str(f))
              before=file_map()
              tree=subprocess.check_output(["git","-C",str(pack),"ls-tree","-r","-z",rev,"astrid_motion"])
              expected_names=set()
              for row in tree.split(b"\0"):
                  if not row: continue
                  meta, name=row.split(b"\t",1)
                  mode, typ, oid=meta.decode().split()
                  name=name.decode("utf-8")
                  rel=name.removeprefix("astrid_motion/")
                  need(typ=="blob" and mode in ("100644","100755"),"unsupported pack tree entry "+name)
                  expected_names.add(rel)
                  need(rel in before and before[rel]["sha256"]==sha_bytes(raw(pack,rev,name)),"export differs from Git bytes "+name)
              need(set(before)==expected_names,"export file set differs from Git tree")
              evidence["source_files"]=before
              evidence["digest_before"]=pack_digest(root)
              need(evidence["digest_before"]==expected,"pack-tree-v1 differs from manifest pin")
              # Resolve actual selected canonical data; do not treat _editor_build's
              # None on malformed YAML as success.
              entry,resources=pp._resources(root,expected_pack_id="astrid_motion")
              decl=entry.definition.rendering
              need(len(decl)==20 and all(v["type"]=="element" for v in decl.values()),"expected 20 rendering elements")
              editors=[k for k,v in entry.definition.ui.items() if v["type"]=="editor"]
              need(not editors,"browser editor unexpectedly present")
              need(cli_manage._editor_build(root) is None,"unexpected browser build input")
              # Run _build_inputs on the exact scratch-export local source, no fetching or state writes.
              builds,toolchain=cli_manage._build_inputs(str(root.parent),None,{"astrid_motion":"astrid_motion"},None)
              need(builds=={} and toolchain is None,"browser compiler selected unexpectedly")
              evidence["browser_editor_build"]={"editor_count":len(editors),"builds":builds,"toolchain":toolchain,"pack_build_needed":False}
              evidence["canonical_resources"]={}
              for name,h in sorted(resources.items()):
                  r=file_record(root/name)
                  need(r["sha256"]==h.sha256 and r["bytes"]==h.size,"resource bytes mismatch "+name)
                  evidence["canonical_resources"][name]=r
              # Keep authoring preview fixtures out of the renderer import precheck.
              # Hash them above anyway. The renderer admission set is the union of
              # actual rendering declarations; do not allow an undeclared helper just
              # because it happens to exist in the exported tree.
              render_names={d["path"] for d in decl.values()}
              for d in decl.values():
                  render_names.update(r["path"] for r in d.get("resources",()))
              render_resources={n:resources[n] for n in sorted(render_names)}
              for name in ("rendering/elements/_shared/am.tsx","rendering/elements/_shared/mosaic.tsx"):
                  need(name in render_resources,"missing declared shared source "+name)
              evidence["rendering_resources"]={n:evidence["canonical_resources"][n] for n in sorted(render_names)}
              def imports():
                  pp._check_imports(root,render_resources)
                  return True
              evidence["canonical_import_check"]=capture("canonical rendering import closure",imports) is True
              # Direct compiler calls are independent diagnostics on the original
              # bytes, not admission. A failed import gate remains fatal even if
              # esbuild strips a type-only import or emits a module.
              node,api=pp._renderer_compiler()
              need(node.resolve()==pathlib.Path(os.environ["NODE"]).resolve(),"renderer resolved different Node")
              project=agent/"remotion"
              need(api.resolve()==(project/"node_modules/esbuild/lib/main.js").resolve(),"renderer resolved different esbuild")
              need(pp._esbuild_pin(project)=="0.27.7","esbuild pin differs")
              need(run([node,"--version"])=="v20.19.4","Node version differs")
              npm=pathlib.Path(os.environ["NPM_CLI"]).resolve(strict=True)
              need(run([node,npm,"--version"])=="10.8.2","npm version differs")
              native=project/"node_modules/@esbuild/linux-x64/bin/esbuild"
              shim=project/"node_modules/esbuild/bin/esbuild"
              need(run([native,"--version"])=="0.27.7" and run([node,"-e","process.stdout.write(require(process.argv[1]).version)",api])=="0.27.7","esbuild version mismatch")
              lock=json.loads((project/"package-lock.json").read_bytes())
              locked={n:lock["packages"][n] for n in ("node_modules/esbuild","node_modules/@esbuild/linux-x64")}
              need(all(v["version"]=="0.27.7" and v.get("integrity") for v in locked.values()),"esbuild lock provenance missing")
              evidence["tools"]={"versions":{"node":"20.19.4","npm":"10.8.2","esbuild":"0.27.7"},"locked_packages":locked}
              for name,path in (("node",node),("npm_cli",npm),("npm_package",npm.parent.parent/"package.json"),("esbuild_api",api),("esbuild_native",native),("esbuild_shim",shim),("esbuild_package",project/"node_modules/esbuild/package.json"),("esbuild_native_package",project/"node_modules/@esbuild/linux-x64/package.json"),("remotion_package",project/"package.json"),("remotion_lock",project/"package-lock.json")):
                  evidence["tools"][name]={"path":str(path),"realpath":str(path.resolve(strict=True)),**file_record(path.resolve(strict=True))}
              contract=(agent/"astrid/packs/rendering/shared/element_contracts.ts").resolve(strict=True)
              need(contract.is_relative_to(agent/"astrid/packs/rendering"),"rendering contract escapes candidate")
              need(contract.read_bytes()==raw(agent,os.environ["A"],contract.relative_to(agent).as_posix()),"rendering contract differs from Git")
              contract_before=file_record(contract)
              evidence["rendering_contract"]={"path":str(contract),**contract_before}
              evidence["compiler_sources"]={str(pathlib.Path(m.__file__).relative_to(agent)):file_record(m.__file__) for m in (pp,builder,builder_source,cli_manage)}
              seen=set()
              for key,d in sorted(decl.items()):
                  row={"key":key,"descriptor":d["path"],"declared_resources":{r["path"]:evidence["canonical_resources"][r["path"]] for r in d.get("resources",())},"descriptor_bytes":file_record(root/d["path"])}
                  evidence["elements"].append(row)
                  def compile_one():
                      descriptor=root/d["path"]
                      parsed=yaml.safe_load(descriptor.read_text(encoding="utf-8"))
                      definition=load_element_definition(descriptor.parent,kind=parsed["kind"],source="pack:astrid_motion",editable=True,priority=100)
                      component=definition.component.resolve(strict=True).relative_to(root).as_posix()
                      need(component in render_resources,"component not declared "+component)
                      need(component not in seen,"duplicate component "+component)
                      seen.add(component)
                      row.update({"id":definition.id,"kind":str(definition.kind),"component":component,"component_bytes":file_record(root/component)})
                      # All actual descriptor-declared assets/support files are resolved and hashed;
                      # declaration resources above also capture the shared/helper source.
                      for name in ("assets","support_files"):
                          refs=[(x.name,x.path) for x in definition.assets] if name=="assets" else [(str(x),x) for x in definition.support_files]
                          result={}
                          for k,p in refs:
                              p=pathlib.Path(p)
                              p=(p if p.is_absolute() else descriptor.parent/p).resolve(strict=True)
                              rel=p.relative_to(root).as_posix()
                              result[str(k)]={"path":rel,**file_record(p)}
                          row[name]=result
                      target=P/"modules"/(component+".mjs")
                      target.parent.mkdir(parents=True,exist_ok=True)
                      output=compile_element_module(node,api,root,component,pp._node_env(),rendering_contract=contract)
