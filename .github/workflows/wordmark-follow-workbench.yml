name: Wordmark follow workbench
on:
  push:
    branches: [fix/scrolled-brand-wordmark-20261116]
    paths: [.github/workflows/wordmark-follow-workbench.yml]
permissions:
  contents: write
jobs:
  wordmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Add exact scrolled-wordmark regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD:src/pages/Home/PublicAstridSite.css'],text=True).strip() == '3568ed47ab08e43536ebfe40555e4b9916856aa6'
          p=Path('tests/e2e/public-astrid-vision-entry.spec.ts')
          assert 'wordmark accompanies' not in p.read_text()
          p.write_text(p.read_text()+r'''

          type BrandFollowFrame = { minkY: number; wordY: number; minkTransform: string; wordTransform: string;
            minkDuration: string; wordDuration: string; minkCurve: string; wordCurve: string; wordOpacity: number; scroll: number };
          type BrandFollowBox = { x: number; y: number; width: number; height: number; right: number };
          type BrandFollowTrace = { ready: boolean; done: boolean; error?: string; frames: BrandFollowFrame[];
            old?: { name: string; opacity: string; box: BrandFollowBox; mink: BrandFollowBox; headerWidth: number };
            incoming?: { names: string[]; word: BrandFollowBox; mink: BrandFollowBox } };
          test.describe('paired scrolled desktop brand', () => {
            test.use({ isMobile: false, hasTouch: false, deviceScaleFactor: 1 });
            test('wordmark accompanies the mink from the condensed Vision header', async ({ page, request }, info) => {
              test.setTimeout(120000);
              const response = await request.get(FEED); expect(response.ok()).toBe(true);
              await page.route(FEED, route => route.fulfill({ json: response.json() }));
              // Resolve the feed before the route handler serializes it.
              await page.unroute(FEED);
              const feed = await response.json();
              await page.route(FEED, route => route.fulfill({ json: feed }));
              await page.setViewportSize({ width: 1440, height: 900 });
              await page.emulateMedia({ reducedMotion: 'no-preference' });
              await page.goto('/home', { waitUntil: 'domcontentloaded' });
              await expect(page.getByRole('link', { name: 'Vision', exact: true })).toBeVisible({ timeout: 30000 });
              const records = [];
              for (const fraction of [1, .5]) {
                await page.getByRole('link', { name: 'Vision', exact: true }).click();
                await expect(page.locator('.astrid-vision-principles > li')).toHaveCount(4);
                await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
                await page.evaluate(fraction => window.scrollTo({ top: (document.documentElement.scrollHeight - innerHeight) * fraction,
                  behavior: 'instant' }), fraction);
                const header = page.locator('.astrid-vision-bar');
                await expect(header).toHaveAttribute('data-condensed');
                await expect(header.locator('.astrid-vision-brand-name')).toHaveCSS('opacity', '0');
                await expect(header.locator('.astrid-vision-brand-name')).toHaveCSS('max-width', '0px');
                const before = await header.locator('.astrid-vision-brand').evaluate(node => ({
                  width: node.getBoundingClientRect().width,
                  mink: node.querySelector('img')!.getBoundingClientRect().toJSON(),
                }));
                await page.evaluate(() => {
                  const state = window as unknown as { brandFollow: BrandFollowTrace };
                  const trace: BrandFollowTrace = { ready: false, done: false, frames: [] };
                  state.brandFollow = trace;
                  type Native = { ready: Promise<void>; finished: Promise<void> };
                  const doc = document as unknown as { startViewTransition: (update: () => void | Promise<void>) => Native };
                  const original = doc.startViewTransition.bind(doc);
                  doc.startViewTransition = update => {
                    doc.startViewTransition = original;
                    const name = document.querySelector<HTMLElement>('.astrid-vision-brand-name')!;
                    const mink = document.querySelector<HTMLElement>('.astrid-vision-brand img')!;
                    trace.old = { name: getComputedStyle(name).viewTransitionName, opacity: getComputedStyle(name).opacity,
                      box: name.getBoundingClientRect().toJSON(), mink: mink.getBoundingClientRect().toJSON(),
                      headerWidth: name.parentElement!.getBoundingClientRect().width };
                    const transition = original(async () => {
                      await update();
                      const home = document.querySelector('.astrid-public-site[data-astrid-lifecycle="active"]')!;
                      trace.incoming = {
                        names: [home, ...home.querySelectorAll('*')].map(n => getComputedStyle(n).viewTransitionName)
                          .filter(n => n && n !== 'none'),
                        word: home.querySelector('.astrid-brand-name')!.getBoundingClientRect().toJSON(),
                        mink: home.querySelector('.astrid-brand-mink:not(.astrid-brand-mink-glint)')!.getBoundingClientRect().toJSON(),
                      };
                    });
                    void transition.ready.then(() => {
                      trace.ready = true;
                      const sample = () => {
                        if (trace.done) return;
                        const root = document.documentElement;
                        const mink = getComputedStyle(root, '::view-transition-group(astrid-brand-mink)');
                        const word = getComputedStyle(root, '::view-transition-group(astrid-brand-name)');
                        const image = getComputedStyle(root, '::view-transition-new(astrid-brand-name)');
                        trace.frames.push({ minkY: new DOMMatrix(mink.transform).f, wordY: new DOMMatrix(word.transform).f,
                          minkTransform: mink.transform, wordTransform: word.transform,
                          minkDuration: mink.animationDuration, wordDuration: word.animationDuration,
                          minkCurve: mink.animationTimingFunction, wordCurve: word.animationTimingFunction,
                          wordOpacity: Number(image.opacity), scroll: scrollY });
                        requestAnimationFrame(sample);
                      };
                      sample();
                    }, error => { trace.error = String(error); });
                    void transition.finished.then(() => { trace.done = true; }, error => {
                      trace.error = String(error); trace.done = true;
                    });
                    return transition;
                  };
                });
                await page.getByRole('link', { name: 'Astrid home', exact: true }).click();
                await expect.poll(() => page.evaluate(() => (window as unknown as { brandFollow: BrandFollowTrace }).brandFollow.ready)).toBe(true);
                await page.waitForTimeout(350);
                await page.screenshot({ path: `${folder}/wordmark-moving-${info.project.name}-${fraction}.png` });
                await expect.poll(() => page.evaluate(() => (window as unknown as { brandFollow: BrandFollowTrace }).brandFollow.done), { timeout: 15000 }).toBe(true);
                const trace = await page.evaluate(() => (window as unknown as { brandFollow: BrandFollowTrace }).brandFollow);
                records.push({ fraction, before, trace });
                record(`wordmark-follow-${info.project.name}`, records);
                expect(trace.error).toBeUndefined();
                expect(trace.old!.name, 'the hidden wordmark needs an outgoing capture origin').toBe('astrid-brand-name');
                expect(trace.incoming!.names).toEqual(['astrid-brand-mink', 'astrid-brand-name']);
                expect(trace.old!.opacity, 'do not flash the collapsed header text before the transition').toBe('0');
                expect(trace.old!.box.width, 'avoid a zero-width wordmark morph').toBeGreaterThan(30);
                expect(Math.abs(trace.old!.headerWidth - before.width), 'no header expansion at capture').toBeLessThan(.5);
                for (const axis of ['x', 'y', 'width', 'height'] as const) expect(Math.abs(trace.old!.mink[axis] - before.mink[axis])).toBeLessThan(.5);
                expect(Math.abs(trace.old!.box.x - trace.old!.mink.right), 'wordmark starts beside the current mink').toBeLessThan(24);
                const frames = trace.frames.filter(f => f.minkTransform !== 'none' && f.wordTransform !== 'none'
                  && f.minkDuration === '0.9s' && f.wordDuration === '0.9s');
                expect(frames.length).toBeGreaterThan(5);
                expect(new Set(frames.map(f => f.wordTransform)).size).toBeGreaterThan(4);
                const first = frames[0], last = frames.at(-1)!;
                expect(Math.abs(last.wordY - first.wordY)).toBeGreaterThan(30);
                expect(Math.abs(first.wordY - trace.old!.box.y)).toBeLessThan(5);
                expect(Math.abs(last.wordY - trace.incoming!.word.y)).toBeLessThan(2);
                for (const frame of frames) {
                  expect(frame.scroll).toBe(0);
                  expect(frame.wordCurve).toBe(frame.minkCurve);
                  const minkProgress = (frame.minkY - first.minkY) / (last.minkY - first.minkY);
                  const wordProgress = (frame.wordY - first.wordY) / (last.wordY - first.wordY);
                  expect(Math.abs(wordProgress - minkProgress), 'wordmark and mink travel together').toBeLessThan(.04);
                }
                expect(frames.some(f => f.wordOpacity > .99)).toBe(true);
                await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
                await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition-style');
              }
            });
          });
          ''')
          PY
      - name: Reproduce old wordmark capture failure
        run: |
          mkdir -p wordmark-evidence
          git rev-parse HEAD > wordmark-evidence/baseline-source.txt
          set +e
          npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --project=chromium-desktop --grep 'wordmark accompanies' --reporter=json > wordmark-evidence/baseline-results.json 2> wordmark-evidence/baseline-stderr.log
          result=$?
          set -e
          cp -R test-results/vision-captures wordmark-evidence/baseline-captures
          python3 - "$result" <<'PY'
          import json,sys
          d=json.load(open('wordmark-evidence/baseline-results.json'))
          def specs(s):
            for item in s:
              yield from item.get('specs',[])
              yield from specs(item.get('suites',[]))
          rows=[s for s in specs(d['suites']) if 'wordmark accompanies' in s['title']]
          assert int(sys.argv[1]) != 0 and len(rows)==1
          errors=[e.get('message','') for t in rows[0]['tests'] for r in t['results'] for e in r.get('errors',[])]
          assert any('astrid-brand-name' in e and 'none' in e for e in errors),errors
          print('Baseline reproduces the missing wordmark capture; original product is unchanged.')
          PY
      - name: Apply paired capture without changing live header layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/PublicAstridSite.css')
          assert 'transform-style: flat;' in p.read_text()
          p.write_text(p.read_text()+r'''
          /* The wordmark travels with the mink on scrolled desktop returns too.
             Name only active Home, never the retained copy behind Vision. */
          :root[data-astrid-page-transition-style="brand"] .astrid-vision .astrid-vision-brand-name,
          :root[data-astrid-page-transition-style="brand"] .astrid-public-site[data-astrid-lifecycle="active"] .astrid-brand-name {
            view-transition-name: astrid-brand-name !important;
          }
          /* The condensed header has a zero-width, transparent name. Give its capture
             a natural-sized origin beside the mink without widening or revealing the
             live header. A zero-width origin would squash the arriving wordmark. */
          :root[data-astrid-page-transition-style="brand"] .astrid-vision-bar[data-condensed] .astrid-vision-brand {
            position: relative;
          }
          :root[data-astrid-page-transition-style="brand"] .astrid-vision-bar[data-condensed] .astrid-vision-brand-name {
            position: absolute;
            left: calc(100% + 12px);
            max-width: none;
            opacity: 0;
            transition: none;
          }
          /* Reveal beside the moving mink, not in Home's already-settled root snapshot.
             Position and size keep the same 900ms curve as the mink's shared group. */
          @keyframes astrid-brand-name-emerge { from { opacity: 0; } to { opacity: 1; } }
          :root[data-astrid-page-transition-style="brand"]::view-transition-new(astrid-brand-name) {
            animation: astrid-brand-name-emerge 160ms ease-out both;
          }
          ''')
          p=Path('tests/e2e/public-astrid-vision-polish.spec.ts')
          s=p.read_text(); old="expect(record.named).toEqual(sharedBrand ? ['astrid-brand-mink'] : []);"
          assert s.count(old)==1
          p.write_text(s.replace(old,"expect(record.named).toEqual(sharedBrand ? ['astrid-brand-mink', 'astrid-brand-name'] : []);"))
          p=Path('scripts/quality/check-public-vision-production.mjs')
          s=p.read_text(); left,body=s.split('async function checkPlayerReturn(browser) {',1)
          old="phase: document.documentElement.getAttribute('data-astrid-page-transition-style') });"
          new="phase: document.documentElement.getAttribute('data-astrid-page-transition-style'),\n          wordmark: getComputedStyle(home.querySelector('.astrid-brand-name')).viewTransitionName,\n          wordmarkTransform: getComputedStyle(document.documentElement, '::view-transition-group(astrid-brand-name)').transform });"
          assert body.count(old)==1
          body=body.replace(old,new)
          old="expect(frames.filter(frame => frame.phase === 'brand').length).toBeGreaterThan(5);"
          new="const movingBrand = frames.filter(frame => frame.phase === 'brand');\n    expect(movingBrand.length).toBeGreaterThan(5);\n    expect(movingBrand.every(frame => frame.wordmark === 'astrid-brand-name')).toBe(true);\n    expect(new Set(movingBrand.map(frame => frame.wordmarkTransform).filter(value => value !== 'none')).size).toBeGreaterThan(3);"
          assert body.count(old)==1
          body=body.replace(old,new)
          body=body.replace("console.log('Production desktop player keeps its bounds throughout bottom-of-Vision return and transition cleanup.');","console.log('Production desktop player keeps its bounds throughout bottom-of-Vision return and transition cleanup.');\n    console.log('Production Astrid wordmark travels with the mink instead of appearing in the root crossfade.');")
          p.write_text(left+'async function checkPlayerReturn(browser) {'+body)
          # Remove a redundant provisional route from the new test before committing.
          p=Path('tests/e2e/public-astrid-vision-entry.spec.ts');s=p.read_text()
          s=s.replace("    await page.route(FEED, route => route.fulfill({ json: response.json() }));\n    // Resolve the feed before the route handler serializes it.\n    await page.unroute(FEED);\n",'')
          p.write_text(s)
          PY
          git diff > wordmark-evidence/candidate.patch
          node --check scripts/quality/check-public-vision-production.mjs
      - name: Focused Chromium movement and scroll checks
        run: |
          npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts --project=chromium-desktop --grep 'wordmark accompanies|scrolled Vision return' --reporter=json > wordmark-evidence/chromium-results.json 2> wordmark-evidence/chromium-stderr.log
          cp -R test-results/vision-captures wordmark-evidence/chromium-captures
      - name: Focused WebKit movement and scroll checks
        run: |
          npx playwright test --config playwright.vision.config.ts tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts --grep 'wordmark accompanies|scrolled Vision return' --reporter=json > wordmark-evidence/webkit-results.json 2> wordmark-evidence/webkit-stderr.log
          cp -R test-results/vision-captures wordmark-evidence/webkit-captures
      - name: Commit only passing scoped repair
        run: |
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git add src/pages/Home/PublicAstridSite.css tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts scripts/quality/check-public-vision-production.mjs
          git diff --cached --check
          git commit -m 'fix(vision): carry the wordmark beside the mink on scrolled returns'
          git rev-parse HEAD > wordmark-evidence/candidate-source.txt
          git rev-parse HEAD^{tree} >> wordmark-evidence/candidate-source.txt
          git push origin HEAD:fix/scrolled-brand-wordmark-20261116
      - name: Preserve evidence on success or failure
        if: always()
        run: |
          mkdir -p wordmark-evidence
          git diff > wordmark-evidence/uncommitted.patch
          tar -cf wordmark-evidence/source.tar src/pages/Home/PublicAstridSite.css tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-polish.spec.ts scripts/quality/check-public-vision-production.mjs
          cp -R test-results/vision-captures wordmark-evidence/last-captures 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrid-wordmark-focused
          path: wordmark-evidence/
          if-no-files-found: error
