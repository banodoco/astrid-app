name: Dockerfile Check

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release-1
      - "int/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Dockerfile Check / Select affected paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      typescript: ${{ steps.paths.outputs.typescript }}
      appui: ${{ steps.paths.outputs.appui }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // An absent output means run everything. Never trust a partial file list.
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number});
            const count = pr.data.changed_files;
            if (!Number.isInteger(count) || count < 1 || count >= 3000) return;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number, per_page: 100});
            if (files.length !== count || files.some(f =>
              !['added', 'modified'].includes(f.status) || typeof f.filename !== 'string')) return;
            const paths = files.map(f => f.filename);
            core.setOutput('docs', String(paths.every(p =>
              p === 'README.md' || /^docs\/.*\.md$/i.test(p))));
            core.setOutput('typescript', String(paths.every(p => p.startsWith('packages/typescript/'))));
            core.setOutput('appui', String(paths.every(p =>
              p.startsWith('src/features/') || p.startsWith('src/pages/'))));
  dockerfile-check:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    name: Dockerfile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: make dockerfile-check

  pr-gate:
    name: Dockerfile Check / PR aggregate
    if: ${{ always() }}
    needs: [changes, dockerfile-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          is_pr = os.environ['EVENT'] == 'pull_request'
          classes = {'dockerfile-check': ''}
          for job, special in classes.items():
              skipped = is_pr and (outputs.get('docs') == 'true' or
                                    (special and outputs.get(special) == 'true'))
              expected = 'skipped' if skipped else 'success'
              result = needs[job]['result']
              if result != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {result}")
          PYCODE
