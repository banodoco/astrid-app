# The lanes the default vitest run leaves out because they need a sibling checkout, another OS or a tool the
# vitest job lacks. Each is declared in config/testing/skipRegistry.mjs (LANES) against the job id below.
name: Lanes

on:
  push:
    branches: [main, release-1, "int/**"]
  # Nightly, like direct-journey.yml: the siblings' main moves without an App push, and these lanes catch that drift.
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

concurrency:
  group: lanes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `npm run test:checkout` (portableVisualSeamIntent, astridSceneAuthoring, localExtensions.catalog) and
  # `npm run test:astrid-composition`: the Runtime's visual-seam admission and Astrid's own scene code, as siblings.
  # Siblings come from main, like the journeys: drift between the App and either one is exactly what these catch.
  checkout-lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-app
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: main
          path: astrid-runtime
          token: ${{ secrets.RUNTIME_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: main
          path: astrid-agent
          token: ${{ secrets.ASTRID_READ_TOKEN || github.token }}
      - name: Restore npm cache (C-08)
        id: c08-app-lanes-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: astrid-app/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install App dependencies
        working-directory: astrid-app
        run: npm ci --legacy-peer-deps
      - name: Checkout lane
        working-directory: astrid-app
        env:
          ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
        run: npm run test:checkout
      - name: Astrid composition lane
        working-directory: astrid-app
        env:
          ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
        run: npm run test:astrid-composition

  # scripts/installer/bootstrap.test.mjs: the POSIX installer against a fixture, on both OSes it supports
  # (macOS keeps its data under HOME, Linux honours XDG_*).
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-lanes-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('astrid-app/package-lock.json') }}

  installer-posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/installer/bootstrap.test.mjs

  # scripts/installer/bootstrap-powershell.test.mjs: the PowerShell installer under pwsh (preinstalled on ubuntu-latest).
  installer-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pwsh --version
      - run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/installer/bootstrap-powershell.test.mjs

  # The "quick: Astrid edit then App edit" case of three-products.spec.ts needs a Runtime realm that Astrid's own
  # journey adopts and describes (ASTRID_QUICK_DESCRIPTOR). `astrid.core.dev.journey --tier quick` builds a generated
  # reference realm, adopts it, starts the Runtime with its browser door, writes the descriptor and runs that one case
  # (playwright.three-products.config.ts greps it in when the variable is set), then renders the saved revision.
  quick-journey:
    runs-on: ubuntu-24.04
    # A hang guard only: the journey has no deadline of its own, and a stalled apt download once held a runner for 30 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-app
          fetch-depth: 0
          filter: blob:none
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: main
          path: astrid-runtime
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.RUNTIME_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: main
          path: astrid-agent
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.ASTRID_READ_TOKEN || github.token }}
      # The renderer's Node is pinned by astrid-agent/remotion (=20.19.4); the journey refuses any other.
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # A stalled apt download once held a runner for 30 minutes: retry and time out every apt call in this job,
      # including the one inside `playwright install --with-deps`.
      - name: Harden apt
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-lanes-retries
          sudo apt-get update
      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      # The App harness looks for the Runtime venv at <runtime>/.venv (it is only attached to here, never started by the case).
      - name: Build the Runtime venv
        working-directory: astrid-runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m runtime_protocol.cli --help > /dev/null
      - name: Build the Astrid venv (with the sibling Runtime)
        working-directory: astrid-agent
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip install --no-deps -e ../astrid-runtime -e ../astrid-runtime/packages/python
          npm ci --prefix remotion
          (cd remotion && npx remotion browser ensure)
      - name: Install App dependencies and Chrome
        working-directory: astrid-app
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chrome
      - name: Run the quick journey
        working-directory: astrid-agent
        env:
          ASTRID_RUNTIME_CHECKOUT: ${{ github.workspace }}/astrid-runtime
        run: .venv/bin/python -m astrid.core.dev.journey --tier quick --reference generated --app-checkout ../astrid-app --summary "$RUNNER_TEMP/quick-journey.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: quick-journey
          path: |
            ${{ runner.temp }}/quick-journey.json
            ${{ runner.temp }}/quick-journey.txt
          if-no-files-found: warn
