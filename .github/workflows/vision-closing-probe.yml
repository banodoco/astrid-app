name: Finalize colour and opening regression proof
on:
  push:
    branches: [fix/vision-polish-opening-20261114]
    paths: [.github/workflows/vision-closing-probe.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-polish-opening-20261114
      - name: Apply measured test setup corrections and touch-safe arrow emphasis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/public-astrid-vision-polish.spec.ts');s=p.read_text()
          old='    await expect.poll(() => page.evaluate(() => window.scrollY)).toBeCloseTo(before, 0);'
          assert s.count(old)==1
          new='''    // Playwright may scroll again while making the opener actionable. The
              // modal must restore the page position at the actual opening gesture,
              // not the earlier scrollIntoView helper's intermediate position.
              const openedAt = await page.evaluate(() => (window as typeof window & { __openerScroll?: number }).__openerScroll);
              expect(typeof openedAt).toBe('number');
              await expect.poll(() => page.evaluate(() => window.scrollY)).toBeCloseTo(openedAt!, 0);'''
          p.write_text(s.replace(old,new))
          p=Path('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts');s=p.read_text()
          old="    await page.getByRole('button', { name: 'See all gaps', exact: true }).tap();\n    const behind ="
          assert s.count(old)==1
          s=s.replace(old,"    await page.getByRole('button', { name: 'See all gaps', exact: true }).tap();\n    // Closing gestures target the visible modal after its one-frame preparation.\n    await expect(page.getByRole('dialog', { name: 'All gaps' })).toBeVisible();\n    const behind =")
          p.write_text(s)
          p=Path('tests/e2e/public-astrid-vision-sigils-nav.spec.ts');s=p.read_text()
          old="    expect(surfaces).toEqual(Array.from({ length: 4 }, () =>\n      ({ card: 'rgba(0, 0, 0, 0)', arrow: 'rgba(0, 0, 0, 0)' })));"
          assert s.count(old)==1
          new="    expect(surfaces).toHaveLength(4);\n    expect(new Set(surfaces.map(surface => surface.card)).size).toBe(4);\n    expect(surfaces.every(surface => surface.card !== 'rgba(0, 0, 0, 0)' && surface.arrow === 'rgba(0, 0, 0, 0)')).toBe(true);"
          p.write_text(s.replace(old,new).replace('const checkTransparent = async () => {','const checkTinted = async () => {').replace('await checkTransparent();','await checkTinted();'))
          p=Path('src/pages/Home/VisionMobileLayout.css');s=p.read_text()
          old='.astrid-vision-details-navigation:not(:disabled):is(:hover, :focus-visible) { opacity: .65; }\n.astrid-vision-details-navigation:not(:disabled):hover { color: var(--astrid-accent); border-color: var(--astrid-accent); }'
          assert s.count(old)==1
          new='''.astrid-vision-details-navigation:not(:disabled):focus-visible { opacity: .65; }
          @media (hover: hover) and (pointer: fine) {
            .astrid-vision-details-navigation:not(:disabled):hover { opacity: .65; color: var(--astrid-accent); border-color: var(--astrid-accent); }
          }'''
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git config user.name 'POM'
          git config user.email 'peter@omalley.io'
          git add tests/e2e/public-astrid-vision-polish.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts tests/e2e/public-astrid-vision-sigils-nav.spec.ts src/pages/Home/VisionMobileLayout.css
          git commit -m 'fix(vision): keep touch arrows quiet and bind restoration proof to the actual tap'
          git push origin HEAD:fix/vision-polish-opening-20261114
