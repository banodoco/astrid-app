name: Public vision content

on:
  pull_request:
    paths:
      - "src/pages/Home/PublicAstridVision.tsx"
      - "src/pages/Home/PublicAstridVision.css"
      - "src/pages/Home/VisionDetailDialog.tsx"
      - "src/pages/Home/VisionProjectDisclosure.css"
      - "src/pages/Home/VisionPrincipleSigil.tsx"
      - "src/pages/Home/VisionSectionNav.tsx"
      - "src/pages/Home/visionHierarchy.ts"
      - "src/pages/Home/visionHierarchy.test.ts"
      - "src/pages/Home/publicVisionContent.ts"
      - "src/pages/Home/publicVisionContent.test.ts"
      - "tests/fixtures/public-vision.ts"
      - "tests/e2e/public-astrid-vision-aspirations.spec.ts"
      - "playwright.vision.config.ts"
      - "src/pages/Home/publicAstridShare.ts"
      - "tests/e2e/public-astrid-vision-content.spec.ts"
      - "tests/e2e/public-astrid-vision-captures.spec.ts"
      - "tests/e2e/public-astrid-vision-mobile-feedback.spec.ts"
      - "tests/e2e/public-astrid-vision-layout-feedback.spec.ts"
      - "tests/e2e/public-astrid-vision-hierarchy.spec.ts"
      - "tests/e2e/public-astrid-vision-sigils-nav.spec.ts"
      - "tests/e2e/public-astrid-vision-characteristics.spec.ts"
      - "package.json"
      - ".github/workflows/public-vision.yml"
      - ".github/workflows/served-manifest-canary.yml"
      - "scripts/quality/check-public-vision-production.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-content:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Astrid App
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate live-feed parsing contract
        run: npm run vision:check && npx vitest run --config config/testing/vitest.config.ts src/pages/Home/visionHierarchy.test.ts
      - name: Check production vision canary syntax
        run: node --check scripts/quality/check-public-vision-production.mjs
      - name: Check changed vision code
        run: npx eslint src/pages/Home/PublicAstridVision.tsx src/pages/Home/VisionDetailDialog.tsx src/pages/Home/VisionPrincipleSigil.tsx src/pages/Home/VisionSectionNav.tsx src/pages/Home/visionHierarchy.ts src/pages/Home/publicVisionContent.ts src/pages/Home/publicAstridShare.ts --max-warnings 0
      - name: Preserve public page lifecycle and share metadata
        run: npx vitest run --config config/testing/vitest.config.ts src/pages/Home/PublicAstridSite.lifecycle.test.tsx src/test/viteShareMeta.test.ts
      - name: Build the hosted website
        run: npm run build:hosted
      - name: Install Chromium and WebKit for focused browser validation
        run: npx playwright install --with-deps chromium webkit
      - name: Verify vision content on desktop and phone
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/chromium-results.json
        run: npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-content.spec.ts tests/e2e/public-astrid-vision-captures.spec.ts tests/e2e/public-astrid-vision-mobile-feedback.spec.ts tests/e2e/public-astrid-vision-layout-feedback.spec.ts tests/e2e/public-astrid-vision-hierarchy.spec.ts tests/e2e/public-astrid-vision-sigils-nav.spec.ts tests/e2e/public-astrid-vision-characteristics.spec.ts tests/e2e/public-astrid-vision-aspirations.spec.ts --project=chromium-desktop --output=test-results/chromium --reporter=line,json
      - name: Verify native dialog touch behavior in WebKit
        if: success() || failure()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/vision-captures/webkit-results.json
        run: npx playwright test --config playwright.vision.config.ts --output=test-results/webkit --reporter=line,json
      - name: Upload Vision screenshots and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrid-vision-screenshots
          path: test-results/vision-captures/
          if-no-files-found: warn
