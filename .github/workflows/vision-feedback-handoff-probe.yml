name: Diagnose Vision focus handoff and arrow viewport
on:
  push:
    branches: [fix/home-cards-vision-controls-20261115]
    paths: [.github/workflows/vision-feedback-handoff-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7712d02a06827f83120aa7d6f979a4619e5e9de
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - name: Add read-only diagnostics and deterministic handoff regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Home/VisionDialog.tsx')
          s = p.read_text()
          old = "  dialog.toggleAttribute('data-exterior-nav', window.innerWidth > 760 && room >= 72);"
          assert s.count(old) == 1
          s = s.replace(old, old + "\n  const debug = window as unknown as { navProbe?: unknown[] };\n  (debug.navProbe ??= []).push({ time: performance.now(), inner: innerWidth, root: document.documentElement.clientWidth, width: viewport?.width, left: viewport?.offsetLeft, scale: viewport?.scale, room, box: box.toJSON() });")
          p.write_text(s)
          p = Path('tests/e2e/public-astrid-vision-entry.spec.ts')
          s = p.read_text()
          old = "textWidth: node.querySelector('.astrid-vision-details-scroll')!.clientWidth };"
          assert s.count(old) == 1
          s = s.replace(old, "textWidth: node.querySelector('.astrid-vision-details-scroll')!.clientWidth,\n        viewport: { width: visualViewport?.width, scale: visualViewport?.scale, left: visualViewport?.offsetLeft, inner: innerWidth, root: document.documentElement.clientWidth },\n        navProbe: (window as unknown as { navProbe?: unknown[] }).navProbe };")
          s += '''

          test('closing native dialog preserves a subsequent explicit focus handoff', async ({ page, request }, info) => {
            const response = await request.get(FEED); expect(response.ok()).toBe(true);
            const feed = await response.json() as PublicVisionContent;
            await page.route(FEED, route => route.fulfill({ json: feed }));
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('/vision', { waitUntil: 'domcontentloaded' });
            const opener = page.locator('.astrid-vision-principles > li').first().getByRole('button');
            const target = page.locator('.astrid-vision-standards-list > li').first().getByRole('button');
            await expect(target).toBeAttached({ timeout: 30000 });
            await opener.focus(); await page.keyboard.press('Enter');
            await expect(page.getByRole('dialog')).toHaveAttribute('data-ready', 'true');
            const handoff = await page.evaluate(() => {
              const target = document.querySelector<HTMLButtonElement>('.astrid-vision-standards-list > li button')!;
              const dialog = document.querySelector<HTMLDialogElement>('dialog')!;
              dialog.close();
              target.focus({ preventScroll: true });
              return { focused: document.activeElement === target, open: dialog.open };
            });
            expect(handoff).toEqual({ focused: true, open: false });
            // Wait for React removal, not just the disappearance of native modality.
            await expect(page.locator('dialog.astrid-vision-details')).toHaveCount(0);
            const result = await target.evaluate(node => ({ active: document.activeElement?.getAttribute('aria-label'), intended: node.getAttribute('aria-label'), preserved: document.activeElement === node }));
            record(`focus-handoff-${info.project.name}`, result);
            await expect(target).toBeFocused();
            await page.keyboard.press('Enter');
            await expect(page.getByRole('dialog')).toHaveAccessibleName(feed.principles[0].title);
          });
          '''
          p.write_text(s)
          PY
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium focus baseline
        run: |
          mkdir -p evidence
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE=evidence/chromium.json npx playwright test --config playwright.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --project=chromium-desktop --grep 'closing native dialog preserves' --output=test-results/probe-chromium --reporter=line,json
          result=$?
          echo "$result" > evidence/chromium.exit
          exit 0
      - name: WebKit focus and resize baseline
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_FILE=evidence/webkit.json npx playwright test --config playwright.vision.config.ts tests/e2e/public-astrid-vision-entry.spec.ts --grep 'closing native dialog preserves|feedback follow-up arrows' --output=test-results/probe-webkit --reporter=line,json
          result=$?
          echo "$result" > evidence/webkit.exit
          exit 0
      - name: Preserve exact source and diagnostic output
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          git diff > evidence/diagnostics.patch
          cp -R test-results/vision-captures evidence/captures
          tar -czf evidence/source.tar.gz src/pages/Home/VisionDialog.tsx src/pages/Home/PublicAstridVision.tsx src/pages/Home/PublicAstridVision.css src/pages/Home/PublicAstridSite.tsx src/pages/Home/PublicAstridSite.css src/pages/Home/publicAstridNavigation.ts src/pages/Home/PublicAstridCallouts.tsx tests/e2e/public-astrid-vision-entry.spec.ts tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts tests/e2e/public-astrid-home-chips.spec.ts tests/e2e/public-astrid-roundtrip.spec.ts playwright.config.ts playwright.vision.config.ts playwright.home-webkit.config.ts .github/workflows/public-vision.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vision-feedback-handoff-probe
          path: evidence/
          retention-days: 7
