# Default vitest run per push (testing plan UP.1). The checkout lane (npm run test:checkout) needs sibling repos and does not run here.
name: Tests

on:
  push:
    branches: [main, release-1, "int/**", "release/*/main"]
  pull_request:
    branches: [main, "release/*/main", "release/14/plan-61"]
  workflow_dispatch:
    inputs:
      p61_real_run:
        description: Run the Plan 61 packet's real installed-stack proof on a hosted Mac
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A later push to main must never cancel the release guard for an earlier one: every push to main is checked.
  # Release mains (release/<N>/main) are exempt too: each push to them runs in full.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main')) }}

jobs:
  plan61-real-macos:
    name: Plan 61 real hosted Mac
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/p61/rb-6' && inputs.p61_real_run }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      P61_TOOL_CHECKOUT: ${{ github.workspace }}/p61-startup-tool
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the exact RB-9 tool candidate
        uses: actions/checkout@v4
        with:
          ref: 082b0a1ba2190ea9fd0b3645bd01f588cee87ac3
          path: p61-startup-tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record hosted Mac identity and disk
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Darwin
          test "$GITHUB_REF" = refs/heads/p61/rb-6
          P61_PROOF="$(mktemp -d "$RUNNER_TEMP/p61-proof.XXXXXXXX")"
          printf 'P61_PROOF=%s\n' "$P61_PROOF" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            node --version
            python3 --version
            sqlite3 --version
            df -Pk "$HOME" "$RUNNER_TEMP"
          } | tee "$P61_PROOF/runner.txt"
      - name: Plan 61 existing focused test inventory
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$P61_PROOF/focused.junit.xml" \
            scripts/astrid-release/release.test.mjs scripts/astrid-release/workflow.test.mjs \
            scripts/installer/manifest.test.mjs
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$P61_PROOF/startup.junit.xml" \
            "$P61_TOOL_CHECKOUT/scripts/astrid-release/startup.test.mjs"
      - name: Native attach, wrong-id, schema and read-only refusal cases
        shell: bash
        run: |
          set -euo pipefail
          P61_NATIVE_ROOT="$(mktemp -d "$RUNNER_TEMP/p61-native.XXXXXXXX")"
          trap 'rm -rf "$P61_NATIVE_ROOT"' EXIT
          P61_RUNTIME_SHA="$(node -e 'process.stdout.write(require("./public/install-manifest.json").runtime.sha)')"
          git init --quiet "$P61_NATIVE_ROOT/runtime"
          git -C "$P61_NATIVE_ROOT/runtime" remote add origin https://github.com/banodoco/astrid-runtime.git
          git -C "$P61_NATIVE_ROOT/runtime" fetch --quiet --depth=1 origin "$P61_RUNTIME_SHA"
          git -C "$P61_NATIVE_ROOT/runtime" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$P61_NATIVE_ROOT/runtime" rev-parse HEAD)" = "$P61_RUNTIME_SHA"
          python3 -m venv "$P61_NATIVE_ROOT/venv"
          "$P61_NATIVE_ROOT/venv/bin/python" -m pip install -e "$P61_NATIVE_ROOT/runtime" -e "$P61_NATIVE_ROOT/runtime/packages/python"
          REALM_TEST_PYTHON="$P61_NATIVE_ROOT/venv/bin/python" \
            bash scripts/astrid-release/test-realm-snapshot.sh 2>&1 | tee "$P61_PROOF/native-realm.log"
          python3 scripts/astrid-release/hosted-negative.py 2>&1 | tee "$P61_PROOF/unreadable-source.log"
      - name: Install the frozen Release 13 live control
        run: python3 scripts/astrid-release/hosted-proof.py bootstrap
      - name: Create durable live timeline history and record live-before facts
        run: python3 scripts/astrid-release/hosted-proof.py seed
      - name: Completion 1 - stop the real installer-started empty-realm Runtime
        run: python3 scripts/astrid-release/hosted-proof.py half-built
      - name: Completion 2 and 3 - fresh real attach and Playwright playback
        run: python3 scripts/astrid-release/hosted-proof.py fresh
      - name: Completion 4 - one editor edit survives restart
        run: python3 scripts/astrid-release/hosted-proof.py restart-edit
      - name: Completion 5 to 7 - unchanged and refused updates
        run: python3 scripts/astrid-release/hosted-proof.py updates
      - name: Negative cases and complete stack-process stop
        run: python3 scripts/astrid-release/hosted-proof.py negatives
      - name: Completion 8 and 11 - repeated fresh first starts and fresh checkout
        run: python3 scripts/astrid-release/hosted-proof.py fresh-repeats
      - name: Retain diagnostics and actual free disk on success or failure
        if: ${{ always() && env.P61_PROOF != '' }}
        run: python3 scripts/astrid-release/hosted-proof.py diagnostics
      - name: Stop only this runner's owned release stack on success or failure
        if: ${{ always() && env.P61_PROOF != '' }}
        run: python3 scripts/astrid-release/hosted-proof.py cleanup
      - name: Completion 10 - compare the live control after the run
        if: ${{ always() && env.P61_PROOF != '' }}
        run: python3 scripts/astrid-release/hosted-proof.py final
      - name: Retain Plan 61 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p61-real-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P61_PROOF }}
          if-no-files-found: error
          retention-days: 14

  # Install tuple (manifest minus release/required, plus public/install*) and release move together:
  # a tuple change needs release +1 exactly; otherwise release is unchanged. Base is the PR base or the push's before SHA.
  release-guard:
    # Only against main: inside a release branch the tuple may change more than once before publication,
    # and the guard's "+1 exactly" is checked when main is fast-forwarded to the release branch.
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Check install tuple and release
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/installer/release-guard.mjs "$BASE_SHA" HEAD --pins

  # A pull request into a release branch comes from a branch of that release and names what it belongs
  # to: the plan (a plan branch does so by its name) or the astrid-dev issue. See the Release skill,
  # "How a release runs".
  landing-reference:
    name: landing reference
    if: ${{ github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from a branch of this release and names its plan or issue
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          release="${BASE_REF#release/}"; release="${release%/main}"
          if ! printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/[a-z0-9][a-z0-9-]*$" || [ "$HEAD_REF" = "$BASE_REF" ]; then
            echo "::error::A pull request into ${BASE_REF} must come from a branch of that release: release/${release}/plan-<PP> or release/${release}/<topic>. This one comes from '${HEAD_REF}'."
            exit 1
          fi
          if printf '%s' "$HEAD_REF" | grep -Eq "^release/${release}/plan-[0-9]+$"; then
            echo "Plan branch: $HEAD_REF"; exit 0
          fi
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq '(plan[ -]?[0-9]+|astrid-dev#[0-9]+|astrid-dev/issues/[0-9]+)'; then
            echo "Reference found."; exit 0
          fi
          echo "::error::A pull request into a release branch must name the plan or the astrid-dev issue it belongs to, for example 'Plan 55' or 'banodoco/astrid-dev#721'."
          exit 1

  # Pull requests into main run only release-guard above. Pull requests into a release branch also run vitest and
  # boundary. The macOS job also runs on Plan 61 PRs for native realm fixture proof.
  vitest:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main')) }}
    # Pinned: Playwright does not support Chromium on ubuntu-latest (ubuntu 26.04) for this job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the git-backed checks that run on push.
          fetch-depth: 0
          filter: blob:none
      - name: Read the Agent and Runtime pins from the App manifest
        id: pins
        run: |
          node -e '
            const m = require("./public/install-manifest.json");
            const agent = m.agent?.sha, runtime = m.runtime?.sha;
            for (const sha of [agent, runtime]) if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error(`manifest pin is not a full SHA: ${sha}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `agent_sha=${agent}\nruntime_sha=${runtime}\n`);'
      - name: Restore npm cache (C-08)
        id: c08-app-test-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: node --test scripts/installer/release.test.mjs
      - run: npm ci --legacy-peer-deps
      # The P1 corpus tests read git blobs from the Agent at the release-12 pin (public/install-manifest.json).
      # ASTRID_AGENT_CHECKOUT points them there; a missing checkout fails the test instead of skipping it.
      - name: Check out the pinned Agent for the P1 corpus
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-agent
          fetch-depth: 0
      # Browser-backed unit tests launch Playwright's Chromium from the default cache.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm test
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/astrid-agent
      - run: npm run test:sdk-boundary

  # The release tooling is macOS-only by design (lockf broker, BSD ps eww, darwin-pinned attestation), so the vitest job
  # declares these cases as skipped (config/testing/skipRegistry.mjs: macos-release-process-containment, macos-lockf-broker)
  # and this job runs exactly those files where the condition holds. Plain node: these files import only the repo.
      - name: Save npm cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-app-test-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}"
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

  release-tooling-macos:
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'release/14/plan-61' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/quality/node-skip-guard-reporter.mjs --test-reporter-destination=stdout scripts/release/bounded-command.test.mjs scripts/release/astrid-release-provenance.test.mjs scripts/release/verify-extension-ship.test.mjs
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'release/14/plan-61' }}
        with:
          python-version: "3.11"
      - name: Plan 61 release, manifest and native realm fixtures
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'release/14/plan-61' }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --version
          python3 --version
          sqlite3 --version
          node --test scripts/astrid-release/release.test.mjs scripts/astrid-release/workflow.test.mjs scripts/installer/manifest.test.mjs
          P61_NATIVE_ROOT="$(mktemp -d "$RUNNER_TEMP/p61-native.XXXXXXXX")"
          trap 'rm -rf "$P61_NATIVE_ROOT"' EXIT
          P61_RUNTIME_SHA="$(node -e '
            const sha = require("./public/install-manifest.json").runtime?.sha;
            if (!/^[0-9a-f]{40}$/.test(sha ?? "")) throw new Error("Runtime pin must be a full SHA");
            process.stdout.write(sha);')"
          git init --quiet "$P61_NATIVE_ROOT/runtime"
          git -C "$P61_NATIVE_ROOT/runtime" remote add origin https://github.com/banodoco/astrid-runtime.git
          git -C "$P61_NATIVE_ROOT/runtime" fetch --quiet --depth=1 origin "$P61_RUNTIME_SHA"
          git -C "$P61_NATIVE_ROOT/runtime" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$P61_NATIVE_ROOT/runtime" rev-parse HEAD)" = "$P61_RUNTIME_SHA"
          python3 -m venv "$P61_NATIVE_ROOT/venv"
          PIP_CACHE_DIR="$P61_NATIVE_ROOT/pip-cache" "$P61_NATIVE_ROOT/venv/bin/python" -m pip install \
            -e "$P61_NATIVE_ROOT/runtime" -e "$P61_NATIVE_ROOT/runtime/packages/python"
          bash -n scripts/astrid-release/astrid-release
          bash -n scripts/astrid-release/realm-snapshot.sh
          bash -n scripts/astrid-release/test-realm-snapshot.sh
          REALM_TEST_PYTHON="$P61_NATIVE_ROOT/venv/bin/python" \
            bash scripts/astrid-release/test-realm-snapshot.sh

  # Cross-repo copies: every vendored artifact must match its selected producer commit.
  boundary:
    if: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/') && endsWith(github.base_ref, '/main')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - id: pins
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const runtime = JSON.parse(fs.readFileSync('runtime.lock.json', 'utf8'));
          const astrid = JSON.parse(fs.readFileSync('config/astrid-cli-surface/vendor.lock.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('public/install-manifest.json', 'utf8'));
          process.stdout.write(`runtime_sha=${runtime.source_commit}\nastrid_sha=${astrid.source_commit}\nagent_sha=${manifest.agent.sha}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: ${{ steps.pins.outputs.runtime_sha }}
          path: runtime-producer
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.pins.outputs.agent_sha }}
          path: astrid-producer
      - run: |
          node scripts/vendor-lock.mjs check runtime.lock.json --producer runtime-producer
      - run: node scripts/vendor-lock.mjs check config/astrid-cli-surface/vendor.lock.json --producer astrid-producer
      - run: node --test scripts/quality/astrid-public-boundary.test.mjs
      - run: node scripts/build/verify-astrid-vendor-sources.mjs
