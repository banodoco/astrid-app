        if-no-files-found: ignore
    - name: Save npm cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-e2e-3.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
  extension-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-app
        ref: ${{ inputs.app_sha }}
        persist-credentials: false
    - name: Assert and record app checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.app_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "app" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore npm cache (C-08)
      id: c08-app-e2e-2
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - uses: actions/setup-node@v4
      with:
        node-version: 20.19.0
    - run: npm ci --legacy-peer-deps
    - run: npx playwright install --with-deps chromium
    - run: npm run test:e2e:extension-visual
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: extension-visual-results
        path: artifacts
        if-no-files-found: ignore
    - name: Save npm cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-app-e2e-2.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
  extension-cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-app
        ref: ${{ inputs.app_sha }}
        persist-credentials: false
    - name: Assert and record app checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.app_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "app" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore npm cache (C-08)
      id: c08-app-e2e-1
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/npm-cache' || '~/.npm' }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - uses: actions/setup-node@v4
