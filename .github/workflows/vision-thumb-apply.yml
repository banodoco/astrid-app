name: Apply scoped vision reachability refinement

on:
  push:
    branches: [fix/vision-thumb-controls-20261113]
    paths: [.github/workflows/vision-thumb-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vision-thumb-controls-20261113
      - name: Apply exact-source presentation and regression changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          def checked(path, sha):
              data = Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, (path, actual, sha)
              return data.decode()

          def replace_once(text, old, new):
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new)

          path = 'src/pages/Home/PublicAstridVision.tsx'
          text = checked(path, 'f362a6a07bf39889b6491060c4a4abb09bd8232f')
          text = replace_once(text,
              '<span className="astrid-vision-principle-corner" aria-hidden="true">\n                Details <span',
              '<span className="astrid-vision-principle-corner">\n                <SubjectCounts content={content} subject={{ kind: \'principle\', id: principle.id }} /> <span')
          text = replace_once(text, 'data-index="04">Help us</p>', 'data-index="04">Help</p>')
          text = replace_once(text,
              "onClick={event => openCatalog('projects', event.currentTarget)}>See all projects <PixelArrow /></button>",
              "onClick={event => openCatalog('projects', event.currentTarget)}>See all projects</button>\n              <span className=\"astrid-vision-catalog-divider\" aria-hidden=\"true\">|</span>")
          text = replace_once(text,
              "onClick={event => openCatalog('gaps', event.currentTarget)}>See all gaps <PixelArrow /></button>",
              "onClick={event => openCatalog('gaps', event.currentTarget)}>See all gaps</button>")
          Path(path).write_text(text)

          path = 'src/pages/Home/VisionSectionNav.tsx'
          text = checked(path, '4b9bfe3c43479d6f6435221f3d4617324df74b0c')
          Path(path).write_text(replace_once(text, "label: 'Help us'", "label: 'Help'"))

          path = 'src/pages/Home/VisionMobileLayout.css'
          text = checked(path, 'c6155222e4619e3455b7664c9a6f717f8256c9c0')
          # Replace the old catalog button skin rather than stacking competing rules.
          start = text.index('.astrid-vision-catalog-actions {')
          end = text.index('.astrid-vision > .astrid-vision-details {', start)
          text = text[:start] + '''/* Text actions remain generous touch targets without looking like boxed buttons. */
          .astrid-vision-catalog-actions { display: flex; align-items: center; gap: 0; margin-top: 12px; }
          .astrid-vision-catalog-actions button {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 8px 0; border: 0; border-radius: 0;
            background: transparent; color: var(--astrid-ink);
            font: 500 14px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
            cursor: pointer; white-space: nowrap; text-underline-offset: 4px;
          }
          .astrid-vision-catalog-actions button:hover { color: var(--astrid-accent); text-decoration: underline; }
          .astrid-vision-catalog-actions button:focus-visible { outline: 2px solid var(--astrid-accent); outline-offset: 3px; }
          .astrid-vision-catalog-divider { flex: none; margin-inline: 14px; color: var(--astrid-muted); }
          ''' + text[end:]
          text = replace_once(text,
              '  .astrid-vision-catalog-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n  .astrid-vision-catalog-actions button { padding: 12px 10px; gap: 6px; font-size: 13px; text-align: left; }\n  .astrid-vision-catalog-actions svg { flex: none; }',
              '  .astrid-vision-catalog-actions button { font-size: 13px; }\n  .astrid-vision-catalog-divider { margin-inline: 12px; }')
          text += '''
          /* Thumb-friendly phone controls. Desktop keeps its heading above the content. */
          @media (max-width: 760px) {
            /* Auto margin consumes spare space, but becomes zero if links must scroll:
               the first link remains reachable on small or enlarged-text displays. */
            .astrid-vision .astrid-vision-section-nav { justify-content: flex-start; align-self: flex-start; }
            .astrid-vision-section-nav a { padding-inline: 7px; }
            .astrid-vision-section-nav a:first-child { margin-inline-start: auto; }

            /* Full-width heading; the original sigil stays to the right of the preview. */
            .astrid-vision .astrid-vision-standards-list > li {
              grid-template-columns: minmax(0, 1fr) 72px;
              grid-template-rows: auto auto auto;
              column-gap: 12px; padding: 16px;
            }
            .astrid-vision .astrid-vision-standards-list > li > div { display: contents; }
            .astrid-vision .astrid-vision-standards-list > li h3 {
              grid-column: 1 / -1; grid-row: 1;
              margin: 0 0 10px; font-size: clamp(16px, 4.6vw, 20px); line-height: 1.2;
              /* Actual titles fit on one line. Enlarged or future longer titles may
                 wrap instead of being silently clipped or shrinking indefinitely. */
              overflow-wrap: normal;
            }
            .astrid-vision .astrid-vision-standards-list > li :is(.astrid-vision-principle-statement, .astrid-vision-markdown) {
              grid-column: 1; grid-row: 2; min-width: 0; margin: 0;
              font-size: 14px; line-height: 1.5;
              display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
              overflow: hidden;
            }
            .astrid-vision .astrid-vision-standards-list > li .astrid-vision-principle-sigil {
              grid-column: 2; grid-row: 2 / 4; align-self: center;
            }
            .astrid-vision .astrid-vision-standards-list > li .astrid-vision-principle-corner {
              grid-column: 1; grid-row: 3; margin-top: 12px; line-height: 1.4;
            }

            /* Keep the complete title and the close control in a stationary bottom
               bar. Only the content above it scrolls; native modal handling is unchanged. */
            .astrid-vision > .astrid-vision-details {
              top: auto; right: 0; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; margin: 0;
            }
            .astrid-vision-details-shell { flex-direction: column-reverse; }
            .astrid-vision-details-header {
              align-items: center; border-bottom: 0; border-top: 1px solid var(--astrid-line);
              padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
            }
            .astrid-vision-details-eyebrow { margin-bottom: 6px; font-size: 10px; }
            .astrid-vision-details-header h2 { font-size: clamp(23px, 6vw, 30px); }
          }
          @media (max-width: 360px) {
            /* Reserve room for every navigation link on the narrowest phones. */
            .astrid-vision-bar .astrid-vision-brand-name { max-width: 0; opacity: 0; }
            .astrid-vision-bar .astrid-vision-brand { gap: 0; }
          }
          '''
          Path(path).write_text(text)

          # These assertions change only because the owner renamed a visible label
          # and gave principle headings their own row. Preserve all test cases.
          for path in Path('tests/e2e').glob('public-astrid-vision-*.spec.ts'):
              old = path.read_text()
              new = old.replace('Help us', 'Help')
              if path.name == 'public-astrid-vision-sigils-nav.spec.ts':
                  new = replace_once(new,
                      r'index < 4 ? /\d+ gaps?.*\d+ projects?/i : /Details/i',
                      r'/\d+ gaps?.*\d+ projects?/i')
                  new = replace_once(new, "text: rect('div'),",
                      "text: rect('.astrid-vision-principle-statement, .astrid-vision-markdown'),")
              if new != old:
                  path.write_text(new)

          path = Path('tests/e2e/public-astrid-vision-mobile-catalogs.spec.ts')
          tests = path.read_text()
          tests += r'''

          async function expectReachableFrame(page: Page, width: number) {
            const dialog = page.getByRole('dialog');
            const header = dialog.locator('.astrid-vision-details-header');
            const frame = dialog.locator('.astrid-vision-details-scroll-frame');
            const close = dialog.getByRole('button', { name: 'Close details' });
            const [panelBox, headerBox, frameBox, closeBox] = await Promise.all([
              dialog.boundingBox(), header.boundingBox(), frame.boundingBox(), close.boundingBox(),
            ]);
            expect(panelBox).not.toBeNull(); expect(headerBox).not.toBeNull();
            expect(frameBox).not.toBeNull(); expect(closeBox).not.toBeNull();
            if (width <= 760) {
              expect(frameBox!.y + frameBox!.height).toBeLessThanOrEqual(headerBox!.y + 1);
              expect(Math.abs(headerBox!.y + headerBox!.height - panelBox!.y - panelBox!.height)).toBeLessThan(2);
              expect(closeBox!.y).toBeGreaterThan(page.viewportSize()!.height - 150);
              expect(closeBox!.width).toBeGreaterThanOrEqual(44);
              expect(closeBox!.height).toBeGreaterThanOrEqual(44);
            } else {
              expect(headerBox!.y + headerBox!.height).toBeLessThanOrEqual(frameBox!.y + 1);
            }
            const before = closeBox!.y;
            await dialog.locator('.astrid-vision-details-scroll').evaluate(node => { node.scrollTop = node.scrollHeight; });
            expect(Math.abs((await close.boundingBox())!.y - before)).toBeLessThan(1);
            expect(await dialog.evaluate(node => node.scrollWidth <= node.clientWidth + 1)).toBe(true);
          }

          for (const width of [320, 390]) {
            test(`compact principles, text catalogs and reachable bottom controls at ${width}px`, async ({ page, request }, info) => {
              const response = await request.get(FEED);
              expect(response.ok()).toBeTruthy();
              const feed = await response.json() as PublicVisionContent;
              await page.route(FEED, route => route.fulfill({ json: feed }));
              await page.emulateMedia({ reducedMotion: 'reduce' });
              await page.setViewportSize({ width, height: 844 });
              await page.goto('/vision', { waitUntil: 'domcontentloaded' });
              await page.evaluate(() => document.fonts.ready);
              const nav = page.getByRole('navigation', { name: 'Vision page sections' });
              await expect(nav.getByRole('link', { name: 'Help', exact: true })).toBeVisible();
              await expect(nav.getByRole('link', { name: 'Help us', exact: true })).toHaveCount(0);
              const cards = page.locator('.astrid-vision-standards-list > li');
              await cards.first().scrollIntoViewIfNeeded();
              // Measure after the wordmark has finished folding. The final link
              // shares the header's right inset, rather than leaving spare space.
              await expect.poll(async () => nav.evaluate(node => {
                const bar = node.closest('.astrid-vision-bar')!;
                const last = node.querySelector('a:last-child')!;
                return Math.abs(last.getBoundingClientRect().right -
                  (bar.getBoundingClientRect().right - Number.parseFloat(getComputedStyle(bar).paddingRight)));
              })).toBeLessThan(2);
              for (const [index, principle] of feed.principles.entries()) {
                const card = cards.nth(index);
                const hierarchy = aspirationsForSubject(feed, { kind: 'principle', id: principle.id });
                const groups = [...hierarchy.aspirations.flatMap(item => item.gaps), ...hierarchy.legacyGaps];
                const gaps = new Set(groups.map(item => item.gap.id)).size;
                const projects = new Set(groups.flatMap(item => item.projects.map(project => project.id))).size;
                await expect(card.locator('.astrid-vision-subject-counts'))
                  .toHaveText(`${gaps} ${gaps === 1 ? 'gap' : 'gaps'} · ${projects} ${projects === 1 ? 'project' : 'projects'}`);
                await expect(card.locator('h3')).toHaveText(principle.title);
                await expect(card.locator('.astrid-vision-principle-statement')).toHaveText(principle.statement!);
                const geometry = await card.evaluate(node => {
                  const title = node.querySelector('h3')!;
                  const copy = node.querySelector('.astrid-vision-principle-statement')!;
                  const sigil = node.querySelector('.astrid-vision-principle-sigil')!;
                  return { card: node.getBoundingClientRect().toJSON(), title: title.getBoundingClientRect().toJSON(),
                    copy: copy.getBoundingClientRect().toJSON(), sigil: sigil.getBoundingClientRect().toJSON(),
                    titleLine: Number.parseFloat(getComputedStyle(title).lineHeight),
                    copyLine: Number.parseFloat(getComputedStyle(copy).lineHeight),
                    clamp: getComputedStyle(copy).webkitLineClamp,
                    noOverflow: node.scrollWidth <= node.clientWidth + 1 };
                });
                expect(geometry.title.height).toBeLessThanOrEqual(geometry.titleLine + 1);
                expect(geometry.title.width).toBeGreaterThan(geometry.copy.width + 60);
                expect(geometry.copy.height).toBeLessThanOrEqual(geometry.copyLine * 2 + 1);
                expect(geometry.clamp).toBe('2');
                expect(geometry.sigil.x).toBeGreaterThanOrEqual(geometry.copy.x + geometry.copy.width);
                expect(geometry.card.height).toBeLessThan(175);
                expect(geometry.noOverflow).toBe(true);
              }
              mkdirSync(folder, { recursive: true });
              writeFileSync(`${folder}/thumb-controls-${info.project.name}-${width}-source.json`, JSON.stringify(feed.source));
              await page.locator('.astrid-vision-standards').screenshot({ path: `${folder}/real-compact-principles-${info.project.name}-${width}.png` });
              await cards.first().getByRole('button').click();
              await expectReachableFrame(page, width);
              // Preview clamping does not shorten or replace the complete source in the popup.
              await expect(page.getByRole('dialog').locator('.astrid-vision-details-statement')).toHaveText(feed.principles[0].statement!);
              await page.getByRole('dialog').locator('.astrid-vision-details-scroll').evaluate(node => { node.scrollTop = 0; });
              await page.screenshot({ path: `${folder}/real-bottom-principle-${info.project.name}-${width}.png` });
              await page.getByRole('button', { name: 'Close details' }).click();
              await expect(page.getByRole('dialog')).toHaveCount(0);

              const actions = page.locator('.astrid-vision-catalog-actions');
              await actions.scrollIntoViewIfNeeded();
              await expect(actions.locator('.astrid-vision-catalog-divider')).toHaveText('|');
              await expect(actions.locator('.astrid-vision-catalog-divider')).toHaveAttribute('aria-hidden', 'true');
              await expect(actions.locator('button')).toHaveText(['See all projects', 'See all gaps']);
              for (const button of await actions.locator('button').all()) {
                await expect(button).toHaveCSS('border-top-width', '0px');
                await expect(button).toHaveCSS('border-left-width', '0px');
                await expect(button).toHaveCSS('background-color', 'rgba(0, 0, 0, 0)');
                expect((await button.boundingBox())!.height).toBeGreaterThanOrEqual(44);
              }
              expect(await actions.evaluate(node => node.scrollWidth <= node.clientWidth + 1)).toBe(true);
              await page.locator('.astrid-vision-contribute').screenshot({ path: `${folder}/real-text-catalog-actions-${info.project.name}-${width}.png` });
              for (const kind of ['gaps', 'projects'] as const) {
                const trigger = actions.getByRole('button', { name: 'See all ' + kind, exact: true });
                await trigger.focus(); await page.keyboard.press('Enter');
                await expect(page.getByRole('dialog', { name: 'All ' + kind })).toBeVisible();
                await expectReachableFrame(page, width);
                await page.keyboard.press('Escape');
                await expect(page.getByRole('dialog')).toHaveCount(0);
                await expect(trigger).toBeFocused();
              }
              expect(await page.evaluate(() => document.documentElement.scrollWidth)).toBeLessThanOrEqual(width + 1);
            });
          }

          test('desktop dialog headings remain above their scrolling content', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto('/vision', { waitUntil: 'domcontentloaded' });
            await page.locator('.astrid-vision-standards-list > li').first().getByRole('button').click();
            await expectReachableFrame(page, 1440);
            await page.keyboard.press('Escape');
            await expect(page.getByRole('dialog')).toHaveCount(0);
          });
          '''
          path.write_text(tests)
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Home/PublicAstridVision.tsx src/pages/Home/VisionSectionNav.tsx src/pages/Home/VisionMobileLayout.css tests/e2e/public-astrid-vision-*.spec.ts
          git commit -m 'fix(vision): compact principles and make mobile popup controls reachable'
          git push origin HEAD:fix/vision-thumb-controls-20261113
