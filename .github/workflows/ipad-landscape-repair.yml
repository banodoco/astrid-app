name: Landscape Home viewport repair
on:
  push:
    branches: [fix/ipad-landscape-home-overflow-20261116]
    paths: [.github/workflows/ipad-landscape-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-landscape-home-overflow-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install webkit
      - name: Add focused large versus visible viewport regressions
        shell: bash
        run: |
          mkdir -p landscape-proof
          git rev-parse HEAD HEAD^{tree} > landscape-proof/base.txt
          test "$(git hash-object src/pages/Home/PublicAstridShell.css)" = da3e4dc4a575d2ec0987d2aa96cc799ad128a911
          cat >> tests/e2e/public-astrid-home-chips.spec.ts <<'SPEC'

          // Hosted WebKit has no collapsing browser toolbar: vh and dvh coincide.
          // Model that one missing input by resolving ONLY Home's legacy 100vh
          // minimum to the larger viewport. Do not change dynamic units, layout,
          // media/readiness, navigation, or any overflow/scroll implementation.
          test.describe('landscape tablet visible viewport', () => {
            test.use({ isMobile: true, hasTouch: true, deviceScaleFactor: 2,
              screen: { width: 1180, height: 820 }, viewport: { width: 1180, height: 700 } });
            for (const audience of ['app', 'agent']) {
              test(`Home has no toolbar-sized tail on ${audience} return`, async ({ page, request }, info) => {
                test.setTimeout(180000);
                await page.emulateMedia({ reducedMotion: 'no-preference' });
                const feedUrl = 'https://raw.githubusercontent.com/banodoco/astrid-dev/vision-published/vision.json';
                const response = await request.get(feedUrl); expect(response.ok()).toBe(true);
                await page.route(feedUrl, route => route.fulfill({ json: response.json() }));
                // Resolve the response before routing; the original Home videos are untouched.
                await page.unroute(feedUrl);
                const feed = await response.json();
                await page.route(feedUrl, route => route.fulfill({ json: feed }));
                await page.goto('/home', { waitUntil: 'domcontentloaded' });
                await expect(page.locator('.astrid-callouts > article')).toHaveCount(3, { timeout: 60000 });
                const home = page.locator('.astrid-public-site');
                if (audience === 'agent') await home.getByRole('button', { name: 'Agent', exact: true }).tap();
                await expect(home).toHaveAttribute('data-audience', audience);
                await page.evaluate(() => document.fonts.ready);
                await page.waitForTimeout(1800);
                const model = await page.evaluate(() => {
                  const records: { before: string; after: string }[] = [];
                  const walk = (rules: CSSRuleList) => {
                    for (const rule of Array.from(rules)) {
                      if (rule instanceof CSSStyleRule && rule.selectorText === '.astrid-public-site' && rule.style.minHeight) {
                        const before = rule.style.minHeight;
                        if (before === '100vh') rule.style.minHeight = `${innerHeight + 120}px`;
                        records.push({ before, after: rule.style.minHeight });
                      }
                      if ('cssRules' in rule) walk((rule as CSSGroupingRule).cssRules);
                    }
                  };
                  for (const sheet of Array.from(document.styleSheets)) {
                    if (!sheet.href || new URL(sheet.href).origin === location.origin) walk(sheet.cssRules);
                  }
                  return { small: innerHeight, large: innerHeight + 120, records };
                });
                expect(model.records.length).toBeGreaterThan(0);
                const samples: unknown[] = [];
                const save = () => record(`landscape-viewport-${info.project.name}-${audience}`, { model, source: feed.source, samples });
                for (const height of [700, 820, 640]) {
                  await page.setViewportSize({ width: 1180, height });
                  await page.evaluate(() => new Promise<void>(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve()))));
                  await page.evaluate(() => scrollTo({ top: 10000, behavior: 'instant' }));
                  const geometry = await home.evaluate(node => ({
                    viewport: innerHeight, scroll: scrollY, document: document.documentElement.scrollHeight,
                    home: node.getBoundingClientRect().toJSON(), minimum: getComputedStyle(node).minHeight,
                    controls: ['.astrid-brand', 'h1', '.astrid-audience-switch', '.astrid-hero-actions', '.astrid-hero-note'].map(selector => ({
                      selector, rect: node.querySelector(selector)!.getBoundingClientRect().toJSON(),
                    })),
                  }));
                  samples.push({ height, geometry }); save();
                  expect.soft(geometry.document, 'no page below the visible scene').toBeLessThanOrEqual(height + 1);
                  expect.soft(geometry.scroll, 'no empty Home scroll offset to remember').toBe(0);
                  for (const box of geometry.controls) {
                    expect.soft(box.rect.top, box.selector).toBeGreaterThanOrEqual(-1);
                    expect.soft(box.rect.bottom, box.selector).toBeLessThanOrEqual(height + 1);
                  }
                  if (height === 700) await page.screenshot({ path: `${folder}/landscape-home-${info.project.name}-${audience}.png` });
                  await home.getByRole('link', { name: 'Vision', exact: true }).click();
                  await expect(page.locator('.astrid-vision-principles > li')).toHaveCount(4);
                  await expect(page.locator('html')).not.toHaveAttribute('data-astrid-page-transition');
                  await page.evaluate(() => scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' }));
                  expect(await page.evaluate(() => scrollY)).toBeGreaterThan(500);
                  await page.evaluate(() => {
                    const w = window as unknown as { landscapeReturn: { frames: { y: number; top: number; overflow: number }[]; done: boolean } };
                    const trace = w.landscapeReturn = { frames: [], done: false };
                    let finished = 0;
                    const started = performance.now();
                    const read = () => {
                      const active = document.querySelector('.astrid-public-site[data-astrid-lifecycle="active"]');
                      if (active) trace.frames.push({ y: scrollY, top: active.getBoundingClientRect().top,
                        overflow: document.documentElement.scrollHeight - innerHeight });
                    };
                    const observer = new MutationObserver(read);
                    observer.observe(document.documentElement, { subtree: true, attributes: true,
                      attributeFilter: ['data-astrid-lifecycle', 'data-astrid-page-transition'] });
                    const tick = () => {
                      read();
                      if (trace.frames.length && !document.documentElement.hasAttribute('data-astrid-page-transition')) finished++;
                      if (finished >= 8 || performance.now() - started > 12000) {
                        observer.disconnect(); trace.done = true; return;
                      }
                      requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                  });
                  await page.getByRole('link', { name: 'Astrid home', exact: true }).click();
                  await expect.poll(() => page.evaluate(() => (window as unknown as { landscapeReturn: { done: boolean } }).landscapeReturn.done), { timeout: 20000 }).toBe(true);
                  const trace = await page.evaluate(() => (window as unknown as { landscapeReturn: { frames: { y: number; top: number; overflow: number }[] } }).landscapeReturn);
                  samples.push({ height, trace }); save();
                  expect.soft(trace.frames.length).toBeGreaterThan(8);
                  expect.soft(trace.frames.every(frame => frame.y === 0 && Math.abs(frame.top) < 1 && frame.overflow <= 1), 'the return is fitted from its first committed frame').toBe(true);
                }
              });
            }
          });
          SPEC
          # Remove the redundant pre-route pair from this new test before it is run.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/public-astrid-home-chips.spec.ts')
          s=p.read_text()
          start="                await page.route(feedUrl, route => route.fulfill({ json: response.json() }));\n                // Resolve the response before routing; the original Home videos are untouched.\n                await page.unroute(feedUrl);\n"
          # Heredoc has no YAML indentation in the resulting file.
          start='\n'.join(line[10:] for line in start.rstrip('\n').split('\n'))+'\n'
          if start in s: s=s.replace(start,'',1)
          else:
            lines=s.splitlines(True)
            s=''.join(line for line in lines if 'json: response.json()' not in line and 'Resolve the response before routing' not in line and 'await page.unroute(feedUrl)' not in line)
          p.write_text(s)
          PY
      - name: Reproduce legacy viewport mismatch
        shell: bash
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=landscape-proof/baseline-results.json npx playwright test --config playwright.home-webkit.config.ts --project=vision-webkit-phone --grep 'landscape tablet visible viewport' --workers=1 --reporter=json > landscape-proof/baseline.log 2>&1
          result=$?
          set -e
          echo "$result" > landscape-proof/baseline-exit.txt
          cp -R test-results/vision-captures landscape-proof/baseline-captures
          python3 - <<'PY'
          import json
          d=json.load(open('landscape-proof/baseline-results.json'))
          assert d['stats']['unexpected']==2, d['stats']
          def walk(suites):
            for s in suites:
              yield from s.get('specs',[])
              yield from walk(s.get('suites',[]))
          for s in walk(d['suites']):
            errors=' '.join(str(r.get('errors')) for t in s['tests'] for r in t.get('results',[]))
            assert 'no page below the visible scene' in errors, errors[:1000]
          PY
      - name: Apply the visible-height minimum
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Home/PublicAstridShell.css'); s=p.read_text()
          old='  box-sizing: border-box;\n  min-height: 100vh;\n  padding: 0 clamp(40px, calc(15vw - 152px), 64px);'
          new='  box-sizing: border-box;\n  min-height: 100vh;\n  /* Match the visible viewport, not the larger screen behind browser chrome.\n     In landscape tablets this wide layout must not create a toolbar-sized tail. */\n  min-height: 100dvh;\n  padding: 0 clamp(40px, calc(15vw - 152px), 64px);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          git diff > landscape-proof/candidate.patch
      - name: Verify repaired visible-height and projection behavior
        shell: bash
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=landscape-proof/repaired-results.json npx playwright test --config playwright.home-webkit.config.ts --project=vision-webkit-phone --grep 'landscape tablet visible viewport|desktop player projection' --workers=1 --reporter=json > landscape-proof/repaired.log 2>&1
          cp -R test-results/vision-captures landscape-proof/repaired-captures
          git add src/pages/Home/PublicAstridShell.css tests/e2e/public-astrid-home-chips.spec.ts
          git -c user.name='POM' -c user.email='peter@omalley.io' commit -m 'fix(public-site): size landscape Home to the visible viewport'
          git rev-parse HEAD HEAD^{tree} > landscape-proof/candidate-source.txt
          git push origin HEAD:fix/ipad-landscape-home-overflow-20261116
      - name: Preserve exact source and failure evidence
        if: always()
        run: |
          mkdir -p landscape-proof
          git diff > landscape-proof/uncommitted.patch
          tar -cf landscape-proof/source.tar src/pages/Home/PublicAstridShell.css tests/e2e/public-astrid-home-chips.spec.ts
          cp -R test-results/vision-captures landscape-proof/latest-captures 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-landscape-focused-proof
          path: landscape-proof/
          if-no-files-found: error
